repo_state: 'Commit: 480ed770cbbd8a59c0ec62731c2f1c61ac597c01

  Branch: main

  Repository: https://github.com/openshift/zero-trust-workload-identity-manager


  Architecture:

  - Go operator using controller-runtime

  - API: api/v1alpha1/ (SpireServer, SpireAgent CRDs)

  - Controllers: pkg/controller/ (spire-server, spire-agent, spiffe-csi, oidc-discovery-provider)

  - Bindata: bindata/ (operand manifests for spire-server, spire-agent, spiffe-csi, spire-bundle, spire-oidc-discovery-provider)

  - Config: config/ (CRDs, RBAC, manifests, network-policy, prometheus)

  - Tests: test/e2e/

  - Hack: hack/ (build scripts, e2e coverage)

  - Harness-evals: harness-evals/ (AI development documentation)


  Key Files:

  - cmd/zero-trust-workload-identity-manager/main.go

  - api/v1alpha1/ (types, webhook validations)

  - pkg/controller/ (reconcilers for each operand)

  - pkg/operator/ (operator lifecycle)

  - bindata/ (static manifests deployed by the operator)

  '
