  QE_SCOPE_MLKM_Central_tls_fips\n\nHybrid ML-KEM CENTRAL-TLS  Scope of testing \n\n1. Current Project Situation\n\nZTWIM\
  \ Operator Environment\n\nGo Version: 1.25.7\n\ngRPC Version: 1.79.3\n\nTLS Library: Go standard crypto/tls\n\nGo 1.25.7\
  \ TLS Support Capabilities\n\nTLS Versions:\n\nTLS 1.0 & 1.1 (Deprecated)\n\nTLS 1.2 (Default minimum)\n\nTLS 1.3 (Preferred)\n\
  \nCipher Suites (TLS 1.3 — Always Enabled):\n\nTLS_AES_128_GCM_SHA256\n\nTLS_AES_256_GCM_SHA384\n\nTLS_CHACHA20_POLY1305_SHA256\n\
  \nKey Exchange Groups:\n\nX25519 (Classical, current default)\n\nX25519MLKEM768 (Hybrid Post-Quantum Cryptography, preferred\
  \ since Go 1.24+)\n\nP-256, P-384, P-521 (Classical alternatives)\n\nCurrent Behavior (Before Feature): Go 1.25.7 already\
  \ prefers X25519MLKEM768 silently when both sides support TLS 1.3. Currently, there is no CRD control, no enforcement, and\
  \ no observability.\n\n2. Feature Behavior: Enabling Hybrid ML-KEM\n\nMode A: Hybrid Mode (Enabled via CRD)\n\nSPIRE Server\
  \ and Agent will explicitly prefer X25519MLKEM768 for key exchange.\n\nIf the peer supports it: Hybrid is successfully negotiated\
  \ (Quantum-Safe).\n\nIf the peer does NOT support it: Seamlessly falls back to X25519 (Classical).\n\nMode B: Strict Mode\
  \ (mlkem-only)\n\nSPIRE Server strictly rejects any connection that cannot negotiate the hybrid key exchange.\n\nIf the\
  \ peer is old or incompatible: The TLS handshake fails and the connection is rejected.\n\n3. The Fallback Problem\n\nNot\
  \ all workloads use SPIRE, and not all workloads use Go 1.24+. These workloads cannot support ML-KEM hybrid key exchange.\n\
  \nIncompatible Peer Examples\n\nPython Applications: Running older OpenSSL (< 3.5)\n\nJava Applications: Running older JDK\
  \ (< 24)\n\nNode.js Applications: Running older OpenSSL versions\n\nExternal Services: Third-party APIs like HashiCorp Vault,\
  \ AWS, or payment gateways that may not support hybrid yet.\n\nKubernetes API Server: Running on older OpenShift Container\
  \ Platform (OCP) clusters where Go is less than version 1.24.\n\nOperational Impact\n\nIn Hybrid Mode: Falls back to X25519.\
  \ The connection works, but it is not quantum-safe.\n\nIn Strict Mode (mlkem-only): The connection is immediately rejected,\
  \ breaking the workload.\n\n4. Testing Scope & Scenarios\n\nTLS PROFILE APPLICATION (5 Test Cases)\n\nTP-01: Default Profile\
  \ (Intermediate) — Fresh Install\n\nWhat this means: When you install a brand new OpenShift cluster, it comes with a default\
  \ security setting called \"Intermediate.\" This means the cluster allows TLS 1.2 and TLS 1.3 connections, but blocks anything\
  \ older (TLS 1.0, TLS 1.1). We are checking that ZTWIM follows this rule without anyone having to configure anything.\n\n\
  What to do:\n\nInstall fresh OpenShift cluster (default settings, no manual TLS config).\n\nInstall ZTWIM operator and create\
  \ the CR.\n\nWait for all SPIRE pods to be running.\n\nTry connecting to SPIRE Server on port 8081 using different TLS versions.\n\
  \nWhat should happen:\n\nConnect with TLS 1.3 $\\rightarrow$ Connection succeeds (allowed).\n\nConnect with TLS 1.2 $\\\
  rightarrow$ Connection succeeds (allowed).\n\nConnect with TLS 1.1 $\\rightarrow$ Connection fails with error (blocked).\n\
  \nConnect with TLS 1.0 $\\rightarrow$ Connection fails with error (blocked).\n\nWhy this matters: Even without any admin\
  \ action, old insecure protocols should be blocked. This is baseline security.\n\nTP-02: Modern Profile (TLS 1.3 Only)\n\
  \nWhat this means: An admin decides they want the strictest security. They change the cluster profile to \"Modern\" which\
  \ means ONLY TLS 1.3 is allowed. TLS 1.2 (which was working before) should now be blocked. This test checks if ZTWIM actually\
  \ obeys this change.\n\nWhat to do:\n\nRun this command to change profile: oc patch apiserver cluster --type=merge -p '{\"\
  spec\":{\"tlsSecurityProfile\":{\"type\":\"Modern\"}}}'\n\nWait 1-2 minutes for ZTWIM operator to detect the change and\
  \ restart pods.\n\nTry connecting to SPIRE Server using different TLS versions again.\n\nWhat should happen:\n\nConnect\
  \ with TLS 1.3 $\\rightarrow$ Connection succeeds (only version allowed now).\n\nConnect with TLS 1.2 $\\rightarrow$ Connection\
  \ FAILS (was working before, now blocked!).\n\nConnect with TLS 1.1 $\\rightarrow$ Connection fails (still blocked).\n\n\
  Connect with TLS 1.0 $\\rightarrow$ Connection fails (still blocked).\n\nWhy this matters: This is the KEY test. If TLS\
  \ 1.2 still works after setting Modern, it means ZTWIM is IGNORING the customer's security policy. That's the whole bug\
  \ this feature fixes.\n\nTP-03: Old Profile (Legacy Compatibility)\n\nWhat this means: Some customers have very old systems\
  \ (10+ years old) that can only speak TLS 1.0. They set the \"Old\" profile which allows everything — even ancient TLS versions.\
  \ We check that ZTWIM respects this too (allows everything).\n\nWhat to do:\n\nChange profile to Old: oc patch apiserver\
  \ cluster --type=merge -p '{\"spec\":{\"tlsSecurityProfile\":{\"type\":\"Old\"}}}'\n\nWait for pods to restart.\n\nTry connecting\
  \ with ALL TLS versions.\n\nWhat should happen:\n\nConnect with TLS 1.0 $\\rightarrow$ Works (Old allows everything).\n\n\
  Connect with TLS 1.1 $\\rightarrow$ Works.\n\nConnect with TLS 1.2 $\\rightarrow$ Works.\n\nConnect with TLS 1.3 $\\rightarrow$\
  \ Works.\n\nWhy this matters: Profile enforcement works in BOTH directions. Not just making things stricter, but also making\
  \ them looser when the customer needs legacy support.\n\nTP-04: Custom Profile (Customer Removes a Specific Cipher)\n\n\
  What this means: A customer's security team says \"We don't trust AES-128 encryption. Remove it from all our systems.\"\
  \ They create a custom profile that specifically excludes AES-128. We check that ZTWIM stops offering AES-128 on all its\
  \ endpoints.\n\nWhat to do:\n\nSet a custom profile that only allows AES-256 (removes AES-128).\n\nWait for pods to restart.\n\
  \nTry connecting offering ONLY AES-128 (the removed cipher).\n\nTry connecting offering AES-256 (the kept cipher).\n\nWhat\
  \ should happen:\n\nClient offers only AES-128 $\\rightarrow$ Handshake FAILS (\"no shared cipher\" error).\n\nClient offers\
  \ AES-256 $\\rightarrow$ Connection succeeds.\n\nWhy this matters: Customers don't just pick \"Modern\" or \"Intermediate.\"\
  \ Many create custom profiles removing specific algorithms their security team flagged. ZTWIM must respect these exact choices.\n\
  \nTP-05: Runtime Profile Change (No Manual Restart)\n\nWhat this means: Admin changes the TLS profile while everything is\
  \ running. The change should take effect AUTOMATICALLY — no need to manually delete pods or restart anything. We check that\
  \ the change propagates on its own.\n\nWhat to do:\n\nStart with Intermediate (TLS 1.2 works).\n\nVerify TLS 1.2 connection\
  \ succeeds.\n\nChange to Modern (TLS 1.3 only) — do NOT manually restart any pods.\n\nWait for automatic pod restarts (operator\
  \ detects change).\n\nVerify TLS 1.2 now FAILS.\n\nChange back to Intermediate.\n\nVerify TLS 1.2 works AGAIN.\n\nWhat should\
  \ happen:\n\nBefore change: TLS 1.2 works.\n\nAfter change to Modern: TLS 1.2 stops working (automatically, no manual restart).\n\
  \nAfter change back to Intermediate: TLS 1.2 works again.\n\nWhy this matters: In production, admins should tighten or loosen\
  \ security without downtime and without SSH-ing into machines. Everything should be automatic.\n\nPROPAGATION & LIFECYCLE\
  \ (5 Test Cases)\n\nPL-01: Operator Restarts When Profile Changes\n\nWhat this means: When the cluster TLS profile changes,\
  \ the ZTWIM operator pod itself must restart so it picks up the new settings for its own endpoints (metrics, webhook). We\
  \ check that this restart happens automatically.\n\nWhat to do:\n\nNote the current operator pod name and its start time.\n\
  \nChange the TLS profile.\n\nWatch the operator pod.\n\nWhat should happen:\n\nOld operator pod terminates.\n\nNew operator\
  \ pod starts (new name, recent age).\n\nNew pod uses the new TLS settings on its metrics/webhook endpoints.\n\nWhy this\
  \ matters: The operator has its own TLS endpoints. If it doesn't restart, its endpoints will still use old settings even\
  \ though operands (SPIRE) restarted with new settings. Everything must be consistent.\n\nPL-02: SPIRE Pods Restart One-by-One\
  \ (Rolling Restart)\n\nWhat this means: After profile change, SPIRE Server, Agent, and OIDC pods should restart to pick\
  \ up new settings. But they should restart ONE BY ONE (rolling), not all at once. This prevents downtime.\n\nWhat to do:\n\
  \nChange TLS profile.\n\nWatch all pods in the ZTWIM namespace.\n\nWhat should happen:\n\nConfigMap gets updated with new\
  \ TLS values.\n\nPods restart one at a time (first spire-server, then agents, etc.).\n\nAt no point are ALL pods down simultaneously.\n\
  \nAfter restart, all endpoints use new TLS settings.\n\nWhy this matters: If all pods restart at once, workloads lose identity\
  \ service temporarily. Rolling restart ensures continuous availability.\n\nPL-03: API Server is Temporarily Unavailable\n\
  \nWhat this means: The operator reads TLS profile from the API Server. What if API Server is briefly down (during upgrade,\
  \ network issue)? The operator should NOT crash. It should use a safe default (Intermediate) until API Server comes back.\n\
  \nWhat to do:\n\nSimulate API Server being slow or unavailable.\n\nCheck operator pod status and logs.\n\nWhat should happen:\n\
  \nOperator logs: \"Cannot fetch TLS profile, using default Intermediate\".\n\nOperator pod stays Running (NOT CrashLoopBackOff).\n\
  \nWhen API Server comes back, operator picks up the correct profile.\n\nWhy this matters: Temporary infrastructure issues\
  \ should not break the identity system. Safe fallback keeps everything running.\n\nPL-04: Profile Change While Workloads\
  \ Are Actively Communicating\n\nWhat this means: Workloads are using SPIRE identities for mTLS right now. Admin changes\
  \ the TLS profile. Existing connections should NOT suddenly break. Only new connections should use the new profile.\n\n\
  What to do:\n\nDeploy workloads using SPIRE SVIDs for mTLS.\n\nVerify workload-to-workload communication works.\n\nChange\
  \ TLS profile.\n\nCheck that existing connections continue working.\n\nCheck that new connections use the new profile.\n\
  \nWhat should happen:\n\nExisting connections: continue (no sudden drops).\n\nNew connections: use new profile settings.\n\
  \nSVID trust chain: NOT broken.\n\nNo workload identity re-issuance needed.\n\nWhy this matters: In production, you can't\
  \ tell all apps \"stop everything while I change TLS settings.\" Changes must be non-disruptive.\n\nPL-05: After Operator\
  \ Upgrade, Profile is Still Applied\n\nWhat this means: Customer sets Modern profile, verifies it works. Then upgrades ZTWIM\
  \ operator to a new version. After upgrade, the profile should STILL be applied. It should not reset to defaults.\n\nWhat\
  \ to do:\n\nSet Modern profile, verify TLS 1.2 is rejected.\n\nUpgrade ZTWIM operator to new version.\n\nAfter upgrade,\
  \ check if TLS 1.2 is still rejected.\n\nWhat should happen:\n\nProfile still applied after upgrade.\n\nNo regression to\
  \ Go defaults.\n\nAll endpoints still match the customer's configured profile.\n\nWhy this matters: Upgrades should never\
  \ silently undo a customer's security configuration.\n\nML-KEM / POST-QUANTUM (5 Test Cases)\n\nPQ-01: Hybrid ML-KEM Actually\
  \ Negotiated on TLS 1.3\n\nWhat this means: When TLS 1.3 is active, the key exchange should use X25519MLKEM768 (quantum-safe\
  \ hybrid) instead of plain X25519 (quantum-vulnerable). We check that the quantum-safe method is actually being used, not\
  \ just \"available.\"\n\nWhat to do:\n\nSet Modern profile (TLS 1.3).\n\nConnect to SPIRE Server and check what key exchange\
  \ was used.\n\nWhat should happen:\n\nopenssl output shows: \"Server Temp Key: X25519MLKEM768, 1184 bits\"\n\nNOT: \"Server\
  \ Temp Key: X25519, 253 bits\" (that would mean classical only).\n\nWhy this matters: This is the core proof that quantum-safe\
  \ key exchange is happening. Without this, traffic is still vulnerable to future quantum attacks.\n\nPQ-02: Strict Mode\
  \ (requirePQKEM=true) — Hybrid Client Works\n\nWhat this means: Admin enables strict PQC mode. A client that SUPPORTS hybrid\
  \ ML-KEM connects. Connection should succeed.\n\nWhat to do:\n\nEnable requirePQKEM=true in SpireServer CR.\n\nConnect with\
  \ a client that offers X25519MLKEM768.\n\nWhat should happen:\n\nConnection succeeds.\n\nKey exchange: X25519MLKEM768.\n\
  \nNo errors.\n\nWhy this matters: Strict mode shouldn't break compatible clients. It should only reject incompatible ones.\n\
  \nPQ-03: Strict Mode (requirePQKEM=true) — Classical Client REJECTED\n\nWhat this means: Admin enables strict PQC mode.\
  \ A client that can ONLY do classical X25519 (no ML-KEM) tries to connect. It should be REJECTED. This is the \"no downgrade\"\
  \ guarantee.\n\nWhat to do:\n\nEnable requirePQKEM=true in SpireServer CR.\n\nConnect forcing only X25519 (classical, no\
  \ hybrid).\n\nWhat should happen:\n\nConnection FAILS (handshake error).\n\nServer refuses to downgrade to classical.\n\n\
  Clear error visible.\n\nWhy this matters: This proves \"no quantum-unsafe connections allowed\" when strict mode is on.\
  \ If classical clients sneak through, the protection is fake.\n\nPQ-04: Default Mode (requirePQKEM=false) — Old Client Falls\
  \ Back Gracefully\n\nWhat this means: With default settings (no strict mode), an old client that cannot do hybrid should\
  \ still be able to connect using classical key exchange. No breakage by default.\n\nWhat to do:\n\nKeep default config (requirePQKEM=false\
  \ or unset).\n\nConnect with a client that only supports X25519 (old/classical).\n\nWhat should happen:\n\nConnection WORKS\
  \ (no error).\n\nFalls back to X25519 (classical).\n\nHybrid is preferred but not required.\n\nWhy this matters: By default,\
  \ we must not break existing systems. Hybrid is \"preferred\" not \"required\" unless admin explicitly enables strict.\n\
  \nPQ-05: ML-KEM Works Even on Intermediate Profile\n\nWhat this means: ML-KEM doesn't require the \"Modern\" profile. Even\
  \ with \"Intermediate\" (which allows TLS 1.2 AND 1.3), if both client and server support TLS 1.3, they should negotiate\
  \ it and use hybrid ML-KEM.\n\nWhat to do:\n\nSet Intermediate profile (default).\n\nConnect with a TLS 1.3 capable client.\n\
  \nWhat should happen:\n\nClient and server negotiate TLS 1.3 (both support it).\n\nKey exchange uses X25519MLKEM768 (hybrid).\n\
  \nThis works even though Intermediate also allows TLS 1.2.\n\nWhy this matters: Customers don't need to switch to \"Modern\"\
  \ to get quantum safety. ML-KEM works whenever TLS 1.3 is negotiated, regardless of profile.\n\nNEGATIVE SCENARIOS (8 Test\
  \ Cases)\n\nNG-01: Very Old Client (TLS 1.1) Tries to Connect to Modern Profile\n\nWhat this means: A legacy monitoring\
  \ tool or old service tries to connect using TLS 1.1 (ancient protocol) when admin has set Modern (TLS 1.3 only). Must be\
  \ blocked.\n\nWhat should happen: Connection REJECTED with clear protocol version error.\n\nWhy this matters: Security policy\
  \ enforcement. Old insecure protocols must be blocked.\n\nNG-02: TLS 1.2 Client Tries to Connect to Modern Profile\n\nWhat\
  \ this means: A service using TLS 1.2 (still common today) tries to connect when admin explicitly chose TLS 1.3 only. Even\
  \ though TLS 1.2 is \"reasonably secure,\" it must be rejected because admin said so.\n\nWhat should happen: Connection\
  \ REJECTED.\n\nWhy this matters: \"Modern\" means \"1.3 ONLY.\" No exceptions, even for TLS 1.2.\n\nNG-03: Client Only Offers\
  \ a Cipher That Customer Banned\n\nWhat this means: Customer's security team removed AES-128. A client that can ONLY speak\
  \ AES-128 tries to connect. There's no common cipher, so handshake must fail.\n\nWhat should happen: Handshake FAILS with\
  \ \"no shared cipher\" error.\n\nWhy this matters: Customer's specific cipher decisions are enforced exactly, not just \"\
  preferred.\"\n\nNG-04: Admin Sets Invalid/Broken TLS Profile\n\nWhat this means: Admin accidentally sets a malformed profile\
  \ (typo in cipher name, empty list). The operator should handle this gracefully — log an error, but NOT crash.\n\nWhat should\
  \ happen:\n\nOperator logs clear error about invalid configuration.\n\nOperator does NOT enter CrashLoopBackOff.\n\nExisting\
  \ endpoints keep working with last-known-good settings.\n\nAfter admin fixes the profile, system recovers.\n\nWhy this matters:\
  \ Bad input should never bring down the identity system.\n\nNG-05: Classical-Only Client When Admin Requires Quantum-Safe\n\
  \nWhat this means: Admin enabled requirePQKEM=true. An old Java/Python service (no ML-KEM support) tries to connect. Must\
  \ be rejected.\n\nWhat should happen: Connection REJECTED. Clear error that PQC was not negotiated.\n\nWhy this matters:\
  \ Strict PQC mode must actually block non-compliant connections.\n\nNG-06: Vault Does Not Support the Required TLS Version\n\
  \nWhat this means: Customer sets Modern profile (TLS 1.3 only), but their Vault server only supports TLS 1.2. SPIRE Server\
  \ tries to connect to Vault for CA signing. The connection should fail with a clear error (not a mysterious timeout).\n\n\
  What should happen:\n\nClear error in SPIRE logs about Vault connection.\n\nSpireServer CR status shows unhealthy condition.\n\
  \nNOT a silent failure or mysterious behavior.\n\nWhy this matters: When external services are incompatible, the error must\
  \ be obvious and actionable.\n\nNG-07: Strict TLS on Controller Manager Webhook\n\nWhat this means: If strict TLS is enforced\
  \ on the webhook endpoint (:9443), and the Kubernetes API server cannot support that TLS version, CRD validation will break.\
  \ This is a KNOWN RISK to document.\n\nWhat should happen:\n\nIf API server supports required TLS $\\rightarrow$ webhook\
  \ works, CRDs validated.\n\nIf API server doesn't support $\\rightarrow$ CRD operations fail (RISK).\n\nWhy this matters:\
  \ This documents WHY webhook is excluded from strict enforcement in phase 1.\n\nNG-08: Old Workload Trying to Access OIDC\
  \ Endpoint\n\nWhat this means: A Python workload with old OpenSSL needs to fetch JWT public keys from OIDC endpoint. If\
  \ strict TLS is set on OIDC, and the workload can't negotiate, JWT verification breaks.\n\nWhat should happen:\n\nIf workload\
  \ supports required TLS $\\rightarrow$ works.\n\nIf workload has old TLS library $\\rightarrow$ fails (RISK).\n\nWhy this\
  \ matters: Documents WHY OIDC endpoint is excluded from strict PQC enforcement in phase 1.\n\nFIPS COMPLIANCE (7 Test Cases)\n\
  \nFP-01: ZTWIM Installs Successfully on FIPS Cluster\n\nWhat this means: On a cluster where FIPS mode is enabled (government-grade\
  \ crypto), ZTWIM should install and all pods should start without any crypto-related errors. No \"algorithm not allowed\"\
  \ crashes.\n\nWhat should happen:\n\nAll pods Running (no CrashLoopBackOff).\n\nNo FIPS/crypto errors in any logs.\n\nSystem\
  \ fully functional.\n\nWhy this matters: Government customers run FIPS clusters. If ZTWIM can't even start, it's useless\
  \ for them.\n\nFP-02: Only FIPS-Approved Ciphers Offered on FIPS Cluster\n\nWhat this means: On a FIPS cluster, non-approved\
  \ algorithms like ChaCha20 must NOT be offered by any endpoint. Only AES-GCM (FIPS approved) should appear.\n\nWhat should\
  \ happen:\n\nAES-128-GCM: available (FIPS approved).\n\nAES-256-GCM: available (FIPS approved).\n\nChaCha20-Poly1305: NOT\
  \ available (not FIPS approved).\n\nWhy this matters: Offering non-FIPS ciphers on a FIPS cluster fails security audit.\n\
  \nFP-03: ML-KEM Hybrid Works on FIPS Cluster (Go 1.26)\n\nWhat this means: After upgrading to Go 1.26, the ML-KEM hybrid\
  \ key exchange should work on FIPS clusters. This was broken on Go 1.25 (known bug) but is now fixed.\n\nWhat should happen:\n\
  \nopenssl shows: \"Server Temp Key: X25519MLKEM768\" (on FIPS cluster!).\n\nNo \"X25519 not allowed in FIPS mode\" errors.\n\
  \nWhy this matters: Proves government customers can have BOTH FIPS compliance AND quantum safety.\n\nFP-04: X25519MLKEM768\
  \ Specifically on FIPS (Go 1.26 Fix Verification)\n\nWhat this means: This specifically verifies the Go bug fix. X25519MLKEM768\
