  /enhancements/workload-identity-management/workload-identity-management.md\"\n---\n\n# Network Policy for Zero Trust Workload\
  \ Identity Management\n\n## Summary\n\nThis enhancement defines the NetworkPolicy requirements for the\nZeroTrustWorkloadIdentityManager\
  \ operator and its operands (SPIRE Server,\nSPIRE Agent, SPIFFE CSI Driver, and OIDC Discovery Provider). The network\n\
  policies implement a zero-trust security model by deploying default-deny\nbaseline policies and explicit allow rules for\
  \ required communication\npatterns, ensuring that all components follow the principle of least\nprivilege for network access.\n\
  \n## Motivation\n\nThe ZeroTrustWorkloadIdentityManager operator manages sensitive\ncryptographic operations and identity\
  \ attestation services. Following\nzero-trust security principles, all network traffic should be denied by\ndefault, with\
  \ only explicitly required communication patterns allowed.\nThis reduces the attack surface and limits the blast radius\
  \ of potential\nsecurity incidents.\n\nWithout properly configured NetworkPolicy resources, the operator and its\noperands\
  \ would be exposed to unnecessary network traffic, increasing the\nrisk of unauthorized access or lateral movement in case\
  \ of a compromise.\n\n### User Stories\n\n* As a cluster administrator, I want NetworkPolicy resources automatically\n \
  \ deployed with the ZeroTrustWorkloadIdentityManager operator, so that I\n  can ensure SPIRE components follow zero-trust\
  \ network security\n  principles without manual configuration.\n\n* As a security engineer, I want default-deny network\
  \ policies enforced\n  for all workload identity components, so that only explicitly permitted\n  traffic flows are allowed\
  \ and the attack surface is minimized.\n\n* As a platform operator, I want Prometheus to scrape metrics from SPIRE\n  components,\
  \ so that I can monitor the health and performance of the\n  workload identity system and detect anomalies.\n\n* As a site\
  \ reliability engineer, I want to understand how network\n  policies are deployed and maintained at scale across multiple\
  \ clusters,\n  so that I can troubleshoot connectivity issues and ensure consistent\n  security posture.\n\n### Goals\n\n\
  * Automatically deploy NetworkPolicy resources for the operator during\n  operator installation with no user configuration\
  \ required.\n\n* Automatically deploy NetworkPolicy resources for operands during operand\n  installation.\n\n* Implement\
  \ default-deny baseline policies for all operator and operand\n  components.\n\n* Enable required communication patterns\
  \ through explicit allow rules:\n  - Operator and operand communication with Kubernetes API server\n  - SPIRE Agent to SPIRE\
  \ Server communication\n  - Prometheus metrics collection from openshift-monitoring namespace\n  - SPIRE Server federation\
  \ (if enabled)\n  - DNS resolution for service discovery\n\n* Ensure network policies do not interfere with normal operation\
  \ of the\n  workload identity management system.\n\n### Non-Goals\n\n* Provide user-configurable or customizable network\
  \ policies. The policies\n  are designed to support the standard deployment model and are not\n  intended to be modified\
  \ by users.\n\n* Define network policies for workloads consuming SPIRE-issued identities.\n  This enhancement only covers\
  \ the SPIRE infrastructure components\n  themselves.\n\n* Replace or duplicate existing security mechanisms such as RBAC,\
  \ pod\n  security standards, or network segmentation at the infrastructure level.\n\n## Proposal\n\nThis proposal introduces\
  \ a comprehensive set of NetworkPolicy resources\nthat are automatically deployed as part of the\nZeroTrustWorkloadIdentityManager\
  \ operator and operand installation\nprocess. The policies follow a defense-in-depth approach with default-deny\nbaselines\
  \ and minimal explicit allow rules.\n\nThe operator's network policies will be embedded in the operator\ndeployment manifests\
  \ and applied during operator installation. The\noperand's network policies (for SPIRE Server, SPIRE Agent, SPIFFE CSI\n\
  Driver, and OIDC Discovery Provider) will be created during operand\nprovisioning by the operator.\n\nAll policies use pod\
  \ selectors to target specific components and enforce\ningress/egress rules based on the minimum required communication\
  \ patterns\nfor each component to function correctly.\n\n### Workflow Description\n\n**cluster administrator** is a human\
  \ user responsible for installing and\nmanaging the ZeroTrustWorkloadIdentityManager operator.\n\n**operator** is the ZeroTrustWorkloadIdentityManager\
  \ operator controller.\n\n**monitoring system** is the OpenShift monitoring stack (Prometheus).\n\n#### Operator Network\
  \ Policy Deployment\n\n1. The cluster administrator installs the ZeroTrustWorkloadIdentityManager\n   operator using OLM\
  \ or direct deployment.\n\n2. The operator installation includes NetworkPolicy resources that are\n   applied to the operator's\
  \ namespace automatically.\n\n3. The default-deny NetworkPolicy is applied first, blocking all ingress\n   and egress traffic\
  \ for the operator pods.\n\n4. Explicit allow NetworkPolicy resources are applied to permit:\n   - Egress to the Kubernetes\
  \ API server on port 6443/TCP\n   - Ingress from the openshift-monitoring namespace on port 8443/TCP for\n     metrics scraping\n\
  \n5. The operator starts and begins reconciliation with the restricted\n   network access.\n\n#### Operand Network Policy\
  \ Deployment\n\n1. The cluster administrator creates a SPIRE server or agent custom\n   resource.\n\n2. The operator reconciles\
  \ the custom resource and deploys the operand\n   components (SPIRE Server, SPIRE Agent, SPIFFE CSI Driver, or OIDC\n  \
  \ Discovery Provider).\n\n3. As part of the operand deployment, the operator creates NetworkPolicy\n   resources for each\
  \ component:\n\n   **SPIRE Server**:\n   - Default-deny policy\n   - Allow ingress from SPIRE Agents on port 8081/TCP\n\
  \   - Allow ingress for webhook on port 9443/TCP (SPIRE controller manager)\n   - Allow ingress for metrics on port 9402/TCP\
  \ and 8082/TCP from\n     monitoring namespace\n   - Allow egress to Kubernetes API server\n   - Allow egress to other SPIRE\
  \ Servers on port 8443/TCP (federation)\n   - Allow egress for DNS resolution\n\n   **SPIRE Agent**:\n   - Default-deny\
  \ policy\n   - Allow egress to SPIRE Server on port 8081/TCP\n   - Allow ingress for metrics on port 9402/TCP from monitoring\
  \ namespace\n   - Allow egress to Kubernetes API server for node attestation\n   - Allow egress for DNS resolution\n\n \
  \  **SPIFFE CSI Driver**:\n   - No specific NetworkPolicy required (communicates via Unix sockets\n     with SPIRE Agent\
  \ on the same node)\n\n   **OIDC Discovery Provider**:\n   - Default-deny policy\n   - Allow ingress on port 8443/TCP for\
  \ HTTPS client connections\n\n4. The operand components start with the network policies in effect,\n   ensuring zero-trust\
  \ network access from the beginning.\n\n5. The monitoring system scrapes metrics from the operator and operand\n   components\
  \ through the allowed ingress rules.\n\n```mermaid\nsequenceDiagram\n    participant Admin as Cluster Administrator\n  \
  \  participant OLM as Operator Lifecycle Manager\n    participant Op as ZeroTrust Operator\n    participant K8s as Kubernetes\
  \ API Server\n    participant Mon as Prometheus (Monitoring)\n    participant SPIRE as SPIRE Components\n\n    Admin->>OLM:\
  \ Install operator\n    OLM->>K8s: Deploy operator manifests\n    K8s->>K8s: Apply operator NetworkPolicies\n    Note over\
  \ K8s: Default-deny + Allow rules applied\n    OLM->>Op: Start operator\n    Op->>K8s: Reconcile (via allowed egress)\n\
  \    Mon->>Op: Scrape metrics (via allowed ingress)\n    \n    Admin->>K8s: Create SPIRE CR\n    K8s->>Op: Notify of new\
  \ CR\n    Op->>K8s: Deploy SPIRE components + NetworkPolicies\n    Note over K8s: Operand default-deny + Allow rules applied\n\
  \    K8s->>SPIRE: Start components\n    SPIRE->>K8s: Register (via allowed egress)\n    Mon->>SPIRE: Scrape metrics (via\
  \ allowed ingress)\n```\n\n### API Extensions\n\nThis enhancement does not introduce any API extensions. It only deploys\n\
  standard Kubernetes NetworkPolicy resources as defined in the\n`networking.k8s.io/v1` API group. No CRDs, webhooks, admission\
  \ plugins,\naggregated API servers, or finalizers are added or modified.\n\n### Topology Considerations\n\n#### Hypershift\
  \ / Hosted Control Planes\n\nIn Hypershift deployments, the ZeroTrustWorkloadIdentityManager operator\nmay run in either\
  \ the management cluster or the guest cluster (hosted\ncontrol plane), depending on the deployment model.\n\nIf the operator\
  \ runs in the management cluster, the network policies will\napply to pods in the management cluster namespace. The policies\
  \ must allow\ncommunication with the guest cluster's API server if the operator manages\nresources in the guest cluster.\n\
  \nIf operands (SPIRE Server, SPIRE Agent) run in the guest cluster, their\nnetwork policies will be applied in the guest\
  \ cluster namespaces and will\ngovern communication within the guest cluster infrastructure.\n\nNetwork policies in Hypershift\
  \ must account for the network topology where\ncontrol plane components may be in a different network segment than worker\n\
  nodes.\n\n#### Standalone Clusters\n\nThis enhancement is fully applicable to standalone OpenShift clusters.\nNetwork policies\
  \ will be deployed in the operator's namespace and in\nnamespaces where SPIRE operands are installed. The standard CNI plugin\n\
  (OVN-Kubernetes or OpenShift SDN) will enforce the policies.\n\n#### Single-node Deployments or MicroShift\n\nOn single-node\
  \ OpenShift (SNO) deployments, the network policies have\nminimal resource impact since they are lightweight Kubernetes\
  \ resources\nthat only define traffic rules. The policies will function identically to\nstandard clusters, restricting network\
  \ traffic to required patterns.\n\nFor MicroShift, network policies are supported if the CNI plugin\nimplements NetworkPolicy\
  \ enforcement. The policies defined in this\nenhancement should work without modification on MicroShift installations\n\
  that support NetworkPolicy.\n\nResource consumption is negligible - NetworkPolicy resources themselves\nconsume minimal\
  \ memory, and enforcement overhead depends on the CNI\nimplementation but is typically very low.\n\n#### OpenShift Kubernetes\
  \ Engine\n\nNetwork policies are part of standard Kubernetes functionality and are\nfully supported in OKE. This enhancement\
  \ does not depend on OpenShift-\nspecific features beyond the monitoring stack integration (metrics\ningress from openshift-monitoring\
  \ namespace).\n\nIn OKE environments without OpenShift monitoring, the NetworkPolicy rules\nallowing metrics ingress will\
  \ have no effect but will not cause issues.\n\n## Implementation Details/Notes/Constraints\n\nThe implementation will involve\
  \ creating NetworkPolicy manifests for each\ncomponent and ensuring they are applied during the appropriate lifecycle\n\
  phase (operator installation or operand provisioning).\n\n### Operator Network Policies\n\nThe operator deployment manifests\
  \ will include two NetworkPolicy\nresources:\n\n1. **Default-deny policy**: Denies all ingress and egress traffic for pods\n\
  \   with the operator label selector.\n\n2. **Operator allow policy**: Permits required traffic:\n   - Egress to Kubernetes\
  \ API server (443/TCP or 6443/TCP depending on\n     cluster configuration)\n   - Ingress from openshift-monitoring namespace\
  \ on port 8443/TCP\n\nThe operator code does not require changes; the NetworkPolicy resources\nare deployed as part of the\
  \ operator installation manifests.\n\n### Operand Network Policies\n\nThe operator controller will be modified to create\
  \ NetworkPolicy resources\nwhen reconciling SPIRE server and agent custom resources. The controller\nwill:\n\n1. Generate\
  \ NetworkPolicy manifests based on the operand type (server,\n   agent, CSI driver, OIDC provider).\n\n2. Apply the policies\
  \ to the namespace where the operand is deployed.\n\n3. Ensure policies are updated or deleted when operand configurations\n\
  \   change or operands are removed.\n\nThe NetworkPolicy specifications will use:\n- `podSelector` to target specific component\
  \ pods\n- `policyTypes` to specify Ingress and/or Egress enforcement\n- `ingress` and `egress` rules with:\n  - `from`/`to`\
  \ clauses using `namespaceSelector` and `podSelector`\n  - `ports` specifications for required protocols and port numbers\n\
  \n### DNS Resolution\n\nEgress policies for DNS resolution will allow UDP and TCP traffic on port\n53 to the cluster DNS\
  \ service (typically kube-dns or CoreDNS in the\nopenshift-dns namespace).\n\n### Federation Support\n\nFor SPIRE Server\
  \ federation, the network policy will allow egress and\ningress on port 8443/TCP to/from other SPIRE Server pods. This can\
  \ be\nscoped using pod selectors and namespace selectors based on the federation\nconfiguration.\n\n### Testing Approach\n\
  \nThe implementation will include:\n- Unit tests for NetworkPolicy manifest generation logic\n- Integration tests verifying\
  \ that policies are applied correctly during\n  operator and operand deployment\n- E2E tests confirming that communication\
  \ patterns work as expected with\n  policies in place and that unauthorized traffic is blocked\n\n### Constraints\n\nNetwork\
  \ policy enforcement depends on the CNI plugin supporting\nNetworkPolicy. OpenShift clusters using OVN-Kubernetes or OpenShift\
  \ SDN\nsupport NetworkPolicy. Clusters using other CNI plugins may not enforce\nthese policies.\n\nThe policies defined\
  \ here assume standard Kubernetes service networking\nand DNS. Clusters with non-standard networking configurations may\
  \ require\nadjustments.\n\n### Risks and Mitigations\n\n**Risk**: Misconfigured NetworkPolicy resources could block legitimate\n\
  traffic, preventing the operator or operands from functioning correctly.\n\n**Mitigation**: \n- Comprehensive testing in\
  \ development and staging environments before\n  production release\n- E2E tests that validate all required communication\
  \ patterns\n- Clear documentation on troubleshooting network connectivity issues\n- NetworkPolicy manifests reviewed by\
  \ networking and security SMEs\n\n**Risk**: Different CNI plugins may interpret or enforce NetworkPolicy\nrules differently,\
  \ leading to inconsistent behavior across clusters.\n\n**Mitigation**:\n- Test on all supported CNI plugins (OVN-Kubernetes,\
  \ OpenShift SDN)\n- Document any known limitations or differences in behavior\n- Use standard NetworkPolicy features that\
  \ are widely supported\n\n**Risk**: Overly permissive policies may not effectively limit the attack\nsurface, defeating\
  \ the purpose of zero-trust networking.\n\n**Mitigation**:\n- Follow principle of least privilege when defining allow rules\n\
  - Regular security reviews of NetworkPolicy specifications\n- Use specific port numbers and selectors rather than broad\
  \ wildcards\n\n### Drawbacks\n\nDeploying NetworkPolicy resources adds a small amount of complexity to the\noperator installation\
  \ and operand provisioning process. However, this\ncomplexity is justified by the security benefits of enforcing zero-trust\n\
  network access.\n\nNetwork policies may make debugging connectivity issues more difficult, as\ntraffic may be blocked by\
  \ policy rules rather than routing or firewall\nissues. Clear documentation and logging will help mitigate this concern.\n\
  \n## Alternatives (Not Implemented)\n\n### Alternative 1: User-Configurable Network Policies\n\nInstead of automatically\
  \ deploying network policies, the operator could\nallow users to provide custom NetworkPolicy configurations or disable\n\
  network policies entirely.\n\n**Reason not selected**: This increases the risk of misconfiguration and\nsecurity gaps. Automatic\
  \ deployment with sensible defaults ensures\nconsistent security posture across all installations. Users who need\ncustom\
  \ networking can still create additional NetworkPolicy resources to\nsupplement or override the defaults (depending on CNI\
  \ behavior).\n\n### Alternative 2: Service Mesh for Traffic Control\n\nInstead of NetworkPolicy resources, use a service\
  \ mesh (e.g., Istio) to\ncontrol traffic between components.\n\n**Reason not selected**: Service mesh adds significant complexity\
  \ and\nresource overhead. NetworkPolicy is a standard Kubernetes primitive that\nis well-supported and lightweight. For\
  \ the specific use case of limiting\nnetwork access to SPIRE components, NetworkPolicy is sufficient and more\nappropriate.\n\
  \n### Alternative 3: No Network Policies\n\nRely on network segmentation at the infrastructure level and RBAC for\nsecurity,\
  \ without deploying NetworkPolicy resources.\n\n**Reason not selected**: This does not follow zero-trust principles.\nDefense-in-depth\
  \ requires multiple layers of security. NetworkPolicy\nprovides an additional layer of protection that is independent of\n\
  infrastructure configuration and RBAC.\n\n## Test Plan\n\n<!-- TODO: Complete test plan section before targeting a release.\n\
  \nTesting strategy should include:\n\n1. **Unit Tests**: \n   - Validate NetworkPolicy manifest generation for each component\
  \ type\n   - Verify correct label selectors, port specifications, and namespace\n     selectors\n\n2. **Integration Tests**:\n\
  \   - Test operator installation applies operator NetworkPolicy resources\n   - Test operand provisioning creates appropriate\
  \ NetworkPolicy resources\n   - Verify policies are updated when operand configuration changes\n   - Verify policies are\
  \ deleted when operands are removed\n\n3. **E2E Tests**:\n   - Verify SPIRE Server can communicate with Kubernetes API server\n\
  \   - Verify SPIRE Agents can connect to SPIRE Server\n   - Verify Prometheus can scrape metrics from operator and operands\n\
  \   - Verify unauthorized traffic is blocked (e.g., direct pod-to-pod\n     traffic that should not be allowed)\n   - Test\
  \ federation communication between SPIRE Servers\n   - Test DNS resolution works for all components\n\n4. **Compatibility\
  \ Tests**:\n   - Test on clusters with OVN-Kubernetes CNI\n   - Test on clusters with OpenShift SDN CNI\n   - Test on Hypershift\
  \ deployments (management and guest clusters)\n   - Test on single-node OpenShift deployments\n\n5. **Negative Tests**:\n\
  \   - Verify that traffic not explicitly allowed is blocked\n   - Test behavior when NetworkPolicy resources are deleted\
  \ or modified\n   - Test connectivity failure scenarios and error messages\n\nAll E2E tests should include appropriate labels\
  \ following OpenShift test\nconventions: [Jira:\"Workload Identity\"], [Suite:openshift/conformance],\netc. Reference the\
  \ test conventions guide at\nhttps://github.com/openshift/enhancements/blob/master/dev-guide/test-conventions.md\n\nSince\
  \ this is not a feature-gated capability (network policies are always\ndeployed with the operator), tests do not require\
  \ [OCPFeatureGate:...]\nlabels.\n-->\n\n## Graduation Criteria\n\nThe NetworkPolicy resources described in this enhancement\
  \ are not a\nstandalone feature but are an integral part of the\nZeroTrustWorkloadIdentityManager operator deployment. Therefore,\
  \ the\ngraduation criteria for network policies align with the operator's\nmaturity level:\n\n### Dev Preview -> Tech Preview\n\
  \n- Operator and operand NetworkPolicy resources deployed successfully in\n  development and testing environments\n- E2E\
  \ tests validate all required communication patterns work correctly\n- No blocking issues related to network connectivity\
  \ reported in testing\n- Documentation covers network policy deployment and troubleshooting\n- Testing completed on all\
  \ supported CNI plugins\n\n### Tech Preview -> GA\n\n- NetworkPolicy resources deployed in production environments without\n\
  \  issues\n- Sufficient time for feedback from users and field teams\n- No critical bugs related to network policies\n-\
  \ Performance impact of policy enforcement measured and acceptable\n- User documentation available in openshift-docs covering\
  \ network\n  requirements and troubleshooting\n- Support procedures documented for common connectivity issues\n\n**Note**:\
  \ Since network policies are automatically deployed with the\noperator, there is no option to disable them. The policies\
  \ must be stable\nand well-tested before the operator reaches GA.\n\n## Upgrade / Downgrade Strategy\n\n### Upgrade Strategy\n\
  \nWhen upgrading the ZeroTrustWorkloadIdentityManager operator:\n\n1. New or updated NetworkPolicy resources will be applied\
  \ as part of the\n   operator upgrade.\n\n2. Existing NetworkPolicy resources may be replaced or supplemented with\n   new\
  \ policies to support additional communication patterns or security\n   improvements.\n\n3. The operator upgrade process\
  \ should be non-disruptive - network\n   policies should be updated in a way that does not break existing\n   connections\
  \ or prevent the operator/operands from functioning during\n   the upgrade.\n\n4. If new NetworkPolicy rules are more restrictive\
  \ than previous versions,\n   the upgrade process should ensure that operands are compatible with the\n   new restrictions\
  \ before applying the policies.\n\n### Downgrade Strategy\n\nWhen downgrading the operator:\n\n1. NetworkPolicy resources\
  \ will be reverted to the previous version's\n   specifications as part of the operator downgrade.\n\n2. If the newer version\
  \ added NetworkPolicy resources that did not exist\n   in the previous version, those resources should be deleted during\n\
  \   downgrade. However, NetworkPolicy resource deletion is non-destructive\n   and will simply remove the network restrictions.\n\
  \n3. Downgrade should not leave orphaned NetworkPolicy resources that could\n   conflict with the older operator version.\n\
  \n### Testing\n\nUpgrade and downgrade scenarios must be tested:\n- Verify NetworkPolicy resources are updated correctly\
  \ during upgrade\n- Verify operand connectivity is maintained during upgrade\n- Verify downgrade removes or reverts NetworkPolicy\
  \ changes appropriately\n- Test micro version upgrades (skip versions within a minor release)\n- Test minor version upgrades\
  \ (N -> N+1)\n\n## Version Skew Strategy\n\nNetworkPolicy resources are applied to running pods and take effect\nimmediately.\
  \ During an upgrade where new operator or operand versions are\nrolling out:\n\n1. **Operator Version Skew**: When multiple\
  \ operator replicas exist during\n   a rolling update, both old and new versions will be subject to the same\n   NetworkPolicy\
  \ rules. The policies are designed to allow the minimum\n   required communication, so both versions should continue to\
  \ function.\n\n2. **Operand Version Skew**: When SPIRE Server or Agent pods are rolling\n   out during an upgrade, old and\
  \ new versions will coexist temporarily.\n   NetworkPolicy rules use pod selectors that match both old and new\n   versions,\
  \ so communication between mixed-version components will\n   continue to work.\n\n3. **API Server Communication**: NetworkPolicy\
  \ egress rules allow\n   communication to the Kubernetes API server without version-specific\n   constraints, so version\
  \ skew does not impact API access.\n\n4. **SPIRE Agent to Server Communication**: SPIRE protocol compatibility\n   between\
  \ versions ensures that agents and servers can communicate during\n   rolling updates. NetworkPolicy rules allow this communication\
  \ based on\n   port and selector, not version.\n\nThe NetworkPolicy definitions use label selectors that are stable across\n\
  versions (e.g., `app=spire-server`) rather than version-specific labels,\nensuring that policies remain effective during\
  \ version transitions.\n\n## Operational Aspects of API Extensions\n\nThis enhancement does not introduce API extensions\
  \ (CRDs, webhooks,\naggregated API servers, or finalizers). It only deploys standard\nKubernetes NetworkPolicy resources\
  \ from the `networking.k8s.io/v1` API\ngroup.\n\nTherefore, this section is not applicable.\n\n## Support Procedures\n\n\
  ### Detecting Network Policy Issues\n\n**Symptom**: Operator or operand pods fail to start or enter CrashLoopBackOff\nstate\
  \ with connection errors in logs.\n\n**Diagnosis**:\n1. Check operator or operand pod logs for connection timeout or refused\n\
  \   errors when communicating with the Kubernetes API server\n2. Verify NetworkPolicy resources exist in the namespace:\n\
  \   `oc get networkpolicies -n <namespace>`\n3. Check NetworkPolicy specifications to ensure egress to API server is\n \
  \  allowed\n4. Verify CNI plugin supports NetworkPolicy enforcement:\n   `oc get network.config.openshift.io cluster -o\
  \ yaml` (check networkType)\n\n**Symptom**: Prometheus metrics not being scraped from operator or operand\ncomponents.\n\
  \n**Diagnosis**:\n1. Check Prometheus targets in the OpenShift console to see if scrape is\n   failing\n2. Verify NetworkPolicy\
  \ allows ingress from openshift-monitoring\n   namespace: `oc get networkpolicy -n <namespace> -o yaml`\n3. Check that the\
  \ monitoring namespace label matches the selector in the\n   NetworkPolicy\n4. Test connectivity from a pod in the monitoring\
  \ namespace to the metrics\n   port\n\n**Symptom**: SPIRE Agents cannot connect to SPIRE Server.\n\n**Diagnosis**:\n1. Check\
  \ SPIRE Agent logs for connection errors to server port 8081\n2. Verify NetworkPolicy in SPIRE Server namespace allows ingress\
  \ on port\n   8081 from agent namespace\n3. Verify NetworkPolicy in SPIRE Agent namespace allows egress to server\n   namespace\
  \ on port 8081\n4. Use `oc debug` to test connectivity from an agent pod to the server\n   endpoint\n\n### Disabling Network\
  \ Policies\n\n**To temporarily disable network policies** for troubleshooting:\n\n1. Delete the specific NetworkPolicy resources:\n\
  \   `oc delete networkpolicy <policy-name> -n <namespace>`\n\n2. Alternatively, if the CNI supports it, you can create an\
  \ \"allow-all\"\n   NetworkPolicy that overrides the restrictive policies (behavior depends\n   on CNI implementation).\n\
  \n**Consequences of disabling**:\n\n- **Cluster health**: No impact on overall cluster functionality. Network\n  policies\
  \ only restrict traffic to/from the specific operator or operand\n  pods.\n\n- **Existing workloads**: Existing operator\
  \ and operand pods will have\n  unrestricted network access, increasing security risk but potentially\n  resolving connectivity\
  \ issues if the policies were misconfigured.\n\n- **New workloads**: Newly created pods will not have network restrictions\n\
  \  applied, allowing full network access.\n\n**Graceful failure and recovery**:\n\nNetworkPolicy enforcement is handled\
  \ by the CNI plugin. If NetworkPolicy\nresources are deleted, the CNI will stop enforcing restrictions\nimmediately. When\
  \ NetworkPolicy resources are re-created, enforcement will\nresume without requiring pod restarts (though behavior may vary\
  \ by CNI\nimplementation).\n\nThe operator will recreate NetworkPolicy resources if they are deleted, as\npart of its reconciliation\
  \ loop. To prevent this, the operator would need\nto be stopped or the reconciliation logic modified.\n\n**Note**: Disabling\
  \ network policies should only be done temporarily for\ntroubleshooting. The operator is designed to work with these policies\
  \ in\nplace, and removing them violates the zero-trust security model.\n\n## Infrastructure Needed\n\nNo additional infrastructure\
  \ is required. This enhancement uses standard\nKubernetes NetworkPolicy resources and does not require new repositories,\n\
  testing infrastructure, or external services.\n\n\n---\n\n# EP: oidc-routes-integration.md\n\n---\ntitle: oidc-routes-integration\n\
  authors:\n  - \"@anirudhAgniRedhat\"\n  - \"@PillaiManish\"\nreviewers:\n  - \"@tgeer\"\napprovers:\n  - \"@tgeer\"\napi-approvers:\n\
  \  - \"@tgeer\"\ncreation-date: 2025-08-08\nlast-updated: 2025-08-25\ntracking-link:\n  - https://issues.redhat.com/browse/OCPSTRAT-1691\n\
  ---\n\n# OIDC Routes Integration for Zero Trust Workload Identity Manager\n\n## Summary\n\nThis enhancement proposes exposing\
  \ SPIRE OIDC Discovery Provider endpoints through OpenShift Routes under the domain `*.apps.<cluster-domain>` for the selected\
  \ default installation.\n\n## Motivation\n\nThe SpireOIDCDiscoveryProvider serves as a critical bridge between SPIFFE identities\
  \ and OIDC standards, allowing external systems to validate and trust SPIRE-issued JWTs. By exposing well-known endpoints\
  \ (/.well-known/openid-configuration and /keys), it provides the OIDC discovery document and corresponding public keys required\
  \ for verifying JWT-SVIDs.\n\nIn OpenShift environments, administrators need a straightforward and reliable way to make\
  \ these endpoints accessible. They may choose to leverage the default OpenShift wildcard DNS entry (*.apps.<cluster-domain>),\
  \ which points to the ingress routers, or alternatively configure a custom DNS entry that aligns with organizational requirements.\
  \ Providing flexibility in how the SpireOIDCDiscoveryProvider endpoints are exposed ensures smoother integration with external\
  \ identity consumers and supports varied deployment scenarios.\n\n\n### User Stories\n\n- As an OpenShift cluster administrator,\
  \ I want to enable a managed Route for the SPIRE OIDC Discovery Provider by setting `spec.managedRoute: true`, so that the\
  \ discovery endpoints are exposed on the cluster’s default `*.apps.<cluster-domain>` without additional YAML or manual DNS\
  \ steps.\n\n- As an OpenShift cluster administrator, I want to optionally specify a custom host, so that I can expose the\
  \ OIDC issuer on an organization-owned domain (e.g., `oidc.example.com`) that aligns with corporate DNS and certificate\
  \ policies\n\n- As an OpenShift cluster administrator, I want to disable the managed Route by setting `spec.managedRoute:\
  \ false`, so that I can expose the endpoints through self-managed OpenShift routes or ingress.\n\n- As an Openshift security\
  \ engineer, I want to attach labels/annotations to the managed `Route`, so that I can integrate with tools for auditability.\n\
  \n- As an SRE, I want clear status conditions on the CR and events, so that I can quickly diagnose exposure, DNS, or certificate\
  \ issues.\n\n- As an OpenShift cluster administrator, I want RBAC guardrails and explicit errors if the operator lacks permission\
  \ to manage Routes, so that I can understand required privileges and safely delegate responsibilities.\n\n- As an OpenShift\
  \ cluster administrator, I want the managed Route to default to Service CA certificates so that the endpoints are automatically\
  \ secured and trusted in-cluster without manual certificate management.\n\n- As an Openshift security engineer, I want the\
  \ managed Route to support re-encrypt termination so that TLS is enforced end-to-end with cluster-managed certificates,\
  \ providing stronger security than edge while avoiding the operational burden of passthrough.\n\n\n### Goals\n- Provide\
  \ a managed Route option for the SpireOIDCDiscoveryProvider that automatically exposes OIDC discovery endpoints on the cluster’s\
  \ default `*.apps.<cluster-domain>`.\n- Allow administrators to disable the managed Route, supporting self-managed exposure\
  \ of the endpoints through OpenShift Routes, ingress, or service mesh gateways.\n- Support attaching labels and annotations\
  \ to the managed Route for better auditing and monitoring.\n- Default the managed Route to use Service CA–issued certificates,\
  \ ensuring automatic TLS and certificate rotation.\n- Default re-encrypt termination for the managed Route, providing end-to-end\
  \ TLS with cluster-managed certificates as a stronger security option compared to edge termination, while avoiding the complexity\
  \ of passthrough.\n- Provide clear status conditions and events so that SREs can quickly diagnose DNS, TLS, or exposure\
  \ issues.\n- Validation check to reject updates to Route termination type or configurations that override usage of ServiceCA\
  \ operator managed certificates.\n- Allow the use of custom PKI with the default managed Route for TLS connections between\
  \ clients and the ingress router.\n\n### Non-Goals\n- Manage custom PKI without default managed Route.\n- Deletion of default\
  \ managed Route automatically when the option is disabled.\n- Support managed Route for applications that are not using\
  \ default Openshift `*.apps.<cluster-domain>`\n- Reconciliation of updates to DNS changes for SpireOIDCDiscoveryProvider\
  \ endpoints.\n- Support edge and passthrough termination types for default managed Route.\n- Support usage of SVIDs for\
  \ SpireOIDCDiscoveryProvider endpoints.\n- Custom PKI integration for the default managed Route of the SpireOIDCDiscoveryProvider\
  \ endpoints to replace Service CA–issued certificates when using re-encrypt termination.\n\n\n## Proposal\n\nThis enhancement\
  \ implements default OIDC route creation by extending the existing `SpireOIDCDiscoveryProvider` controller and introducing\
  \ an optional API field to control managed route creation.\n\n#### Automatic Route Creation\n\nThe implementation enhances\
  \ the existing `SpireOIDCDiscoveryProvider` controller to create and manage `Routes` as part of its reconciliation logic.\
  \ These `Routes` will integrate with OpenShift’s Service CA operator, enabling automatic TLS certificate provisioning and\
  \ lifecycle management without manual intervention. By default, all Routes will be created with secure configurations, including\
  \ `re-encrypt` TLS termination and enforced redirection of insecure requests. In addition, the controller will ensure that\
  \ a complete certificate trust chain is automatically established from the Route to the backing Service using the Service\
  \ CA, providing end-to-end security and minimizing the operational burden on administrators.\n\nFor example, when a SpireOIDCDiscoveryProvider\
  \ resource is created as\n\n```yaml\napiVersion: operator.openshift.io/v1alpha1\nkind: SpireOIDCDiscoveryProvider\nmetadata:\n\
  \  name: cluster\nspec:\n  trustDomain: cluster.local\n  managedRoute: \"true\"  # Enable operator-managed Route (default)\n\
  \  # ... other existing fields remain unchanged\n```\nthe controller automatically provisions a secure Route with Service\
  \ CA–managed certificates and configures it with secure defaults.\n\n### Workflow Description\n\nThis section outlines an\
  \ end-to-end workflow.\n\n#### Initial Setup\n1. **User Action**: Creates `SpireOIDCDiscoveryProvider` resource with `managedRoute`\
  \ flag being enabled.\n2. **Controller Response**: Detects the resource and initiates automatic route setup\n3. **Service\
  \ Preparation**: Adds Service CA annotation to the OIDC discovery service\n4. **Certificate Provisioning**: Service CA operator\
  \ generates certificates and creates `oidc-serving-cert` secret\n5. **Route Creation**: Controller creates OpenShift Route\
  \ with secure defaults (reencrypt TLS, HTTPS redirect)\n\n#### Ongoing Operations\n6. **External Access**: OIDC discovery\
  \ endpoint becomes available at `https://<route-hostname>/.well-known/openid_configuration`\n7. **Certificate Management**:\
  \ Service CA automatically handles certificate renewal and rotation\n8. **Route Maintenance**: Controller manages route\
  \ lifecycle tied to `SpireOIDCDiscoveryProvider` resource lifecycle\n\n#### Enhanced Workflow Diagram\n\n```mermaid\nsequenceDiagram\n\
  \    participant User\n    participant Controller\n    participant ServiceCA as Service CA\n    participant Route as OpenShift\
  \ Route\n    participant ExternalClient as External Client\n\n    Note over User,ExternalClient: Initial Setup\n    User->>Controller:\
  \ Create SpireOIDCDiscoveryProvider\n    Controller->>ServiceCA: Add annotation to OIDC service\n    ServiceCA->>ServiceCA:\
  \ Generate certificate & secret\n    Controller->>Route: Create route with reencrypt TLS\n    Route->>Route: Configure Service\
  \ CA trust chain\n    \n    Note over User,ExternalClient: External Access\n    ExternalClient->>Route: HTTPS request to\
  \ /.well-known/openid_configuration\n    Route->>Route: TLS termination & reencrypt\n    Route->>ExternalClient: Return\
  \ OIDC discovery document\n    \n    Note over User,ExternalClient: Ongoing Certificate Management\n    ServiceCA->>ServiceCA:\
  \ Auto-rotate certificates\n    Route->>Route: Auto-update trust chain\n```\n### API Extensions\n\n```go\n// managedRoute\
  \ is for enabling routes for oidc-discovery-provider\n// +kubebuilder:default:=\"true\"\n// +kubebuilder:validation:Enum:=\"\
  true\";\"false\"\n// +kubebuilder:validation:required\nManagedRoute string `json:\"managedRoute\"`\n```\n\nThe enhancement\
  \ adds a mandatory `managedRoute` field to `SpireOIDCDiscoveryProvider` CR. Correspondingly, a new `ManagedRouteReady` condition\
  \ is introduced to provide detailed status, reason, and message fields for troubleshooting the OIDC Route.\n\nWhen `managedRoute`\
  \ is enabled (default), the controller automatically creates OpenShift Routes with re-encrypt TLS termination and integrates\
  \ with the Service CA operator for comprehensive certificate management. The controller annotates the `spire-oidc-discovery-provider`\
  \ service with `service.beta.openshift.io/serving-cert-secret-name: oidc-serving-cert` to enable automatic certificate generation,\
  \ provisioning, and lifecycle management including renewal and trust establishment with the cluster's Certificate Authority.\n\
  \n\n### Topology Considerations\n\n#### Hypershift / Hosted Control Planes\n\n#### Standalone Clusters\n\nOnly standalone\
  \ cluster topology is in consideration for the tech-preview\n\n#### Single-node Deployments or MicroShift\n\n\n### Implementation\
  \ Details/Notes/Constraints\n\nThe implementation enhances the existing SPIRE OIDC Discovery Provider controller to automatically\
  \ create and manage OpenShift Routes with integrated certificate management through the Service CA operator.\n\nAs part\
  \ of this implementation, the spiffe-helper container will be removed from the spire-oidc-discovery-provider deployment\
  \ to streamline the attestation flow through the SPIRE agent’s Workload API socket when requesting JWKS bundles and eliminate\
  \ the dependency on SPIRE server–generated certificates for endpoints. The spire-oidc-discovery-provider will instead use\
  \ Service CA–managed certificates.\n\n#### Managed Route Lifecycle and Validation\n\nThe controller manages the Route lifecycle\
  \ based on the managedRoute flag. The Route object has ownerReference `spire-spiffe-oidc-discovery-provider` deployment\
  \ object. \n\nWhen managedRoute is enabled, the controller creates Routes automatically with secure defaults, including\
  \ TLS re-encryption and enforced best practices for exposure.\n\nWhen managedRoute is disabled, the controller stops managing\
  \ Routes but preserves any existing configurations. This allows users to add custom Route object.\n\nIf managedRoute is\
  \ re-enabled, the controller attempts to create a new Route. If an existing Route is already present, it validates the configuration\
  \ against the expected defaults. If there are deviations from expected defaults, the controller records an error in the\
  \ CR status and sets the `ManagedRouteReady` condition to `false`. This ensures operators receive clear signals when Routes\
  \ are misconfigured or diverge from secure defaults.\n\n#### TLS Security and Validation\n\nRe-encrypt termination is enforced\
  \ to ensure end-to-end TLS, dual-layer certificate validation, and seamless integration with OpenShift’s Service CA for\
  \ automated certificate lifecycle management. This approach delivers key benefits as it supports custom PKI integration\
  \ in environments with strict security policies or existing PKI infrastructures and it mitigates risks from external PKI\
  \ compromise by re-encrypting traffic at the router, providing an additional layer of protection through internal–external\
  \ separation.\n\n#### RBAC Validation\n\nThe controller validates required RBAC permissions before attempting Route operations,\
  \ checking for `routes.route.openshift.io` (create, update, get, list, watch, delete) and `services` (get, update, patch)\
  \ permissions. When permissions are missing, the controller provides specific error messages identifying the missing permissions\
  \ for administrators. The controller sets status conditions to indicate permission errors while continuing to manage other\
  \ aspects of the SpireOIDCDiscoveryProvider.\n\n#### Labels/Annotations\n\nThe Route object inherits user-defined labels\
  \ and annotations from `SpireOIDCDiscoveryProvider` CRD fields, with controller-managed labels taking precedence over user\
  \ labels for conflicts.\n\n#### Constraints\n\n- Toggling the `spec.managedRoute` from `false` to `true` will not overwrite\
  \ the Route object. User will have to delete any conflicting existing Route for successful operation.\n- The deletion of\
  \ a `SpireOIDCDiscoveryProvider` custom resource triggers a cascade of cleanup operations that removes managed Route.\n\
  - Uninstallation of managed Route object is not supported.\n- Routes are always created in the same namespace as their corresponding\
  \ `spire-spiffe-oidc-discovery-provider` deployment resource.\n- The managed Route is supported only for applications that\
  \ use the *.apps.<cluster-domain> wildcard DNS.\n\n### Risks and Mitigations\n\n### Drawbacks\n\nThe approach introduces\
  \ a dependency on Service CA operations for certificate management, which may not align with all organizational requirements.\
  \ Additionally, the solution can incur performance overhead, increase troubleshooting complexity, and lead to higher resource\
  \ consumption under heavy load.\n\n## Alternatives (Not Implemented)\n\n###  Manual Route Configuration\n- **Pros**: Full\
  \ control over route configuration.\n- **Cons**: Prone to external PKI compromises and compliance errors, possibilities\
  \ of leaking cluster-internal CAs, management of custom DNS entries and routes.\n- **Decision**: Rejected in favour of integration\
  \ with Service CA operator as default secured route.\n\n## Test Plan\n\n- Managed Route enable/disable and re-enable behavior\
  \ with drift validation.\n- Custom host support with DNS, cert issuance, and discovery validation.\n- Secure defaults enforced\
  \ with re-encrypt termination and redirects.\n- Service CA integration with cert issuance, rotation, and trust chain verification.\n\
  - RBAC guardrails with explicit errors on insufficient permissions.\n- Label/annotation propagation for auditability and\
  \ policy integration.\n- Status and events accuracy via ManagedRouteReady condition and diagnostics.\n\n## Graduation Criteria\n\
  \n### Dev Preview -> Tech Preview\n\n- Feature available for end-to-end usage.\n- Complete end user documentation.\n- UTs\
  \ and e2e tests are present.\n- Gather feedback from the users.\n\n### Tech Preview -> GA\nN/A. This feature is for Tech\
  \ Preview, until decided for GA.\n\n### Removing a deprecated feature\n\n## Upgrade / Downgrade Strategy\n\nUpgrades scenarios\
  \ not supported in the Tech Preview version.\n\n## Version Skew Strategy\n\n## Operational Aspects of API Extensions\n\n\
  ## Support Procedures\n\n## Infrastructure Needed [optional]\nNone\n\n---\n\n# EP: spire-agent-sds-configuration-for-ossm-istio-integration.md\n\
  \n---\ntitle: spire-agent-sds-configuration-for-ossm-istio-integration\nauthors:\n  - \"@PillaiManish\"\nreviewers:\n  -\
  \ \"@rausingh-rh\"\n  - \"@agnihotri\"\n  - \"@nandanhegde15\"\n  - \"@TrilokGeer\"\napprovers:\n  - TBD\napi-approvers:\n\
  \  - TBD\ncreation-date: 2026-04-10\nlast-updated: 2026-04-10\ntracking-link:\n  - TBD\nsee-also:\n  - \"/enhancements/workload-identity-management/zero-trust-workload-identity-manager.md\"\
  \n  - \"/enhancements/workload-identity-management/spire-federation-support.md\"\n---\n\n# SpireAgent SDS Configuration\
  \ for OSSM/Istio Integration\n\n## Summary\n\nThis enhancement adds SDS (Secret Discovery Service) configuration\nsupport\
  \ to the SpireAgent CRD and a cluster-wide socket filename setting\nto the ZeroTrustWorkloadIdentityManager CR, enabling\
  \ native multi-cluster\nmTLS with OpenShift Service Mesh (OSSM) and Istio without manual\nConfigMap patching or operator\
  \ workarounds.\n\n## Motivation\n\nThe ZTWIM operator's SpireAgent CRD currently provides no way to\nconfigure the SPIRE\
  \ Agent's SDS settings or socket filename. This forces\nusers deploying multi-cluster service mesh with SPIRE federation\
  \ to:\n\n1. Enable `CREATE_ONLY_MODE` on the operator Subscription\n2. Manually patch the `spire-agent` ConfigMap with `kubectl\
  \ patch`\n3. Manually configure Istio CR with `WORKLOAD_IDENTITY_SOCKET_FILE`\n   environment variable to match ZTWIM's\
  \ hardcoded socket name\n4. Restart all SPIRE Agent pods after configuration changes\n\nThis workaround is undocumented,\
  \ error-prone, breaks on operator\nupgrades, and requires cluster-admin access to operator internals. For\nmulti-cluster\
  \ deployments with SPIRE federation, specific SDS settings\nare required for Envoy to receive federated trust bundles and\
  \ perform\ncross-cluster mTLS. Without these settings, cross-cluster mTLS silently\nfails with \"unknown CA\" errors because\
  \ Envoy only receives the local\ncluster's CA certificate, not the federated trust bundles.\n\n### User Stories\n\n####\
  \ Story 1: Platform Engineer Deploying Multi-Cluster Service Mesh\n\nAs a platform engineer managing OpenShift Service Mesh\
  \ across multiple\nclusters, I want to configure SPIRE Agent SDS settings through the\nSpireAgent CRD so that I can enable\
  \ cross-cluster mTLS without manual\nConfigMap patching or undocumented operator workarounds.\n\n#### Story 2: Security\
  \ Engineer Implementing Zero-Trust Architecture\n\nAs a security engineer implementing zero-trust workload identity, I want\n\
  the SPIRE Agent socket filename to be configurable and aligned with\nIstio's default expectations so that I can integrate\
  \ SPIRE with OSSM\nwithout additional Istio CR configuration or manual intervention.\n\n#### Story 3: Application Developer\
  \ Using Service Mesh\n\nAs an application developer using service mesh for microservices\ncommunication, I want workloads\
  \ in different clusters to establish mTLS\nconnections transparently using federated SPIRE trust bundles so that my\napplications\
  \ can communicate securely across cluster boundaries without\nmanual certificate management.\n\n#### Story 4: Operations\
  \ Team Managing the Service at Scale\n\nAs a member of the operations team, I want the SPIRE-OSSM integration to\nbe fully\
  \ operator-managed with proper validation and immutability\nguarantees so that I can monitor configuration drift, prevent\
  \ disruptive\nmid-flight changes, and troubleshoot issues without reverse-engineering\nmanual ConfigMap patches.\n\n###\
  \ Goals\n\n- Allow configuring SPIRE Agent SDS settings (`default_bundle_name`,\n  `default_all_bundles_name`) through the\
  \ SpireAgent CRD without manual\n  ConfigMap patching\n- Provide a single, cluster-wide `socketFileName` field on the\n\
  \  ZeroTrustWorkloadIdentityManager CR that propagates to all components\n  referencing the SPIRE Agent socket\n- Eliminate\
  \ the need for `CREATE_ONLY_MODE` for OSSM multi-cluster\n  deployments\n- Enable OSSM/Istio integration without requiring\n\
  \  `WORKLOAD_IDENTITY_SOCKET_FILE` configuration in the Istio CR when\n  using the Istio default socket name\n- Maintain\
  \ full backward compatibility with existing deployments\n- Validate SDS configuration at admission time to prevent silent\n\
  \  failures\n\n### Non-Goals\n\n- Changes to the SPIFFE CSI Driver configuration\n- Changes to SPIRE Server configuration\
  \ or federation setup\n- Automating the Istio CR configuration needed on the OSSM side beyond\n  socket filename alignment\n\
  - Supporting non-SDS certificate delivery methods (e.g., filesystem-based\n  certificate delivery)\n- Exposing additional\
  \ SDS settings beyond `default_bundle_name` and\n  `default_all_bundles_name` (other settings like `default_svid_name`\n\
  \  already match Istio's expectations)\n- Making `socketFileName` mutable (changing it mid-deployment would break\n  all\
  \ running workload pods)\n\n## Proposal\n\nThis proposal adds two new optional API fields to enable operator-native\nOSSM/Istio\
  \ integration:\n\n1. **`socketFileName` on ZeroTrustWorkloadIdentityManager CR**: A\n   cluster-wide, immutable field that\
  \ sets the SPIRE Agent socket\n   filename and propagates to all components that connect to the agent\n   (currently SpireAgent\
  \ and SpireOIDCDiscoveryProvider).\n\n2. **`sds` on SpireAgent CR**: An optional SDS configuration section that\n   allows\
  \ setting `defaultBundleName` and `defaultAllBundlesName` for\n   Envoy/Istio integration in multi-cluster deployments.\n\
  \nBoth fields are optional with no defaults specified in the CRD, preserving\nSPIRE's built-in defaults and maintaining\
  \ backward compatibility.\n\n### Workflow Description\n\n#### Workflow 1: Single-Cluster OSSM Integration (Socket Filename\
  \ Only)\n\n**Actors**: Platform engineer, ZTWIM operator, Istio operator\n\n**Steps**:\n\n1. Platform engineer creates ZeroTrustWorkloadIdentityManager\
  \ CR with\n   `socketFileName: \"socket\"` to match Istio's default expectation\n2. Platform engineer creates SpireAgent\
  \ CR (no SDS configuration needed\n   for single-cluster)\n3. ZTWIM operator reconciles the ZeroTrustWorkloadIdentityManager\
  \ CR and\n   propagates `socketFileName` to SpireAgent and SpireOIDCDiscoveryProvider\n   controllers\n4. SpireAgent controller\
  \ generates `agent.conf` with\n   `socket_path: \"/tmp/spire-agent/public/socket\"`\n5. SpireOIDCDiscoveryProvider controller\
  \ generates config with\n   `workload_api.socket_path: \"/spiffe-workload-api/socket\"`\n6. SPIFFE CSI Driver mounts `/tmp/spire-agent/public/`\
  \ directory into\n   workload pods\n7. Envoy in workload pods connects to\n   `/spiffe-workload-api/socket` and establishes\
  \ SDS stream\n8. Envoy requests certificate with resource name `\"default\"` and CA\n   bundle with resource name `\"ROOTCA\"\
  `\n9. SPIRE Agent returns workload SVID and local CA bundle (single-cluster\n   default behavior)\n10. mTLS succeeds between\
  \ workloads in the same cluster\n\n#### Workflow 2: Multi-Cluster OSSM Integration (Socket + SDS)\n\n**Actors**: Platform\
  \ engineer, ZTWIM operator, Istio operator, SPIRE\nfederation\n\n**Steps**:\n\n1. Platform engineer federates SPIRE Servers\
  \ across clusters (see SPIRE\n   federation enhancement)\n2. Platform engineer creates ZeroTrustWorkloadIdentityManager\
  \ CR with\n   `socketFileName: \"socket\"` in both clusters\n3. Platform engineer creates SpireAgent CR with SDS configuration:\n\
  \   ```yaml\n   sds:\n     defaultBundleName: \"null\"\n     defaultAllBundlesName: \"ROOTCA\"\n   ```\n4. ZTWIM operator\
  \ reconciles and generates `agent.conf` with:\n   ```json\n   {\n     \"socket_path\": \"/tmp/spire-agent/public/socket\"\
  ,\n     \"sds\": {\n       \"default_bundle_name\": \"null\",\n       \"default_all_bundles_name\": \"ROOTCA\"\n     }\n\
  \   }\n   ```\n5. SPIRE Agent in Cluster1 receives federated trust bundle from Cluster2\n   via SPIRE Server federation\n\
  6. Envoy in Cluster1 workload pod requests `\"ROOTCA\"` resource\n7. SPIRE Agent matches `\"ROOTCA\"` to `default_all_bundles_name`\
  \ and\n   returns SPIFFE validator with both CA-1 (local) and CA-2 (federated)\n8. Workload in Cluster2 presents certificate\
  \ signed by CA-2\n9. Envoy in Cluster1 validates against CA-2 from federated bundle\n10. Cross-cluster mTLS succeeds\n\n\
  ```mermaid\nsequenceDiagram\n    participant PE as Platform Engineer\n    participant ZTWIM as ZTWIM Operator\n    participant\
  \ SA as SpireAgent Controller\n    participant OIDC as OIDC Provider Controller\n    participant Agent as SPIRE Agent Pod\n\
  \    participant Envoy as Envoy Sidecar\n    participant Peer as Peer Workload (Cluster2)\n\n    PE->>ZTWIM: Create ZTWIM\
  \ CR with socketFileName: \"socket\"\n    PE->>ZTWIM: Create SpireAgent CR with SDS config\n    ZTWIM->>SA: Reconcile SpireAgent\n\
  \    ZTWIM->>OIDC: Reconcile SpireOIDCDiscoveryProvider\n    SA->>SA: Generate agent.conf with socket_path and SDS settings\n\
  \    OIDC->>OIDC: Generate config with workload_api.socket_path\n    SA->>Agent: Deploy with generated config\n    Agent->>Agent:\
  \ Create socket at /tmp/spire-agent/public/socket\n    Agent->>Agent: Fetch federated bundles from SPIRE Server\n    Envoy->>Agent:\
  \ Connect to socket via CSI mount\n    Envoy->>Agent: Request \"default\" (SVID) and \"ROOTCA\" (CAs)\n    Agent->>Agent:\
  \ Match \"ROOTCA\" to default_all_bundles_name\n    Agent->>Envoy: Return SPIFFE validator with local + federated CAs\n\
  \    Peer->>Envoy: Initiate mTLS with cert signed by CA-2\n    Envoy->>Envoy: Validate peer cert against CA-2 from federated\
  \ bundle\n    Envoy->>Peer: mTLS handshake succeeds\n```\n\n### API Extensions\n\nThis proposal adds new fields to two existing\
  \ CRDs:\n\n#### 1. ZeroTrustWorkloadIdentityManager CR\n\n```go\ntype ZeroTrustWorkloadIdentityManagerSpec struct {\n  \
  \  // ... existing fields ...\n\n    // SocketFileName is the filename of the Unix socket created by the\n    // SPIRE Agent.\
  \ This value is propagated to all components that\n    // connect to the agent via the Workload API socket (currently:\n\
  \    // SpireAgent and SpireOIDCDiscoveryProvider).\n    //\n    // This field is immutable once set. Changing it mid-deployment\n\
  \    // requires restarting all workload pods that hold a reference to\n    // the old socket filename, as the socket path\
  \ is frozen in each\n    // pod's process configuration at start time.\n    //\n    // For Istio/OSSM integration without\
  \ setting\n    // WORKLOAD_IDENTITY_SOCKET_FILE in the Istio CR, set to \"socket\"\n    // to match Istio's default expectation.\n\
  \    //\n    // +kubebuilder:validation:Optional\n    // +kubebuilder:default=\"spire-agent.sock\"\n    // +kubebuilder:validation:MinLength=1\n\
  \    // +kubebuilder:validation:MaxLength=253\n    // +kubebuilder:validation:Pattern=`^[a-zA-Z0-9._-]+$`\n    // +kubebuilder:validation:XValidation:rule=\"\
  self == oldSelf\",message=\"socketFileName is immutable and cannot be changed after initial installation\"\n    SocketFileName\
  \ string `json:\"socketFileName,omitempty\"`\n}\n```\n\n#### 2. SpireAgent CR\n\n```go\ntype SpireAgentSpec struct {\n \
  \   // ... existing fields ...\n\n    // SDS configures the SPIRE Agent's SDS (Secret Discovery Service)\n    // settings.\
  \ Required for multi-cluster deployments using SPIRE\n    // federation with OSSM/Istio. When not specified, SPIRE's defaults\n\
  \    // are used (suitable for single-cluster).\n    //\n    // +kubebuilder:validation:Optional\n    SDS *SDSConfig `json:\"\
  sds,omitempty\"`\n}\n\n// SDSConfig defines SDS settings for Envoy/Istio integration.\n// For OSSM/Istio multi-cluster:\
  \ set defaultBundleName to \"null\" and\n// defaultAllBundlesName to \"ROOTCA\" to enable federated trust bundle\n// delivery.\n\
  //\n// +kubebuilder:validation:XValidation:rule=\"!has(self.defaultAllBundlesName) || !has(self.defaultBundleName) || self.defaultBundleName\
  \ == 'null' || self.defaultAllBundlesName != self.defaultBundleName\",message=\"defaultBundleName and defaultAllBundlesName\
  \ must not be equal\"\ntype SDSConfig struct {\n    // DefaultBundleName is the SDS resource name for the local trust\n\
  \    // domain bundle only. For Istio/OSSM multi-cluster: set to \"null\"\n    // to disable this, preventing conflict with\
  \ defaultAllBundlesName.\n    // When unset, SPIRE default (\"ROOTCA\") is used.\n    //\n    // +kubebuilder:validation:Optional\n\
  \    // +kubebuilder:validation:MaxLength=256\n    DefaultBundleName *string `json:\"defaultBundleName,omitempty\"`\n\n\
  \    // DefaultAllBundlesName is the SDS resource name that serves ALL\n    // trust bundles combined, including federated\
  \ trust domains.\n    // For Istio/OSSM multi-cluster: set to \"ROOTCA\" so Envoy receives\n    // both the local and all\
  \ federated CA certificates when performing\n    // cross-cluster mTLS. When unset, SPIRE default (\"ALL\") is used.\n \
  \   //\n    // +kubebuilder:validation:Optional\n    // +kubebuilder:validation:MaxLength=256\n    // +kubebuilder:validation:Pattern=`^[a-zA-Z0-9._-]*$`\n\
  \    DefaultAllBundlesName string `json:\"defaultAllBundlesName,omitempty\"`\n}\n```\n\n**Behavior Changes**: This enhancement\
  \ does not modify the behavior of\nexisting resources. It only adds new optional fields that allow users to\nconfigure previously\
  \ hardcoded values.\n\n### Topology Considerations\n\n#### Hypershift / Hosted Control Planes\n\nThe socket filename and\
  \ SDS configuration are configured per hosted\ncluster. Each hosted cluster's ZTWIM operator manages its own SPIRE Agent\n\
  configuration independently. No special considerations required.\n\n#### Standalone Clusters\n\nThis is the primary target\
  \ topology. All features work as designed in\nstandalone clusters.\n\n#### Single-node Deployments or MicroShift\n\nSingle-node\
  \ deployments typically use single-cluster OSSM configurations.\nThe `socketFileName` field enables simplified Istio integration,\
  \ while\nthe `sds` field can be omitted (SPIRE defaults work correctly for\nsingle-cluster).\n\n#### OKE (OpenShift Kubernetes\
  \ Engine)\n\nNot applicable. ZTWIM operator is not currently supported on OKE.\n\n### Implementation Details/Notes/Constraints\n\
  \n#### Component Changes\n\nThe following files require modification:\n\n1. **`api/v1alpha1/zero_trust_workload_identity_manager_types.go`**:\n\
  \   Add `SocketFileName` field to `ZeroTrustWorkloadIdentityManagerSpec`\n\n2. **`api/v1alpha1/spire_agent_config_types.go`**:\
  \ Add `SDSConfig`\n   struct and `SDS *SDSConfig` field to `SpireAgentSpec`\n\n3. **`pkg/controller/spire-agent/configmap.go`**:\
  \ \n   - Replace hardcoded `\"spire-agent.sock\"` with\n     `ztwim.Spec.SocketFileName` in socket_path generation\n   -\
  \ Add `buildSDSConfig()` function to generate SDS configuration block\n   - Conditionally include SDS section in `agent.conf`\
  \ when\n     `spireAgent.Spec.SDS != nil`\n\n4. **`pkg/controller/spire-oidc-discovery-provider/configmaps.go`**:\n   Replace\
  \ hardcoded `agentSocketName` constant with\n   `ztwim.Spec.SocketFileName` in workload_api.socket_path\n\n5. **`pkg/controller/spire-oidc-discovery-provider/controller.go`**:\n\
  \   Pass ZTWIM CR reference to `generateOIDCConfigMapFromCR()` (already\n   available in reconciler context)\n\n6. **`api/v1alpha1/zz_generated.deepcopy.go`**:\
  \ Regenerated via\n   `make generate`\n\n7. **`config/crd/bases/*.yaml`**: Regenerated via `make manifests`\n\n#### Feature\
  \ Gate\n\nPer the OpenShift enhancement dev guide, all new features must be gated\nbehind a feature gate. Create a new feature\
  \ gate in\n`github.com/openshift/api/blob/master/features/features.go`:\n\n```go\nconst (\n    // ...\n    FeatureGateSpireAgentSDSConfiguration\
  \ FeatureGate = \"SpireAgentSDSConfiguration\"\n)\n\nvar (\n    // ...\n    featureGateSpireAgentSDSConfiguration = FeatureGateDescription{\n\
  \        FeatureGateAttributes: FeatureGateAttributes{\n            Name: FeatureGateSpireAgentSDSConfiguration,\n     \
  \       Responsible: ContactPerson{\n                Name: \"Manish Pillai\",\n                Component: \"ZTWIM Operator\"\
  ,\n            },\n        },\n        OwningJiraComponent: \"ZTWIM\",\n        FeatureSets: []FeatureSet{\n           \
  \ TechPreviewNoUpgrade,\n        },\n    }\n)\n```\n\nInitial feature set: **TechPreviewNoUpgrade**\n\nThe operator must\
  \ check this feature gate before honoring the new\n`socketFileName` and `sds` fields in the CRs.\n\n#### SDS Configuration\
  \ Generation Logic\n\n```go\nfunc buildSDSConfig(sds *v1alpha1.SDSConfig) map[string]interface{} {\n    if sds == nil {\n\
  \        return nil\n    }\n    config := map[string]interface{}{}\n    if sds.DefaultBundleName != nil {\n        config[\"\
  default_bundle_name\"] = *sds.DefaultBundleName\n    }\n    if sds.DefaultAllBundlesName != \"\" {\n        config[\"default_all_bundles_name\"\
  ] = sds.DefaultAllBundlesName\n    }\n    if len(config) == 0 {\n        return nil\n    }\n    return config\n}\n```\n\n\
  The `*string` pointer type for `DefaultBundleName` distinguishes between:\n- **Field not set** (`nil`): SPIRE default applies,\
  \ field omitted from\n  `agent.conf`\n- **Field explicitly set to \"null\"** (`*\"null\"`): Operator writes\n  `\"default_bundle_name\"\
  : \"null\"` into `agent.conf`, disabling the local\n  bundle handler\n\n#### Validation\n\nThree CEL validation rules on\
  \ `SDSConfig` prevent misconfigurations:\n\n1. **No Equal Names**: `defaultBundleName != defaultAllBundlesName`\n   (SPIRE\
  \ silently ignores `defaultAllBundlesName` when equal)\n2. **No Empty defaultBundleName**: Empty string is ambiguous; forces\n\
  \   explicit `\"null\"` or field omission\n3. **If \"null\", then defaultAllBundlesName required**: Setting `\"null\"`\n\
  \   without `defaultAllBundlesName` is meaningless\n\nThe `socketFileName` immutability rule (`self == oldSelf`) prevents\n\
  mid-deployment changes that would silently break all running workloads.\n\n#### Backward Compatibility\n\n- **No SDS field**:\
  \ Existing behavior preserved (SPIRE uses built-in\n  defaults: `default_bundle_name=\"ROOTCA\"`,\n  `default_all_bundles_name=\"\
  ALL\"`)\n- **No socketFileName field**: Defaults to `\"spire-agent.sock\"`,\n  preserving current behavior\n- **Existing\
  \ deployments**: No changes required; all new fields are\n  optional\n\n### Risks and Mitigations\n\n| Risk | Mitigation\
  \ |\n|------|------------|\n| Existing deployments broken by upgrade | All new fields are optional with backward-compatible\
  \ defaults |\n| Multi-cluster mTLS silently fails | CEL validation prevents invalid SDS configurations at admission time\
  \ |\n| Socket mismatch with Istio | `socketFileName` field allows alignment with Istio default (\"socket\") |\n| Operator\
  \ upgrade wipes manual ConfigMap patches | Config now owned by CRs, eliminating need for manual patches |\n| Mid-deployment\
  \ socketFileName change breaks workloads | CEL immutability rule prevents the change after initial set |\n| OIDC provider\
  \ loses agent connection on socket rename | Both SpireAgent and SpireOIDCDiscoveryProvider use same `socketFileName` from\
  \ main CR |\n\n### Drawbacks\n\n- Adds API surface area to two CRDs (maintenance burden)\n- Users must understand SPIRE\
  \ SDS semantics to configure multi-cluster\n  correctly (mitigated by documentation and examples)\n- `socketFileName` is\
  \ immutable, requiring reinstallation to change\n  (necessary to prevent breaking running workloads)\n\n## Design Details\n\
  \n### Open Questions\n\nNone at this time.\n\n### Test Plan\n\n<!-- TODO: Add test plan with required test labels per OpenShift\
  \ dev\nguide. Tests must include:\n- `[OCPFeatureGate:SpireAgentSDSConfiguration]` for the feature gate\n- `[Jira:\"ZTWIM\"\
  ]` for the component\n- Appropriate suite labels like `[Suite:openshift/conformance/parallel]`\n- `[Serial]`, `[Slow]`,\
  \ or `[Disruptive]` as needed\nReference: https://github.com/openshift/enhancements/blob/master/dev-guide/test-conventions.md\n\
  -->\n\n#### Unit Tests\n\n| Test | Location | Description |\n|------|----------|-------------|\n| No SDS section when field\
  \ absent | `configmap_test.go` | Verify existing behavior preserved |\n| SDS section generated correctly | `configmap_test.go`\
  \ | Both fields reflected in `agent.conf` |\n| \"null\" bundle name handling | `configmap_test.go` | `*string` nil vs \"\
  null\" distinction |\n| CEL rejection of equal names | CRD admission test | `defaultBundleName == defaultAllBundlesName`\
  \ rejected |\n| CEL rejection of empty defaultBundleName | CRD admission test | Empty string rejected |\n| socketFileName\
  \ propagates to agent.conf | `configmap_test.go` | `socket_path` uses ZTWIM field |\n| socketFileName propagates to OIDC\
  \ config | `configmaps_test.go` | `workload_api.socket_path` uses ZTWIM field |\n| socketFileName immutability | CRD admission\
  \ test | Update rejected after initial set |\n| Default socketFileName | `configmap_test.go` | Defaults to \"spire-agent.sock\"\
  \ |\n\n#### Integration Tests\n\n- Deploy ZTWIM with `socketFileName: \"socket\"` and verify SPIRE Agent\n  socket created\
  \ with correct name\n- Deploy SpireAgent with SDS config and verify `agent.conf` contains\n  correct SDS block\n- Verify\
  \ OIDC Discovery Provider config uses same socket filename\n- Verify CEL validation rules reject invalid configurations\n\
  - Verify socketFileName cannot be changed after initial creation\n\n#### End-to-End Tests\n\n- Deploy OSSM + ZTWIM on two\
  \ clusters with SPIRE federation\n- Configure ZTWIM with `socketFileName: \"socket\"` (no Istio CR change\n  needed)\n-\
  \ Configure SpireAgent with SDS: `defaultBundleName: \"null\"`,\n  `defaultAllBundlesName: \"ROOTCA\"`\n- Verify cross-cluster\
  \ mTLS succeeds between workloads\n- Verify certificate issuer shows SPIRE CA (not Istiod)\n- Verify OIDC Discovery Provider\
  \ successfully fetches JWT bundles via\n  configured socket path\n- Verify Envoy receives federated trust bundles (inspect\
  \ SDS response)\n\n### Graduation Criteria\n\n<!-- TODO: Add graduation criteria per OpenShift dev guide. Requirements:\n\
  - Minimum 5 tests per feature\n- Minimum 7 test runs per week\n- Minimum 14 runs per supported platform\n- 95% pass rate\
  \ required\n- Tests running on all supported platforms (AWS, Azure, GCP, vSphere,\n  Baremetal with various network stacks)\n\
  Reference: https://github.com/openshift/enhancements/blob/master/dev-guide/feature-zero-to-hero.md\n-->\n\n#### Dev Preview\
  \ -> Tech Preview\n\n- Feature gate created in `features.go` with `DevPreviewNoUpgrade`\n  feature set\n- Unit tests implemented\
  \ and passing\n- Integration tests implemented and passing\n- E2E tests implemented and passing\n- Documentation updated\
  \ with configuration examples\n- API validation in place (CEL rules)\n\n#### Tech Preview -> GA\n\n- All graduation criteria\
  \ from OpenShift dev guide met:\n  - Minimum 5 tests per feature with appropriate labels\n  - Minimum 7 test runs per week\n\
  \  - Minimum 14 runs per supported platform\n  - 95%+ pass rate achieved\n  - Tests running on all supported platforms (AWS,\
  \ Azure, GCP, vSphere,\n    Baremetal)\n- Feature gate promoted to `Default` feature set\n- User-facing documentation complete\n\
  - Support procedures documented\n- No critical bugs reported in Tech Preview\n\n#### Removing a deprecated feature\n\nNot\
  \ applicable (new feature, not replacing an existing one).\n\n### Upgrade / Downgrade Strategy\n\n#### Upgrade\n\nWhen upgrading\
  \ from a version without this feature to a version with it:\n\n1. CRDs are updated with new optional fields\n2. Existing\
  \ ZeroTrustWorkloadIdentityManager and SpireAgent CRs continue\n   to work without modification\n3. `socketFileName` defaults\
  \ to `\"spire-agent.sock\"` (current hardcoded\n   value)\n4. SDS configuration remains unset (SPIRE defaults apply)\n5.\
  \ No behavioral changes for existing deployments\n\nUsers who previously enabled `CREATE_ONLY_MODE` and manually patched\n\
  ConfigMaps can:\n1. Set `socketFileName` and `sds` fields in CRs to match their manual\n   configuration\n2. Disable `CREATE_ONLY_MODE`\n\
  3. Operator will generate matching configuration\n\n#### Downgrade\n\nWhen downgrading from a version with this feature\
  \ to a version without it:\n\n1. CRDs are downgraded, removing new fields\n2. If user set `socketFileName != \"spire-agent.sock\"\
  ` or configured\n   `sds`, configuration will revert to hardcoded defaults\n3. For OSSM multi-cluster users, this will break\
  \ cross-cluster mTLS\n   (requires manual ConfigMap patching workaround again)\n\n**Recommendation**: Users who configure\
  \ these fields should not downgrade\nwithout planning for manual reconfiguration.\n\n### Version Skew Strategy\n\nThis feature\
  \ is entirely operator-side. No version skew concerns with\nSPIRE Agent or other components, as the operator generates compatible\n\
  SPIRE configuration regardless of agent version.\n\n### Operational Aspects of API Extensions\n\n#### Failure Modes\n\n\
  - **Invalid SDS configuration**: CEL validation rejects at admission time,\n  preventing invalid state\n- **Socket filename\
  \ mismatch**: Envoy fails to connect to agent, workload\n  pods fail to start with clear error message\n- **Attempt to change\
  \ immutable socketFileName**: Rejected by CEL\n  validation with clear error message\n\n#### Support Procedures\n\n**Symptom**:\
  \ Cross-cluster mTLS fails with \"unknown CA\" errors\n\n**Detection**: \n- Check Envoy logs for TLS handshake failures\n\
  - Inspect SDS response: `kubectl exec -it <pod> -c istio-proxy -- curl -s --unix-socket /var/run/secrets/workload-spiffe-uds/socket\
  \ http://localhost/debug/sds`\n- Verify `agent.conf` contains correct SDS settings\n\n**Resolution**:\n- Verify SpireAgent\
  \ CR has correct SDS configuration:\n  `defaultBundleName: \"null\"`, `defaultAllBundlesName: \"ROOTCA\"`\n- Verify SPIRE\
  \ Server federation is configured correctly\n- Restart SPIRE Agent pods to reload configuration\n\n**Symptom**: Envoy cannot\
  \ connect to SPIRE Agent socket\n\n**Detection**:\n- Workload pods fail to start\n- Envoy logs show \"failed to connect\
  \ to socket\" errors\n\n**Resolution**:\n- Verify `socketFileName` in ZTWIM CR matches socket mounted by CSI driver\n- For\
  \ Istio integration, ensure Istio expects same socket name (set\n  `WORKLOAD_IDENTITY_SOCKET_FILE` in Istio CR if using\n\
  \  `socketFileName: \"spire-agent.sock\"`, or omit it if using\n  `socketFileName: \"socket\"`)\n\n## Implementation History\n\
  \n- 2026-04-10: Initial proposal created based on ADR approved by SD\n  Architecture group\n\n## Alternatives\n\n### Alternative\
  \ 1: Place socketFileName on SpireAgent CR\n\n**Rejected**. The socket filename is used by both SpireAgent controller\n\
  and SpireOIDCDiscoveryProvider controller. Placing it on SpireAgent would\nrequire the OIDC provider controller to watch\
  \ and read the SpireAgent CR,\ncreating a cross-controller dependency that doesn't exist today. The main\nCR is already\
  \ the single source of truth for cluster-wide settings.\n\n### Alternative 2: Keep CREATE_ONLY_MODE + manual patching\n\n\
  **Rejected**. This is not operator-native, breaks on upgrades, requires\nundocumented manual steps, and cannot be automated\
  \ or validated by the\noperator. It places burden on users and support teams.\n\n### Alternative 3: Make SDS settings the\
  \ default for all installs\n\n**Rejected**. Changing `default_bundle_name` from `\"ROOTCA\"` to `\"null\"`\nfor all deployments\
  \ would be a breaking change for existing single-cluster\nusers who may rely on the current behavior. The `sds` field being\
  \ optional\npreserves backward compatibility while enabling multi-cluster use cases.\n\n### Alternative 4: Default socketFileName\
  \ to \"socket\" (match Istio)\n\n**Rejected** for this iteration. Changing the default from\n`\"spire-agent.sock\"` to `\"\
  socket\"` would be a breaking change for all\nexisting deployments. The backward-compatible default `\"spire-agent.sock\"\
  `\npreserves existing behavior. Users who want zero-Istio-CR-config can\nexplicitly set `socketFileName: \"socket\"`.\n\n\
  ## Infrastructure Needed\n\nNone. This enhancement uses existing ZTWIM operator infrastructure and\nCI/CD pipelines.\n\n\
  \n---\n\n# EP: spire-federation-support.md\n\n---\ntitle: spire-federation-support\nauthors:\n  - \"@rausingh-rh\"\nreviewers:\n\
  \  - \"@tgeer\"\napprovers:\n  - \"@tgeer\"\napi-approvers:\n  - \"@tgeer\"\ncreation-date: 2025-10-16\nlast-updated: 2025-10-16\n\
  tracking-link:\n  - https://issues.redhat.com/browse/SPIRE-211\n---\n\n# SPIRE Federation Support for Zero Trust Workload\
  \ Identity Manager\n\n## Summary\n\nThis enhancement adds native support for SPIRE Federation in the Zero Trust Workload\
  \ Identity Manager operator, enabling secure cross-cluster workload communication. The operator will manage configuration\
  \ to add federation support, managing lifecycle of trust bundle endpoint, and support federation across up to 50 clusters\
  \ (fixed maximum).\n\n## Motivation\n\nOrganizations deploying workloads across multiple OpenShift clusters need secure\
  \ service-to-service communication. SPIRE Federation enables workloads in one cluster to authenticate and communicate with\
  \ workloads in another cluster using cryptographically verified identities (SVIDs). By adding federation support to the\
  \ operator, we enable declarative, automated, and auditable federation management.\n\n### User Stories\n\n* As an OpenShift\
  \ cluster administrator, I want to enable SPIRE federation by setting `spec.federation` in the SpireServer CR, SpireServer\
  \ is able to federate trust bundle with configured peer server endpoints.\n\n* As an OpenShift cluster administrator, I\
  \ want to enable sharing of trust bundle over an endpoint as `spec.federation.bundleEndpoint` in the SpireServer CR, so\
  \ that the operator automatically creates a Service (port 8443) and Route to expose a secure bundle endpoint.\n\n* As an\
  \ OpenShift cluster administrator, I want to be able to specify federation endpoints, so that SPIRE Server is able to find\
  \ the trust bundles for other trust domains.\n\n* As an OpenShift security engineer, I want to choose between `https_spiffe`\
  \ (default, SPIFFE authentication) and `https_web` (Web PKI) profiles for `spec.federation.bundleEndpoint.profile`, so that\
  \ I can align federation security with organizational certificate policies and authentication requirements.\n\n* As an SRE,\
  \ I want SpireServer status conditions `ConfigurationValid` and `RouteAvailable` with timestamps and error messages, so\
  \ that I can quickly diagnose federation or route configuration issues.\n\n* As an OpenShift cluster administrator, I understand\
  \ that once `spec.federation` is set it cannot be removed (API validation rejects removal); to disable federation the system\
  \ must be uninstalled and reinstalled. Peer configurations (`federatesWith`) remain dynamic and can be added or removed.\n\
  \n* As an application developer, I want to create ClusterSPIFFEID resources with `spec.federatesWith[]` after federation\
  \ is configured, so that my workloads automatically receive SVIDs capable of authenticating against federated trust domains\
  \ without understanding the underlying SPIRE federation mechanics.\n\n* As an OpenShift security engineer, I want clear\
  \ documentation that initial trust bundle bootstrapping requires manual efforts, so that I understand the security model\
  \ and the one-time manual step required to establish federation trust.\n\n### Goals\n\n1. Enable declarative federation\
  \ configuration through SpireServer CR API\n2. Automate federation endpoint exposure (Service, Route creation)\n3. Support\
  \ both `https_spiffe` and `https_web` bundle endpoint profiles\n4. Support federation across up to 50 clusters (fixed maximum)\n\
  5. Provide clear validation and error messages for federation misconfiguration\n6. Document the manual trust bundle bootstrapping\
  \ process\n7. Ensure federation configuration is included in StatefulSet pod spec for proper restarts on configuration changes\n\
  \n### Non-Goals\n\n1. **Automatic trust bundle bootstrapping** - Initial trust bundle exchange cannot be fully automated\
  \ without compromising security. Users must manually bootstrap trust bundles.\n2. **Federation with unlimited clusters**\
  \ - A maximum of 50 federated trust domains is supported as of today until performance validations are completed.\n3. **Automatic\
  \ ClusterFederatedTrustDomain creation** - Users must create `ClusterFederatedTrustDomain` resources on each cluster for\
  \ each federation relationship to enable automatic bundle rotation and initial trust bundle exchange.\n4. **Custom CA certificate\
  \ management for https_web profile** - For `https_web` profile, users must provide valid certificates via Secrets or use\
  \ ACME.\n5. **Dynamic trust domain changes** - Changing trust domains in federated clusters requires recreating the federation\
  \ from scratch. This is a SPIRE limitation, not an operator limitation. This is not supported as part of this enhancement\
  \ proposal.\n\n## Proposal\n\nThis proposal adds federation configuration to the `SpireServerSpec` API and extends the spire-server\
  \ controller to:\n\n1. Generate federation configuration in spire-server ConfigMap\n2. Create/update a Service to expose\
  \ port 8443 for federation endpoint\n3. Create/update an OpenShift Route to expose the federation endpoint externally\n\
  4. Update the StatefulSet to expose port 8443\n5. Validate federation configuration at admission time\n\nThe operator will\
  \ NOT automate trust bundle bootstrapping. Users must still perform initial trust bundle exchange.\n\n### Workflow Description\n\
  \n#### Actors\n- **Platform Administrator**: Responsible for configuring federation across clusters\n- **Zero Trust Workload\
  \ Identity Manager Operator**: Manages SPIRE infrastructure\n- **SPIRE Server**: Provides federation endpoints and manages\
  \ trust bundles\n- **SPIRE Controller Manager**: Reconciles ClusterFederatedTrustDomain resources\n- **Application Developer**:\
  \ Deploys workloads that use federation\n\n#### Initial Federation Setup (Two Clusters)\n\n```mermaid\nsequenceDiagram\n\
  \    participant Admin as Platform Administrator\n    participant CRA as SpireServer CR (Cluster A)\n    participant OpA\
  \ as Operator (Cluster A)\n    participant SSA as SPIRE Server (Cluster A)\n    participant CRB as SpireServer CR (Cluster\
  \ B)\n    participant OpB as Operator (Cluster B)\n    participant SSB as SPIRE Server (Cluster B)\n    participant SCMA\
  \ as SPIRE Controller Manager (Cluster A)\n    participant SCMB as SPIRE Controller Manager (Cluster B)\n\n    Note over\
  \ Admin,SCMB: Phase 1: Configure Federation Endpoints\n\n    Admin->>CRA: Update with federation config<br/>(bundleEndpoint\
  \ + federatesWith)\n    CRA->>OpA: Reconcile triggered\n    OpA->>OpA: Validate federation config\n    OpA->>OpA: Generate\
  \ ConfigMap with<br/>federation configuration\n    OpA->>OpA: Create/Update Service<br/>(port 8443)\n    OpA->>OpA: Create/Update\
  \ Route<br/>(passthrough/reencrypt TLS)\n    OpA->>OpA: Update StatefulSet<br/>(expose port 8443)\n    OpA->>SSA: Rolling\
  \ restart with<br/>new configuration\n    SSA-->>OpA: Federation endpoint active\n\n    Admin->>CRB: Update with federation\
  \ config<br/>(bundleEndpoint + federatesWith)\n    CRB->>OpB: Reconcile triggered\n    OpB->>OpB: Validate federation config\n\
  \    OpB->>OpB: Generate ConfigMap with<br/>federation configuration\n    OpB->>OpB: Create/Update Service<br/>(port 8443)\n\
  \    OpB->>OpB: Create/Update Route<br/>(passthrough/reencrypt TLS)\n    OpB->>OpB: Update StatefulSet<br/>(expose port\
  \ 8443)\n    OpB->>SSB: Rolling restart with<br/>new configuration\n    SSB-->>OpB: Federation endpoint active\n\n    Note\
  \ over Admin,SCMB: Phase 2: Manual Trust Bundle Bootstrapping and Automatic Bundle Rotation\n\n    Admin->>SSB: Extract\
  \ trust bundle<br/>(federation endpoint response)\n    Admin->>SSA: Extract trust bundle<br/>(federation endpoint response)\n\
  \    \n    Admin->>SCMA: Create ClusterFederatedTrustDomain with cluster B's trust bundle in trustDomainBundle field<br/>(for\
  \ Cluster B)\n    SCMA->>SSA: Register federation relationship\n    SSA->>SSB: Fetch bundle via federation endpoint\n  \
  \  SSB-->>SSA: Return current bundle\n    SCMA->>SCMA: Schedule next refresh<br/>(every 5 minutes - refresh_hint)\n\n  \
  \  Admin->>SCMB: Create ClusterFederatedTrustDomain with cluster A's trust bundle in trustDomainBundle field<br/>(for Cluster\
  \ A)\n    SCMB->>SSB: Register federation relationship\n    SSB->>SSA: Fetch bundle via federation endpoint\n    SSA-->>SSB:\
  \ Return current bundle\n    SCMB->>SCMB: Schedule next refresh<br/>(every 5 minutes - refresh_hint)\n\n    Note over Admin,SCMB:\
  \ Phase 3: Deploy Federated Workloads\n\n    Admin->>SCMA: Create ClusterSPIFFEID<br/>(with federatesWith)\n    SCMA->>SSA:\
  \ Register SPIFFE ID with<br/>federation capability\n    Admin->>SCMB: Create ClusterSPIFFEID<br/>(with federatesWith)\n\
  \    SCMB->>SSB: Register SPIFFE ID with<br/>federation capability\n    Admin->>SCMB: Deploy workload\n    \n    Note over\
  \ SSA,SSB: Ongoing: Automatic Bundle Rotation (every 5 min)\n    \n    loop Every 5 minutes\n        SSA->>SSB: Fetch updated\
  \ bundle\n        SSB-->>SSA: Return bundle\n        SSB->>SSA: Fetch updated bundle\n        SSA-->>SSB: Return bundle\n\
  \    end\n```\n\n1. **Configure Federation**: Admin updates SpireServer CR on both clusters with `federation.bundleEndpoint`\
  \ and `federation.federatesWith` configuration\n    ```yaml\n   apiVersion: operator.openshift.io/v1alpha1\n   kind: SpireServer\n\
  \   metadata:\n     name: cluster\n   spec:\n     trustDomain: apps.cluster-a.example.com\n     clusterName: cluster-a\n\
  \     # ... existing fields ...\n     federation:\n       bundleEndpoint:\n         profile: https_spiffe\n       federatesWith:\n\
  \       - trustDomain: apps.cluster-b.example.com\n         bundleEndpointUrl: https://spire-server-federation-zero-trust-workload-identity-manager.apps.cluster-b.example.com\n\
  \         bundleEndpointProfile: https_spiffe\n         endpointSpiffeId: spiffe://apps.cluster-b.example.com/spire/server\n\
  \   ```\n\n2. **Operator Reconciliation**: \n   - Operator validates federation configuration\n   - Updates ConfigMap with\
  \ federation settings\n   - Creates/updates Service exposing federation endpoint port (8443)\n   - Creates/updates Route\
  \ exposing federation endpoint externally\n   - Updates StatefulSet to expose federation endpoint port\n   - Triggers pod\
  \ restart with new configuration \n\n### API Extensions\n\nThis enhancement adds new fields to the existing `SpireServerSpec`\
  \ API:\n\n```go\ntype SpireServerSpec struct {\n  // ... existing fields ...\n\n  // Federation configures SPIRE federation\
  \ endpoints and relationships\n  // +kubebuilder:validation:Optional\n  Federation *FederationConfig `json:\"federation,omitempty\"\
  `\n}\n\n// FederationConfig defines federation bundle endpoint and federated trust domains\ntype FederationConfig struct\
  \ {\n\t// bundleEndpoint configures this cluster's federation bundle endpoint\n\t// +kubebuilder:validation:Required\n\t\
  BundleEndpoint BundleEndpointConfig `json:\"bundleEndpoint\"`\n\n\t// federatesWith lists trust domains this cluster federates\
  \ with\n\t// +kubebuilder:validation:Optional\n\t// +kubebuilder:validation:MinItems=1\n\t// +kubebuilder:validation:MaxItems=50\n\
  \tFederatesWith []FederatesWithConfig `json:\"federatesWith,omitempty\"`\n\n\t// managedRoute enables or disables automatic\
  \ Route creation for the federation endpoint\n\t// \"true\": Allows automatic exposure of federation endpoint through a\
  \ managed OpenShift Route.\n\t// \"false\": Allows administrators to manually configure exposure using custom OpenShift\
  \ Routes or ingress, offering more control over routing behavior.\n\t// +kubebuilder:default:=\"true\"\n\t// +kubebuilder:validation:Enum:=\"\
  true\";\"false\"\n\t// +kubebuilder:validation:Optional\n\tManagedRoute string `json:\"managedRoute,omitempty\"`\n}\n\n\
  // BundleEndpointConfig configures how this cluster exposes its federation bundle\n// The federation endpoint is exposed\
  \ on 0.0.0.0:8443\n// +kubebuilder:validation:XValidation:rule=\"self.profile == 'https_web' ? has(self.httpsWeb) : true\"\
  ,message=\"httpsWeb is required when profile is https_web\"\n// +kubebuilder:validation:XValidation:rule=\"!has(oldSelf.profile)\
  \ || oldSelf.profile == self.profile\",message=\"profile is immutable and cannot be changed once set\"\ntype BundleEndpointConfig\
  \ struct {\n\t// profile is the bundle endpoint authentication profile\n\t// +kubebuilder:validation:Enum=https_spiffe;https_web\n\
  \t// +kubebuilder:default=https_spiffe\n\tProfile BundleEndpointProfile `json:\"profile\"`\n\n\t// refreshHint is the hint\
  \ for bundle refresh interval in seconds\n\t// +kubebuilder:validation:Minimum=60\n\t// +kubebuilder:validation:Maximum=3600\n\
  \t// +kubebuilder:default=300\n\tRefreshHint int32 `json:\"refreshHint,omitempty\"`\n\n\t// httpsWeb configures the https_web\
  \ profile (required if profile is https_web)\n\t// +kubebuilder:validation:Optional\n\tHttpsWeb *HttpsWebConfig `json:\"\
  httpsWeb,omitempty\"`\n}\n\n// BundleEndpointProfile represents the authentication profile for bundle endpoint\n// +kubebuilder:validation:Enum=https_spiffe;https_web\n\
  type BundleEndpointProfile string\n\nconst (\n\t// HttpsSpiffeProfile uses SPIFFE authentication (default)\n\tHttpsSpiffeProfile\
  \ BundleEndpointProfile = \"https_spiffe\"\n\n\t// HttpsWebProfile uses Web PKI (X.509 certificates from public CA)\n\t\
  HttpsWebProfile BundleEndpointProfile = \"https_web\"\n)\n\n// HttpsWebConfig configures https_web profile authentication\n\
  // +kubebuilder:validation:XValidation:rule=\"(has(self.acme) && !has(self.servingCert)) || (!has(self.acme) && has(self.servingCert))\"\
  ,message=\"exactly one of acme or servingCert must be set\"\n// +kubebuilder:validation:XValidation:rule=\"!has(oldSelf.acme)\
  \ || has(self.acme)\",message=\"cannot switch from acme to servingCert configuration\"\n// +kubebuilder:validation:XValidation:rule=\"\
  !has(oldSelf.servingCert) || has(self.servingCert)\",message=\"cannot switch from servingCert to acme configuration\"\n\
  type HttpsWebConfig struct {\n\t// acme configures automatic certificate management using ACME protocol\n\t// Mutually exclusive\
  \ with servingCert\n\t// +kubebuilder:validation:Optional\n\tAcme *AcmeConfig `json:\"acme,omitempty\"`\n\n\t// servingCert\
  \ configures certificate from a Kubernetes Secret\n\t// Mutually exclusive with acme\n\t// +kubebuilder:validation:Optional\n\
  \tServingCert *ServingCertConfig `json:\"servingCert,omitempty\"`\n}\n\n// AcmeConfig configures ACME certificate provisioning\n\
  type AcmeConfig struct {\n\t// directoryUrl is the ACME directory URL (e.g., Let's Encrypt)\n\t// +kubebuilder:validation:Required\n\
  \t// +kubebuilder:validation:Pattern=`^https://.*`\n\tDirectoryUrl string `json:\"directoryUrl\"`\n\n\t// domainName is\
  \ the domain name for the certificate\n\t// +kubebuilder:validation:Required\n\tDomainName string `json:\"domainName\"`\n\
  \n\t// email for ACME account registration\n\t// +kubebuilder:validation:Required\n\t// +kubebuilder:validation:Pattern=`^[a-zA-Z0-9][a-zA-Z0-9._%+-]*[a-zA-Z0-9]@[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\\\
  .[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*\\.[a-zA-Z]{2,}$`\n\tEmail string `json:\"email\"`\n\n\t// tosAccepted indicates\
  \ acceptance of Terms of Service\n\t// +kubebuilder:default:=\"false\"\n\t// +kubebuilder:validation:Enum:=\"true\";\"false\"\
  \n\t// +kubebuilder:validation:Optional\n\tTosAccepted string `json:\"tosAccepted,omitempty\"`\n}\n\n// ServingCertConfig\
  \ configures TLS certificates for the federation endpoint.\n// The service CA certificate is always used for internal communication\
  \ from the Route to the\n// SPIRE server pod. For external communication from clients to the Route, the certificate is\n\
  // controlled by ExternalSecretRef.\ntype ServingCertConfig struct {\n\t// fileSyncInterval is how often to check for certificate\
  \ updates (seconds)\n\t// +kubebuilder:validation:Minimum=3600\n\t// +kubebuilder:validation:Maximum=7776000\n\t// +kubebuilder:default=86400\n\
  \tFileSyncInterval int32 `json:\"fileSyncInterval,omitempty\"`\n\n\t// externalSecretRef is a reference to an externally\
  \ managed secret that contains\n\t// the TLS certificate for the SPIRE server federation Route host. The secret must\n\t\
  // be in the same namespace where the operator and operands are deployed and must\n\t// contain tls.crt and tls.key fields.\
  \ The OpenShift Ingress Operator will read\n\t// this secret to configure the route's TLS certificate.\n\t// +kubebuilder:validation:Optional\n\
  \tExternalSecretRef string `json:\"externalSecretRef,omitempty\"`\n}\n\n// FederatesWithConfig represents a remote trust\
  \ domain to federate with\n// +kubebuilder:validation:XValidation:rule=\"self.bundleEndpointProfile == 'https_spiffe' ?\
  \ has(self.endpointSpiffeId) && self.endpointSpiffeId != '' : true\",message=\"endpointSpiffeId is required when bundleEndpointProfile\
  \ is https_spiffe\"\ntype FederatesWithConfig struct {\n\t// trustDomain is the federated trust domain name\n\t// +kubebuilder:validation:Required\n\
  \t// +kubebuilder:validation:Pattern=`^[a-z0-9._-]{1,255}$`\n\tTrustDomain string `json:\"trustDomain\"`\n\n\t// bundleEndpointUrl\
  \ is the URL of the remote federation endpoint\n\t// +kubebuilder:validation:Required\n\t// +kubebuilder:validation:Pattern=`^https://.*`\n\
  \tBundleEndpointUrl string `json:\"bundleEndpointUrl\"`\n\n\t// bundleEndpointProfile is the authentication profile of the\
  \ remote endpoint\n\t// +kubebuilder:validation:Required\n\t// +kubebuilder:validation:Enum=https_spiffe;https_web\n\tBundleEndpointProfile\
  \ BundleEndpointProfile `json:\"bundleEndpointProfile\"`\n\n\t// endpointSpiffeId is required for https_spiffe profile\n\
  \t// +kubebuilder:validation:Optional\n\t// +kubebuilder:validation:Pattern=`^spiffe://.*`\n\tEndpointSpiffeId string `json:\"\
  endpointSpiffeId,omitempty\"`\n}\n\n```\n\n**Validation Rules (via CEL and controller):**\n\n1. Federation configuration\
  \ cannot be removed once set (enforced by CEL on SpireServer).\n2. If `federation.bundleEndpoint.profile == \"https_web\"\
  `, then `federation.bundleEndpoint.httpsWeb` must be set\n3. If `httpsWeb` is set, exactly one of `acme` or `servingCert`\
  \ must be specified (mutually exclusive)\n4. If `federatesWith[*].bundleEndpointProfile == \"https_spiffe\"`, then `endpointSpiffeId`\
  \ must be set\n5. `federatesWith` array length must not exceed 50\n6. `federatesWith[*].trustDomain` must not equal `spec.trustDomain`\
  \ (cannot federate with self)\n7. `federatesWith[*].bundleEndpointUrl` must be valid HTTPS URL\n\n### Topology Considerations\n\
  \n#### Hypershift / Hosted Control Planes\n\n#### Standalone Clusters\n\nFull federation support. This is the primary use\
  \ case.\n\n#### Single-node Deployments or MicroShift\n\n#### OpenShift Kubernetes Engine\n\n### Implementation Details/Notes/Constraints\n\
  \n#### Operator Code Changes\n\nThe operator implementation requires modifications across several components: API types\
  \ to define federation structures, ConfigMap generation to include federation configuration, Service creation/updation for\
  \ internal federation endpoint exposure, Route creation for external access, StatefulSet updates to expose federation ports\
  \ and mount servingCerts if configured, controller reconciliation to orchestrate federation resources and manage status\
  \ conditions, and validation logic to ensure configuration correctness. When `managedRoute` is set to `false`, the operator\
  \ will not reconcile or manage the Route resource for the federation endpoint created by operator, allowing administrators\
  \ to manually configure custom Routes or ingress solutions for more granular control.\n\n#### SPIRE Server Configuration\
  \ Output\n\nExample generated `server.conf` with federation:\n\n```json\n{\n  \"server\": {\n    \"trust_domain\": \"apps.cluster-a.example.com\"\
  ,\n    // ... other server config ...\n  },\n  \"federation\": {\n    \"bundle_endpoint\": {\n      \"address\": \"0.0.0.0\"\
  ,\n      \"port\": 8443,\n      \"profile\" : {\n        \"https_spiffe\": {}\n      },\n      \"refresh_hint\": \"300s\"\
  \n    },\n    \"federates_with\": {\n      \"apps.cluster-b.example.com\": {\n        \"bundle_endpoint_url\": \"https://spire-server-federation-zero-trust-workload-identity-manager.apps.cluster-b.example.com\"\
  ,\n        \"bundle_endpoint_profile\": {\n          \"https_spiffe\": {\n            \"endpoint_spiffe_id\": \"spiffe://apps.cluster-b.example.com/spire/server\"\
  \n          }\n        }\n      }\n    }\n  },\n  // ... plugins, telemetry, etc ...\n}\n```\n\n#### ClusterFederatedTrustDomain\
  \ vs spec.federation.federatesWith\n\nConfiguring both `spec.federation.federatesWith` and `ClusterFederatedTrustDomain`\
  \ are not mandatory. Either one alone can be used with an important caveat for `https_spiffe` profile. Using only `spec.federation.federates_with`\
  \ should work for `https_web` without any extra bootstrap. For `https_spiffe`, `spec.federation.federates_with` does not\
  \ provide a way to bootstrap the initial bundle; you must supply it via the API (e.g. `ClusterFederatedTrustDomain` with\
  \ `trustDomainBundle`) or by pre-loading the bundle into the datastore. Both of them are given as part of Zero Trust Workload\
  \ Identity Manger operator, so that one can act as a backup for the other. If `spire-controller-manager` is down or misconfigured,\
  \ the relationship defined in the `spec.federation.federates_with` section will still make the federation work. Both ultimately\
  \ configure the same SPIRE behavior- which foreign trust domains to pull bundles from and how to reach them.ClusterFederatedTrustDomain\
  \ is recommended because it does not require the Spire server to restart.\n\n#### Constraints and Limitations\n\n1. **Maximum\
  \ Federated Clusters**: Maximum of 50 federated trust domains (fixed limit enforced by API and controller validation).\n\
  2. **Trust Bundle Bootstrapping**: Cannot be automated. Users MUST manually bootstrap trust bundles (e.g. by creating ClusterFederatedTrustDomain\
  \ with `trustDomainBundle`).\n3. **Certificate Management for https_web**: Users are responsible for providing valid certificates\
  \ via Secrets or configuring ACME correctly. Invalid certificates will cause federation to fail.\n4. **Route Termination\
  \ Constraints**:\n    - **https_spiffe**: MUST use passthrough route. Reencrypt will fail due to: (a) client validation\
  \ expecting SPIFFE ID in URI SAN which router certificates lack, (b) client trusting only SPIRE CA not OpenShift ingress\
  \ operator CA, and (c) frequent SPIRE CA rotation (~20h) making destinationCACertificate maintenance impossible.\n    -\
  \ **https_web with ACME**: MUST use passthrough route. Reencrypt will fail because ACME validation requires direct SNI passthrough\
  \ to SPIRE server. Router TLS termination loses original SNI, causing ACME challenges to fail.\n    - **https_web with servingCert**:\
  \ CAN use passthrough or reencrypt (when externalSecretRef configured). Passthrough requires certificate with external DNS\
  \ name. Reencrypt allows separate backend and edge certificates. When `managedRoute` is enabled, a reencrypt route will\
  \ be automatically created.\n5. **Federation Bundle Endpoint Immutability**: Once configured, the Federation Bundle Endpoint\
  \ and its associated profile are immutable and cannot be removed or modified during Day-2 operations. API validation enforces\
  \ this constraint to maintain system stability, as the endpoint serves as the trust anchor for all federated peers. To disable\
  \ federation, the system must be uninstalled and reinstalled. Peer configurations (`federatesWith`) remain dynamic and can\
  \ be added or removed at any time.\n\n### Risks and Mitigations\n\n| Risk | Impact | Mitigation |\n|------|--------|------------|\n\
  | **Misconfigured federation breaks cross-cluster communication** | High - workloads cannot communicate across clusters\
  \ | - Comprehensive validation at API admission time<br>- Clear status conditions showing federation configuration validation<br>-\
  \ Detailed documentation and examples<br>- E2E tests for common scenarios |\n| **Manual trust bundle bootstrapping is error-prone**\
  \ | High - federation won't work without correct bootstrapping | - Detailed step-by-step documentation<br>|\n| **Too many\
  \ federated clusters cause performance degradation** | Medium - SPIRE server becomes slow or unstable | - Enforce maximum\
  \ limit of 50 clusters<br>- Document performance characteristics<br>- Test with maximum number of clusters |\n\n### Drawbacks\n\
  \nThe solution can incur performance overhead, increase troubleshooting complexity, and lead to higher resource consumption\
  \ under heavy load.\n\n\n## Alternatives (Not Implemented)\n\n1. Add ingress instead of route for exposing federation endpoint\n\
  \n## Open Questions\n\n1. **Should operator support dynamic trust domain changes?**\n   - Current proposal: No, requires\
  \ complete re-federation.\n   - Question: Should operator detect and provide better guidance when trust domain changes?\n\
  \   - Current proposal: No, operator will reconcile any updates and restart the operand spire server.\n   \n\n2. **Should\
  \ operator support automatic failover if a federated cluster becomes unavailable?**\n   - Should operator surface this information\
  \ in status? Operator will not be able to monitor operands external to cluster and is out-of-scope as of today.\n   - Should\
  \ operator add health checks for federated endpoints? The operator may not be aware of health check endpoints of the remote\
  \ clusters. \n   \n\n## Test Plan\n\n### Unit Tests\n- API validation (valid/invalid configs, edge cases)\n- ConfigMap/Service/Route\
  \ generation\n\n### Integration Tests\n- Controller reconciliation flow (create, update, delete resources)\n- Create-only\
  \ mode behavior\n- Status condition updates\n\n### E2E Tests\n- Two-cluster federation setup and verification\n- `N+1`th\
  \ cluster addition\n- Configuration updates and pod restarts\n\n### Performance Tests\n- Bundle refresh latency with varying\
  \ cluster counts\n- Federation endpoint load testing\n- Resource usage measurement\n\n## Graduation Criteria\n\nThe feature\
  \ will directly be a part of GA release.\n\n### Dev Preview -> Tech Preview\n\nNot applicable.\n\n### Tech Preview -> GA\n\
  \nNot applicable.\n\n\n### Removing a deprecated feature\n\n## Upgrade / Downgrade Strategy\n\n## Version Skew Strategy\n\
  \n## Operational Aspects of API Extensions\n\n## Support Procedures\n\n## Infrastructure Needed [optional]\nNone\n\n\n---\n\
  \n# EP: zero-trust-workload-identity-manager.md\n\n---\ntitle: zero-trust-workload-identity-manager\nauthors:\n  - \"@anirudhAgniRedhat\"\
  \nreviewers:\n  - \"@tgeer\"\napprovers:\n  - \"@tgeer\"\napi-approvers:\n  - \"@tgeer\"\ncreation-date: 2025-07-2\nlast-updated:\
  \ 2025-07-2\ntracking-link:\n  - https://issues.redhat.com/browse/OCPSTRAT-1691\n---\n\n# Zero Trust Workload Identity Manager\n\
  \n## Summary\n\nThis enhancement describes the proposal to introduce a `Zero-Trust-Workload-Identity-Manager` for OpenShift,\
  \ leveraging `SPIFFE` and `SPIRE` to provide a comprehensive identity management solution for distributed systems. SPIFFE/SPIRE\
  \ provides a standardized approach to workload identity, enabling secure service-to-service communication in dynamic and\
  \ heterogeneous environments. OpenShift will extend its security capabilities by integrating SPIFFE/SPIRE through a dedicated\
  \ operator that manages workload identities across the cluster.\n\n\nThe solution introduces a identity management framework\
  \ designed to address the complex security challenges of modern distributed systems. Key capabilities include implementing\
  \ SPIFFE identity standards, automating SPIRE agent and server deployment, providing dynamic workload identity provisioning,\
  \ ensuring verifiable identities for workloads, and supporting automatic certificate rotation and management.\n\n\n\n##\
  \ Motivation\nCustomers deploying OpenShift require a zero-trust workload identity solution that goes beyond static credentials\
  \ and perimeter-based security models. Traditional approaches, such as long-lived certificates or manual secret injection,\
  \ struggle to secure dynamic microservices architectures where workloads scale, migrate, and communicate across clusters.\
  \ These methods introduce operational complexity, increase the risk of credential leakage, and fail to provide granular,\
  \ cryptographically verifiable authentication for ephemeral workloads.  \n\nThe `Zero-Trust Workload Identity Manager` addresses\
  \ these challenges by integrating `SPIFFE/SPIRE` natively into OpenShift. This provides automated issuance of short-lived,\
  \ cryptographically signed identities (SVIDs) to workloads, replacing error-prone manual processes with dynamic identity\
  \ lifecycle management. By enforcing mutual TLS (mTLS) by default and enabling fine-grained trust boundaries, organizations\
  \ can secure service-to-service communication in multi-tenant or hybrid environments while reducing operational overhead\
  \ and aligning with zero-trust security mandates.\n\n### User Stories\n\n- As a openshift cluster administrator, I want\
  \ to deploy SPIRE components via an operator so that workload identities are managed automatically across the cluster.\n\
  - As a openshift cluster administrator, I want to configure trust domains via CRDs so that I can enforce secure isolation\
  \ between teams or environments.\n- As an application developer, I want SPIFFE identities injected into my workloads via\
  \ the CSI Driver so that I avoid manual certificate management.\n- As a security engineer, I want workloads to use short-lived,\
  \ auto-rotated SVIDs so that mTLS is enforced by default for zero-trust security.\n- As a cluster administrator, I want\
  \ SPIRE metrics in OpenShift Monitoring so that I can proactively resolve identity-related issues.\n\n\n### Goals\n\n- Automate\
  \ SPIRE server/agent deployment and lifecycle management via an operator.\n- Dynamically provision SPIFFE identities (SVIDs)\
  \ to workloads using the CSI Driver.\n- Enable trust domain configuration through CRDs for secure multi-tenant/multi-cluster\
  \ isolation.\n- Ensure SVIDs have a TTL with automatic rotation to enforce credentials freshness.\n- Integrate SPIRE health\
  \ and performance metrics into OpenShift Monitoring.  \n\n### Non-Goals  \n- Replace existing auth systems (e.g., Service\
  \ Accounts, OAuth).  \n- Manage non-workload identities (users).  \n- Enforce network-level security policies.  \n- Support\
  \ non-SPIFFE systems or legacy PKI.  \n- Establish cross-cluster trust without explicit configuration.  \n- Provide dedicated\
  \ UI/CLI tools in initial release.\n\n## Proposal\nA new zero-trust-workload-identity-manager operator will manage the deployment\
  \ and lifecycle of SPIRE components (server, agents) and the SPIFFE CSI Driver to provide workload identities based on the\
  \ SPIFFE standard. A singleton Custom Resource (CR) will configure trust boundaries, while WorkloadAttestation CRs define\
  \ attestation policies for workloads.\n\n### Key Components\n- Operator-Managed SPIRE Components\n- `SPIRE Server` as a\
  \ `StatefulSet` for high availability.\n- `SPIRE Agents` as a `DaemonSet` (one per node).\n- `SPIFFE CSI Driver` as a DaemonSet\
  \ to inject workload identities (`SVIDs`) into pods.\n- Resources `(RBAC, ServiceAccount, ClusterRole, etc.)` are created\
  \ from static manifest templates.\n\nThe operator will create and manage the following resources to deploy SPIRE and SPIFFE\
  \ components, Please refer `Implementation Details/Notes/Constraints` section for more details:\n\n1. Core Infrastructure\n\
  \    - Namespaces:\n        - `zero-trust-workload-identity-manager` (shared resources)\n\n    - ServiceAccounts:\n    \
  \    - `spire-agent`\n        - `spire-server`\n        - `spire-spiffe-csi-driver`\n        - `spire-spiffe-oidc-discovery-provider`\n\
  \n2. Configuration\n    - ConfigMaps:\n        - `spire-agent`, `spire-server`, `spire-controller-manager` (component configurations)\n\
  \        - `spire-spiffe-oidc-discovery-provider` (OIDC provider settings)\n        - `spire-bundle` (trust bundle for certificates)\n\
  \n3. RBAC & Security\n    - ClusterRoles:\n        - `spire-agent` (read pods/nodes)\n        - `spire-controller-manager`\
  \ (manage SPIRE CRDs)\n        - `spire-server` (token reviews, node/pod access)\n\n    - ClusterRoleBindings:\n       \
  \ - Bind roles to SPIRE ServiceAccounts (e.g., `spire-agent`, `spire-server`).\n\n    - SecurityContextConstraints (SCCs):\n\
  \        - `spire-spiffe-csi-driver` (privileged CSI driver)\n        - `spire-agent` (host access for agents)\n\n4. SPIRE\
  \ Server\n    - StatefulSet:\n        - `spire-server` (with persistent storage via spire-data PVC).\n\n    - Services:\n\
  \        - `spire-server` (gRPC endpoint for agent communication).\n\n    - Volume Claims:\n        - `spire-data` (persistent\
  \ volume for server state).\n\n5. SPIRE Agents\n    - DaemonSet:\n        - `spire-agent` (deployed per node for workload\
  \ attestation).\n\n    - Host Access:\n        - Runs with `hostPID:true` and `hostNetwork:true` for node-level visibility.\n\
  \n6. SPIFFE CSI Driver\n    - DaemonSet:\n\n        - `spire-spiffe-csi-driver` (injects SVIDs into pods via CSI volumes).\n\
  \n    - CSIDriver:\n        - `csi.spiffe.io` (supports ephemeral volumes for workload identities).\n\nEach of the resource\
  \ created for `zero-trust-workload-identity-manager` will have below set of labels added.\n* `app.kubernetes.io/managed-by:\
  \ zero-trust-workload-identity-manager`\n* `app.kubernetes.io/part-of: zero-trust-workload-identity-manager`\n\nRefer below\
  \ links for more information on the labels used\n- [Guidelines for Labels and Annotations for OpenShift applications](https://github.com/redhat-developer/app-labels/blob/master/labels-annotation-for-openshift.adoc)\n\
  - [Well-Known Labels, Annotations and Taints](https://kubernetes.io/docs/reference/labels-annotations-taints/)\n\n### Workflow\
  \ Description\n\nThe Zero-Trust Workload Identity Manager Operator automates the following workflow within OpenShift cluster:\n\
  \n1.  **Installation and Initial Setup:**\n    * The operator is installed via the OpenShift OperatorHub or CLI, managed\
  \ by OLM.\n    * Upon deployment, the operator registers watches for relevant Kubernetes resources (Deployments, StatefulSets,\
  \ DaemonSets, CustomResourceDefinitions, etc).\n    * The operator applies the necessary SPIRE Custom Resource Definitions\
  \ (CRDs) to the OpenShift cluster.\n    * The operator applies foundational RBAC resources (ClusterRoles, ClusterRoleBindings,\
  \ ServiceAccounts) for the operator components.\n\n2.  **Operand static resources Deployment and Management:**\n    * On\
  \ the deployment the operator will deploy the CR for ZeroTrustWorkloadIdentityManager resource named `cluster` which will\
  \ be managed by a controller, which is responsible for managing and operands static resources like RBACs resources, Service\
  \ Accounts, Services, CSI drivers resource etc.\n    * The status of the controller's reconcile should be reflecting on\
  \ the resource's status field. \n\n3.  **SPIRE Servers Deployments and Management:**\n    * When user wants to deploy the\
  \ spire servers statefulset, spire-controller manager deployments and configmaps for spire-server, controller manager and\
  \ spire-bundle based on the user validated input, they would need to deploy a CR for `SpireServer` resource named `cluster`\
  \ for the controller to start managing the spire server via controller.\n    * The status of the controller's reconcile\
  \ should be reflecting on the resource's status field\n\n4.  **SPIRE Agent Deployments and Management:**\n    * When user\
  \ wants to deploy the spire-agents as daemonset, SCC resource and configmaps for spire-agents based on the user validated\
  \ input, they would need to deploy a CR for `SpireAgent` resource named `cluster` for the controller to start managing the\
  \ spire agents deployments via controller.\n    * The status of the controller's reconcile should be reflecting on the resource's\
  \ status field\n\n5.  **SPIFFE CSI Deployments and Management:**\n    * When user wants to deploy the spiffe-csi-drivers\
  \ as daemonset, SCC resource based on the user validated input, they would need to deploy a CR for `SpiffeCSIDriver` resource\
  \ named `cluster` for the controller to start managing the spiffe-csi-driver deployments via controller.\n    * The status\
  \ of the controller's reconcile should be reflecting on the resource's status field\n\n6.  **SPIRE OIDC Discovery Provider\
  \ Deployments and Management:**\n    * When user wants to deploy the spire OIDC discivery provider deployments, SCC resource,\
  \ configmaps for oidc deployments and default ClusterSpiffeID resources based on the user validated input, they would need\
  \ to deploy a CR for `SpireOIDCDiscoveryProvider` resource named `cluster` for the controller to start managing the spiffe-csi-driver\
  \ deployments via controller.\n    * The status of the controller's reconcile should be reflecting on the resource's status\
  \ field\n\n---\n\n#### Visual Workflow  \n\n```mermaid\nsequenceDiagram\n    participant User\n    participant Operator\n\
  \    participant OpenShiftCluster\n\n    %% Installation and Setup\n    User->>Operator: Install via OperatorHub/CLI\n \
  \   Operator->>OpenShiftCluster: Deploy Operator pod and register watches\n    Operator->>OpenShiftCluster: Apply SPIRE\
  \ CRDs and RBACs\n\n    %% Deploy ZeroTrustWorkloadIdentityManager CR\n    User->>OpenShiftCluster: Create ZeroTrustWorkloadIdentityManager\
  \ CR (name: cluster)\n    Operator->>OpenShiftCluster: Deploy static infra (RBACs, Services, CSI driver CRs)\n    Operator-->>ZeroTrustWorkloadIdentityManager\
  \ CR: Update status\n\n    %% Deploy SPIRE Server\n    User->>OpenShiftCluster: Create SpireServerConfig CR\n    Operator->>OpenShiftCluster:\
  \ Deploy StatefulSet and controller manager\n    Operator->>OpenShiftCluster: Create related ConfigMaps\n    Operator-->>SpireServerConfig\
  \ CR: Update status\n\n    %% Deploy SPIRE Agent\n    User->>OpenShiftCluster: Create SpireAgentConfig CR\n    Operator->>OpenShiftCluster:\
  \ Deploy DaemonSet and SCC\n    Operator-->>SpireAgentConfig CR: Update status\n\n    %% Deploy SPIFFE CSI Driver\n    User->>OpenShiftCluster:\
  \ Create SpiffeCSIDriverConfig CR\n    Operator->>OpenShiftCluster: Deploy DaemonSet and SCC\n    Operator-->>SpiffeCSIDriverConfig\
  \ CR: Update status\n\n    %% Deploy OIDC Discovery Provider\n    User->>OpenShiftCluster: Create SpireOIDCDiscoveryProviderConfig\
  \ CR\n    Operator->>OpenShiftCluster: Deploy Deployment, ConfigMaps, ClusterSpiffeID\n    Operator-->>SpireOIDCDiscoveryProviderConfig\
  \ CR: Update status\n```\n\n### API Extensions\n\nThe Zero trust workload Identity manager includes 5 sets of APIs which\
  \ follows seperate use cases for each components the operator manages.\n\n- `ZeroTrustWorkloadIdentityManager` : Manages\
  \ the static resources required for the operands.\n``` yaml\napiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\n\
