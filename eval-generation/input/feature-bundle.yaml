  # docs/network-policy-planning-analysis.md\n\n# SPIRE-212 [Network Policy Planning Analysis]\n\n**Scope:** [GA]\n\nThis\
  \ analysis covers NetworkPolicy resources for the ZTWIM operator and all its operand components (SPIRE server, SPIRE agent,\
  \ OIDC discovery provider, SPIFFE CSI driver) within the `zero-trust-workload-identity-manager` namespace.\n\n---\n\n##\
  \ Why is this needed?\n\nThe ZTWIM operator and all its operand pods run in the `zero-trust-workload-identity-manager` namespace\
  \ without any network restrictions today. A compromised pod can reach any other pod or external endpoint. NetworkPolicies\
  \ enforce default-deny + least-privilege, which is a baseline expectation for security-sensitive platform workloads and\
  \ aligns with the zero-trust principles this operator exists to provide.\n\n---\n\n## Expected outcome\n\n- Default-deny\
  \ NetworkPolicy for all pods in the ZTWIM namespace\n- Fine-grained per-component ingress/egress policies based on actual\
  \ traffic analysis\n- Operator automatically creates and reconciles operand NetworkPolicies during operand installation\n\
  - No API changes required -- policies are static, no user configuration\n- No functional regression -- all existing traffic\
  \ flows (metrics, webhooks, federation, agent attestation) continue to work\n\n---\n\n## Architecture\n\n![ZTWIM Network\
  \ Policy Architecture](../assets/ztwim-network-policy-architecture.png)\n\n---\n\n## Traffic Matrix\n\n| Component | Direction\
  \ | Port | Protocol | Peer | Condition |\n|-----------|-----------|------|----------|------|-----------|\n| **Operator**\
  \ | Egress | 6443 | TCP | API Server | Always |\n| **Operator** | Ingress | 8443 | TCP | openshift-monitoring (Prometheus)\
  \ | Always |\n| **SPIRE Server** | Ingress | 8081 | TCP | SPIRE Agent (same namespace) | Always |\n| **SPIRE Server** |\
  \ Ingress | 9443 | TCP | Any (API Server webhook callbacks) | Always |\n| **SPIRE Server** | Ingress | 9402 | TCP | openshift-monitoring\
  \ (Prometheus) | Always |\n| **SPIRE Server** | Ingress | 8082 | TCP | openshift-monitoring (Prometheus, controller-manager\
  \ metrics) | Always |\n| **SPIRE Server** | Ingress | 8443 | TCP | openshift-ingress (OpenShift Router, federation) | When\
  \ federation enabled |\n| **SPIRE Server** | Egress | 6443 | TCP | API Server | Always |\n| **SPIRE Server** | Egress |\
  \ 5353 | TCP+UDP | openshift-dns (CoreDNS) | Always |\n| **SPIRE Server** | Egress | 443 | TCP | Remote federation endpoints\
  \ (via Route) | When federation enabled |\n| **SPIRE Server** | Egress | user-specified | TCP | Vault server (typically\
  \ 8200 or 443) | When upstreamAuthority.vault configured |\n| **SPIRE Server** | Egress | user-specified | TCP | External\
  \ DB (typically 5432/postgres or 3306/mysql) | When databaseType is not sqlite3 |\n| **SPIRE Server** | Egress | user-specified\
  \ | TCP | HTTP/HTTPS proxy endpoint | When cluster proxy configured |\n| **SPIRE Agent** | Egress | 8081 | TCP | SPIRE Server\
  \ (same namespace) | Always |\n| **SPIRE Agent** | Egress | 6443 | TCP | API Server | Always |\n| **SPIRE Agent** | Ingress\
  \ | 9402 | TCP | openshift-monitoring (Prometheus) | Always |\n| **SPIRE Agent** | Egress | 5353 | TCP+UDP | openshift-dns\
  \ (CoreDNS) | Always |\n| **SPIRE Agent** | Egress | user-specified | TCP | HTTP/HTTPS proxy endpoint | When cluster proxy\
  \ configured |\n| **OIDC Provider** | Ingress | 8443 | TCP | openshift-ingress (OpenShift Router) | Always |\n| **OIDC Provider**\
  \ | Egress | user-specified | TCP | HTTP/HTTPS proxy endpoint | When cluster proxy configured |\n| **SPIFFE CSI Driver**\
  \ | -- | -- | -- | Unix socket only | No NetworkPolicy needed |\n\n---\n\n## Proposed high-level implementation\n\n### Baseline:\
  \ Deny-All\n\nA single namespace-wide `deny-all` NetworkPolicy applied to all pods (`podSelector: {}`). This blocks all\
  \ ingress and egress unless explicitly allowed by component-specific policies.\n\n### Per-component policies\n\nEach operand\
  \ controller reconciles its own NetworkPolicy resources using the existing get-or-create-then-update pattern. NetworkPolicy\
  \ YAML templates are added to `bindata/` alongside existing Service/RBAC templates.\n\n| Component | Policies to reconcile\
  \ | Managed by |\n|-----------|----------------------|------------|\n| Operator | operator egress (API server), operator\
  \ ingress (metrics) | OLM bundle (static YAML in `config/network-policy/`) |\n| Deny-all (namespace-wide) | deny-all ingress\
  \ + egress for all pods | SpireServer controller |\n| SPIRE Server | spire-server ingress (agent, webhook, metrics, federation),\
  \ spire-server egress (API server, DNS, federation) | SpireServer controller |\n| SPIRE Agent | spire-agent egress (server,\
  \ API server, DNS), spire-agent ingress (metrics) | SpireAgent controller |\n| OIDC Provider | oidc-provider ingress (HTTPS),\
  \ oidc-provider egress (API server) | OIDC controller |\n| SPIFFE CSI Driver | None | -- |\n\n### Conditional policies\n\
  \n- **Federation policies** (ingress/egress on 8443) are only created when `spireServer.spec.federation` is configured.\
  \ If federation is removed, the federation NetworkPolicy should be cleaned up.\n- The deny-all policy is reconciled by the\
  \ SpireServer controller since it is the primary operand.\n\n### Pod selectors\n\nPolicies use the same labels the operator\
  \ sets on pods:\n\n| Component | Pod selector |\n|-----------|-------------|\n| Operator | `name: zero-trust-workload-identity-manager`\
  \ |\n| SPIRE Server | `app.kubernetes.io/name: spire-server` |\n| SPIRE Agent | `app.kubernetes.io/name: spire-agent` |\n\
  | OIDC Provider | `app.kubernetes.io/name: spiffe-oidc-discovery-provider` |\n\n### Monitoring namespace selector\n\n```yaml\n\
  namespaceSelector:\n  matchLabels:\n    kubernetes.io/metadata.name: openshift-monitoring\n```\n\n### DNS namespace selector\n\
  \n```yaml\nnamespaceSelector:\n  matchLabels:\n    kubernetes.io/metadata.name: openshift-dns\npodSelector:\n  matchLabels:\n\
  \    dns.operator.openshift.io/daemonset-dns: default\n```\n\n---\n\n## Key architectural decisions\n\n- **Who reconciles\
  \ the deny-all policy?** The deny-all policy covers all pods in the namespace. It should be owned by the SpireServer controller\
  \ (the primary operand that is always deployed), not duplicated across controllers.\n- **Operator-managed vs static?** Operand\
  \ policies are operator-managed (reconciled in Go code) so they follow the operand lifecycle. The operator's own policy\
  \ is static YAML shipped in the OLM bundle (`config/network-policy/`), deployed at install time.\n- **Conditional federation\
  \ policies:** Should federation NetworkPolicies be created unconditionally (no-op if federation is disabled) or conditionally\
  \ (only when `spec.federation` is set)? Conditional is preferred to keep the policy set minimal, but requires cleanup logic\
  \ when federation is removed.\n- **OIDC provider egress:** The OIDC provider uses a SPIFFE Workload API socket (CSI volume)\
  \ to get its identity. This is a Unix socket, so no egress policy is needed for that path. However, it may need API server\
  \ egress for leader election or certificate watches -- needs verification.\n\n---\n\n## Known pitfalls\n\n- **Monitoring\
  \ namespace label:** The original enhancement (OCP 4.x) uses `name: openshift-monitoring`. OCP 5.0 should use `kubernetes.io/metadata.name:\
  \ openshift-monitoring` (the immutable Kubernetes standard label). Both may need to be supported during upgrade transitions.\n\
  - **DNS port:** OpenShift DNS uses port 5353 (not 53). This is OpenShift-specific and must be verified on OCP 5.0.\n- **Metrics\
  \ port 9402 is not a container port.** The SPIRE server and agent expose metrics on 9402, which is defined on the Service\
  \ but not as a named `containerPort` in the StatefulSet/DaemonSet spec. NetworkPolicy matches on actual pod ports regardless,\
  \ but this should be verified.\n- **Controller manager metrics port discrepancy.** The original enhancement references port\
  \ 8082 for controller manager metrics, but the codebase shows the controller manager health port as 8083. The actual Prometheus\
  \ metrics port needs to be verified on the SPIRE controller manager image.\n- **Config hash annotation.** If NetworkPolicy\
  \ YAML templates are included in the config hash that drives StatefulSet rolling updates, any policy change will restart\
  \ SPIRE server pods. NetworkPolicy changes should NOT be included in the config hash since they don't affect pod configuration.\n\
  - **Deny-all blocks kubelet health probes?** No -- kubelet probes bypass NetworkPolicy (they originate from the node, not\
  \ from a pod). But this should be validated on OCP 5.0.\n- **E2E tests.** Existing E2E tests run without NetworkPolicies.\
  \ After this feature, all E2E tests will implicitly validate that policies don't break functionality, but dedicated negative\
  \ tests (verify blocked traffic) need to be added.\n\n---\n\n## Epics\n\n### Epic 1: Operator Network Policy\n\nAs an OpenShift\
  \ cluster admin, I expect the ZTWIM operator pod to have NetworkPolicies applied at install time via the OLM bundle, restricting\
  \ its traffic to only the API server (egress) and Prometheus metrics scraping (ingress).\n\n#### High-level steps\n\n| Step\
  \ | Estimate |\n|------|----------|\n| Enable and update static NetworkPolicy YAML in `config/network-policy/` for OCP 5.0\
  \ | __ SP |\n| Include in OLM bundle + unit tests | __ SP |\n| QE validation on live OCP 5.0 cluster | __ SP (QE to estimate)\
  \ |\n\n### Epic 2: Operand Network Policy Support\n\nAs an OpenShift cluster admin, I expect the ZTWIM operator to automatically\
  \ deploy fine-grained NetworkPolicies for all its operand components, enforcing default-deny and allowing only the minimum\
  \ required traffic, so that the SPIRE infrastructure is hardened at the network level without manual intervention.\n\n####\
  \ High-level steps\n\n| Step | Estimate |\n|------|----------|\n| Review / update enhancement doc for OCP 5.0 + design discussions\
  \ | __ SP |\n| Implementation: bindata templates + controller reconciliation + unit tests | __ SP |\n| E2E tests (positive\
  \ + negative traffic validation) | __ SP |\n| QE validation on live OCP 5.0 cluster | __ SP (QE to estimate) |\n\n---\n\n\
  ## Open questions (to be resolved during implementation)\n\n1. **OCP 5.0 DNS port:** Is OpenShift DNS still on port 5353\
  \ in OCP 5.0, or has it changed?\n2. **SPIRE controller manager metrics port:** Verify whether Prometheus scrapes on 8082\
  \ or 8083 by inspecting the actual SPIRE controller manager image.\n3. **OIDC provider API server egress:** Verify whether\
  \ the OIDC discovery provider needs egress to the API server (6443) by checking if it runs a Kubernetes client or watches.\n\
  4. **Deny-all ownership:** Determine which controller owns the deny-all policy and what happens if it is deleted while other\
  \ operands are still running.\n5. **Upgrade path:** Validate that deny-all + allow policies are applied atomically during\
  \ upgrade to avoid a brief outage window.\n"
