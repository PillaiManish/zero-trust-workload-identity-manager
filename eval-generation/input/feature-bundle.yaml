  \n## Infrastructure Needed [optional]\nNone\n\n---\n\n# ADR Documents\n\n# ADR Centralized TLS Profile in ZTWIM\n\nOperator\
  \ ADR\n\nADR Centralized TLS Profile in ZTWIM Operator\n\nDate: Aug 3, 2026\nStatus: Proposed\nAuthors: Nandan Hegde\nRelated\
  \ docs: Analysis and Running notes Doc\n\nWhat\n\nZTWIM operator (Layer 1 only) honors apiserver.config.openshift.io/cluster\
  \ TLS profile on metrics and webhook endpoints. Operand injection is summarized for propagation context (operand ADR).\n\
  \nPQ-ready base image: Red Hat DEFAULT:PQ OpenSSL + Go 1.26 (FIPS-capable hybrid ML-KEM).\n\nSingle source of truth: Read\
  \ spec.tlsAdherence and spec.tlsSecurityProfile from APIServer/cluster and no ZTWIM CR overrides.\n\nShared OpenShift TLS\
  \ library: Use shared library. (FetchAPIServerTLSProfile, FetchAPIServerTLSAdherencePolicy, SecurityProfileWatcher); do\
  \ not reimplement profile semantics.\n\nStrict adherence gate: Apply cluster profile only when tlsAdherence is strict (StrictAllComponents\
  \ + forward-compatible values). Non-strict → Go defaults on operator endpoints (Intermediate-equivalent: min TLS 1.2, hybrid\
  \ + classical fallback).\n\nPod restart, no hot reload: SecurityProfileWatcher cancels manager on profile/adherence change\
  \ → pod restart → re-fetch and reapply.\n\nStartup fetch failure: Log error, default to NoOpinion/Intermediate profile,\
  \ continue with Go defaults (min 1.2). Watcher converges on later restart. Check Effective TLS Configuration below for more\
  \ details.\n\nOperand propagation. Resolve profile → inject tls_config into operand ConfigMaps -> hash annotation -> rolling\
  \ restart. Operator honors Old on its own TLS; operand injection follows SPIRE upstream constraints:\n\nWhy\n\nOperator\
  \ metrics/webhooks ignore cluster TLS today (Go defaults / static config). Under StrictAllComponents (OCP 5.0 PQC readiness),\
  \ non-compliance blocks upgrades and audits. Customers who configure custom TLS profiles (cipher order, minimum version,\
  \ PQ-capable groups) with StrictAdherence receive no enforcement from ZTWIM’s operator surfaces. \n\nGoals\n\nPQ readiness:\
  \ base image + profile inheritance supports ML-KEM / TLS 1.3 cluster-wide\n\nNo behavior change when adherence is not strict\n\
  \nAutomated tls-scanner and manual FIPS validation\n\nNon-goals\n\nTLS client configuration, unix-domain and plaintext health\
  \ endpoints\n\nHot reload without pod restart\n\nHow\n\nOpenShift cluster TLS profiles\n\nZTWIM reads the profile configured\
  \ on apiserver.config.openshift.io/cluster. OpenShift defines four profile types:\n\nGroups (curve preferences, OCP 5.1)\
  \ not yet on the operator path. Only min TLS and ciphers apply today. Cipher order preserved as declared.\n\nFlow\n\nStartup\n\
  \nOperator pod starts\n\n  → Read tlsAdherence + tlsSecurityProfile from APIServer/cluster\n\n  → If strict adherence:\
  \ apply resolved profile to metrics (:8443) and webhook TLS\n\n  → If non-strict or fetch failed: use Go defaults (1.2 minTLSVersion\
  \ & no cluster profile applied)\n\n  → Start controller manager with fixed TLS settings for this process lifetime\n\nWatcher\n\
  \nCluster admin changes tlsAdherence or tlsSecurityProfile on APIServer/cluster\n\n  → SecurityProfileWatcher detects the\
  \ change\n\n  → Operator process shuts down gracefully\n\n  → Kubernetes restarts the operator pod\n\n  → Startup flow runs\
  \ again with the new settings\n\nNo in-process TLS hot reload. Profile changes always take effect after a pod restart.\n\
  \nEffective TLS configuration (operator)\n\nTesting and definition of done\n\nUnit tests: profile resolution, adherence\
  \ gating, ConfigMap hash stability (operand tests separate)\n\nCI tls-scanner: metrics + webhook under strict adherence\
  \ (Intermediate, Modern minimum)\n\nManual: FIPS validation for operator image/build matrix applicable to ZTWIM\n\nManual:\
  \ change APIServer TLS profile with strict adherence → single operator restart\n\nCSV tls-profiles: \"true\" published in\
  \ shipped bundle\n\nRBAC and SecurityProfileWatcher registered; no in-process TLS hot reload\n\nPlanned operand propagation\
  \ (informational)\n\nAPIServer TLS change\n\n  → SecurityProfileWatcher restarts operator\n\n  → Startup snapshot of OperandTLSProfile\
  \ passed to reconcilers\n\n  → ConfigMap generators inject tlsProfile block\n\n  → Hash annotation change → StatefulSet\
  \ / DaemonSet / Deployment rolling update\n\n\n\nAlternatives\n\nNot watching tlsProfile CR and relying on Go 1.26 and\
  \ openssl runtime curve negotiation.\n\nRejected: Even though Go 1.26 has support for FIPS compliant PQ curves, TLS Consistency\
  \ is a key part of PQC readiness. TLSProfile also consists of cipherSuites and minTLSVersion along with groups. TLSProfile\
  \ is a superset of PQC curves.  \n\nRisks\n\nReviews\n\nOperand ADR\n\nADR TLSConfig and Hybrid ML-KEM in ZTWIM Operands\n\
  \nDate: Aug 5, 2026\nStatus: Proposed\nAuthors: Nandan Hegde\nRelated docs: Operator ADR · Operand TLS analysis — Running\
  \ notes\n\nWhat\n\nZTWIM operands will inherit the cluster TLS config from apiserver.config.openshift.io/cluster via operator\
  \ reconciliation. This ADR covers Layer 2 — operands only. Layer 1 (operator metrics and webhook) is defined in Operator\
  \ ADR.\n\nCentral TLS governance via tlsConfig. The operator injects a tlsConfig block (min_tls_version, cipher_suites,\
  \ curve_preferences) into operand ConfigMaps. Operands apply it only on terminating TLS endpoints (listeners), not on outbound\
  \ clients. Valid / invalid tlsConfig (enforced by operator mapping + operand startup):\n\nNo operator managed require_pq_kem.\
  \ Strict PQ-only (TLS 1.3 + hybrid ML-KEM, no classical fallback) remains experimental and couples client + listener at\
  \ wired sites. Manual opt-in only via CREATE_ONLY_MODE\n\nPQ-ready runtime. Operand images use DEFAULT:PQ OpenSSL and Go\
  \ 1.26 so hybrid ML-KEM curves are available (including FIPS-capable builds).\n\nCurve preferences — phased. Full curve_preferences\
  \ propagation from the cluster APIServer profile lands with OCP 5.1 TLS profile Groups support. Until then, the operator\
  \ injects min_tls_version and cipher_suites; curve order falls back to Go 1.26 defaults (hybrid ML-KEM preferred, classical\
  \ fallback). Hybrid ML-KEM preference will be verified in testing.\n\nOperands in scope vs out of scope.\n\nRolling restart\
  \ on profile change. ConfigMap content hash is annotated on operand workloads; a cluster TLS profile change triggers operand\
  \ rolling update (same pattern as the operator).\n\nWhy\n\nCustomers expect ZTWIM operands to honor the same cluster TLS\
  \ policy as the rest of OpenShift when tlsAdherence: StrictAllComponents is enforced. Today, SPIRE operands use hardcoded\
  \ or Go-default TLS on their listeners and do not reflect APIServer profile changes.\n\n1. require_pq_kem is not the right\
  \ operator knob\n\nUpstream experimental.require_pq_kem hardcodes TLS 1.3 + PQ-only hybrid curves on both client and server\
  \ at each wired call site:\n\nWrong scope: PQ policy belongs on listeners; clients should remain capable negotiators. The\
  \ flag couples agent outbound client, Broker listener, and Agent Prometheus listener under a single agent.experimental knob.\n\
  \nToo rigid: no configurable min TLS, cipher suites, or progressive curve rollout; becomes redundant when OCP 5.1 exposes\
  \ curve preferences via the central TLS profile.\n\nEscape hatch only: advanced users may set it manually in operand ConfigMaps\
  \ when the operator runs in CREATE_ONLY_MODE; the operator takes no responsibility.\n\nPractical evaluation (Go 1.26, same\
  \ SPIRE image):\n\nSafe: agent↔server gRPC and https_spiffe federation between peer SPIRE servers do not break. Outbound\
  \ paths to Vault, kube-apiserver, ACME, and cloud APIs are unaffected (flag not wired on those clients).\n\nBreak surfaces:\
  \ Prometheus scrapers, Broker API inbound workloads, https_web bundle callers, admin TCP tooling, TLS proxies, and FIPS\
  \ runtime.\n\nFull matrix and handshake analysis: Running Notes Practical evaluation.\n\n2. tlsConfig is the superset of\
  \ require_pq_kem\n\nThe server/listener is the authority for TLS governance; clients remain capable negotiators.\n\nGoals\n\
  \nOperands honor cluster TLS profile on listener endpoints under strict adherence including OIDC Discovery Provider and\
  \ controller-manager webhook\n\nPQ readiness via DEFAULT:PQ base image + Go 1.26 without forcing PQ-only on clients\n\n\
  No duplicate or conflicting TLS knobs on the ZTWIM operand CR\n\nNon-goals\n\nTLS configuration on outbound SPIRE or external\
  \ clients\n\nIn-process TLS hot reload without pod restart\n\nOperator-managed require_pq_kem\n\nHow\n\nPropagation flow\n\
  \nAPIServer TLS profile / adherence change\n\n  → SecurityProfileWatcher restarts ZTWIM operator (Layer 1 — see Operator\
  \ ADR)\n\n  → Operator resolves cluster profile snapshot at startup\n\n  → If strict adherence: inject tls_profile as tls_config\
  \ into SPIRE Server / Agent ConfigMaps\n\n  → ConfigMap hash annotation changes → StatefulSet / DaemonSet rolling update\n\
  \n  → Operands restart; ApplyPolicy applies profile on listeners only\n\nStrict adherence gating\n\nTLSConfig injection\
  \ from operator applies only when tlsAdherence is strict (StrictAllComponents or forward-compatible unknown strict values).\
  \ When adherence is empty, or LegacyAdheringComponentsOnly, operands keep Go defaults (min TLS 1.2, hybrid ML-KEM preferred\
  \ by Go 1.26 with classical fallback).\n\nSPIRE tlsConfig application (listeners only)\n\nShared library pkg/common/tlspolicy/tlspolicy.go:\n\
  \nTLSConfig fields injected by operator maps to min_tls_version, cipher_suites, curve_preferences in operand HCL ConfigMaps.\n\
  \nParsing takes place as per what has been defined as valid tls_config described earlier.\n\nrequire_pq_kem, if manually\
  \ set, still applies to both client and server at wired call sites\n\nCurve preferences before OCP 5.1\n\nCluster APIServer\
  \ tlsSecurityProfile does not yet expose Groups (curve preferences) to components. Until OCP 5.1:\n\nOperator injects min_tls_version\
  \ and cipher_suites only\n\nGo 1.26 operand runtime advertises hybrid ML-KEM groups by default ahead of classical curves\n\
  \nTesting confirms hybrid ML-KEM is preferred in negotiated handshakes with classical fallback available\n\nAfter OCP 5.1,\
  \ curve_preferences from the resolved cluster profile are added to operand ConfigMaps.\n\nTesting and definition of done\n\
  \ntls-scanner against SPIRE Server and Agent listener endpoints under Intermediate, Modern, and Custom cluster profiles\
  \ (strict adherence)\n\nZTWIM functional tests — attestation, SVID issuance, federation, and metrics remain healthy after\
  \ profile injection and rolling restart\n\nHybrid ML-KEM preference — test evidence that Go 1.26 operands prefer hybrid\
  \ ML-KEM negotiation with classical fallback when curve preferences are not injected\n\nFIPS validation (140-2 and 140-3)\
  \ — confirm operand TLS listeners remain functional in FIPS mode and hybrid ML-KEM curves are available where the FIPS-enabled\
  \ Go 1.26 runtime supports them\n\nUnit tests for ConfigMap hash stability and profile injection gating\n\nAlternatives\n\
  \nrequire_pq_kem exposed on the ZTWIM operand CR\nRejected. Binds PQ policy to outbound clients as well as listeners; can\
  \ break cross-cluster SPIRE and non-SPIRE inbound peers (see Running notes). Becomes redundant when OCP 5.1 exposes curve\
  \ preferences via the central TLS profile: two competing knobs would confuse users on the correct PQ enforcement path.\n\
  \nPer-operand TLS config fields on the ZTWIM CR (e.g. separate min TLS / ciphers / curves overrides per SPIRE Server and\
  \ Agent)\nRejected. Precedence and merge rules between operand CR fields and the central APIServer TLS profile add branching\
  \ complexity and multiple sources of truth. Central profile inheritance keeps one knob.\n\nRisks\n\nReviews\n\n---\n\n#\
  \ ADR-UPSTREAM-AUTHORITY-PLUGIN\n\nADR: Native UpstreamAuthority Plugin Support for ZTWIM\n\nExecutive Summary\n\nZTWIM\
  \ currently uses a self-signed CA for SPIRE. This ADR proposes adding native UpstreamAuthority plugin support to the operator,\
  \ allowing the SPIRE intermediate CA to be signed by an external PKI -- either cert-manager (Red Hat operator) or HashiCorp\
  \ Vault (PKI secrets engine). The feature is configured declaratively via the SpireServer CR and reconciled natively by\
  \ the operator (no CREATE_ONLY_MODE required).\n\nNine configurations have been validated end-to-end on OCP 4.21 with ZTWIM\
  \ v1.0.0, including cross-cluster scenarios: external Vault exposed via OpenShift Route (edge-terminated, both insecure\
  \ and secure TLS), and cross-cluster cert-manager via kube_config_file. A critical upstream limitation was confirmed: the\
  \ SPIRE Vault plugin does not support file-path-based credentials (token_path) for token_auth or approle_auth, meaning env-var\
  \ injection (frozen at pod start) is the only option for these methods. The operator mitigates credential staleness via\
  \ secret-hash annotations (v1.1). k8s_auth is the only auth method with true auto-refresh via projected SA tokens. This\
  \ ADR covers the API changes (with detailed credential injection rationale), reconciliation design, deployment scenarios,\
  \ edge cases, alternatives, and risks.\n\nWhat\n\nThis document proposes changes to the ZTWIM operator to:\n\nAdd a new\
  \ optional upstreamAuthority field to the SpireServer Custom Resource spec\n\nModify the operator reconciliation loop to\
  \ generate the SPIRE UpstreamAuthority plugin block in server.conf (ConfigMap)\n\nInject environment variables, volumes,\
  \ and RBAC resources based on the chosen plugin and authentication method\n\nSupport two UpstreamAuthority plugins:\n\n\
  cert-manager -- zero-secret integration using an in-cluster Kubernetes client and cert-manager Issuer/ClusterIssuer\n\n\
  Vault -- four authentication methods: token_auth, approle_auth, k8s_auth, cert_auth\n\nReconcile the feature natively without\
  \ CREATE_ONLY_MODE -- the operator owns the ConfigMap, StatefulSet, and RBAC lifecycle\n\nComponents Touched\n\nWhy\n\n\
  Motivation\n\nEnterprises deploying SPIRE in production require the SPIRE CA to be chained to a corporate root CA. This\
  \ is driven by:\n\nCompliance requirements -- regulated industries mandate that all X.509 certificates trace back to a known,\
  \ audited root CA\n\nOperational consistency -- organizations with existing PKI (cert-manager or Vault) want SPIRE to participate\
  \ in their certificate hierarchy rather than maintaining a separate root of trust\n\nAudit trails -- a self-signed SPIRE\
  \ CA cannot be tied into enterprise certificate lifecycle management and revocation workflows\n\nPresent Circumstances\n\
  \nThe SPIRE server self-signs its X.509 CA. This is acceptable for development and testing but insufficient for production\
  \ PKI integration.\n\nCustomers already have cert-manager or Vault deployed in their infrastructure and need SPIRE to chain\
  \ to those systems.\n\nThe only current workaround is to enable CREATE_ONLY_MODE=true on the operator (via Subscription\
  \ patch), then manually edit the spire-server ConfigMap and StatefulSet. This is:\n\nNot production-viable -- manual patching\
  \ is error-prone and undocumented\n\nBreaks reconciliation -- the operator cannot manage resources it does not own\n\nLost\
  \ on upgrade -- any operator restart or OLM upgrade overwrites manual changes (unless CREATE_ONLY_MODE remains enabled,\
  \ which prevents all reconciliation)\n\nUpstream SPIRE supports UpstreamAuthority plugins natively. ZTWIM should expose\
  \ this capability declaratively, consistent with how it already exposes Federation and DataStore configuration.\n\nWhy a\
  \ Decision is Needed Now\n\nThe feature has been prototyped and validated end-to-end. The team needs consensus on the API\
  \ surface, secret handling strategy, and scope boundaries before implementation begins. This ADR captures the design decisions,\
  \ edge cases discovered during testing, and the rationale behind each choice.\n\nGoals\n\nDeclarative configuration via\
  \ SpireServer CR -- no manual ConfigMap editing\n\nZero secrets in ConfigMap -- use the env var injection (empty struct)\
  \ pattern for Vault token_auth and approle_auth\n\nSupport cert-manager Issuer and ClusterIssuer with the SPIRE server's\
  \ in-cluster Kubernetes client\n\nSupport Vault with four auth methods: token_auth, approle_auth, k8s_auth, cert_auth\n\n\
  Support external Vault instances (outside the cluster) with TLS CA certificate verification\n\nAutomated RBAC lifecycle\
  \ for cert-manager CertificateRequest permissions (create on enable, delete on removal)\n\nRolling updates on config change\
  \ via the existing config hash annotation mechanism\n\nClear operator status conditions for misconfiguration and upstream\
  \ CA failures\n\nRemoval support -- removing upstreamAuthority from the CR reverts SPIRE to self-signed CA\n\nNon-Goals\n\
  \nHow\n\nH1. Deployment Scenarios and Edge Cases\n\nThe following 10 scenarios cover the range of configurations from simplest\
  \ (cert-manager in-cluster) to most complex (external Vault Enterprise with namespaces). Each scenario documents the ConfigMap\
  \ content, StatefulSet modifications, prerequisites, and edge cases.\n\nScenario 1: cert-manager In-Cluster, CA Issuer (Same\
  \ Namespace)\n\nOverview: Simplest integration path. No secrets, no env vars, no extra volumes.\n\n[Mermaid Diagram]\n\n\
  ConfigMap generated:\n\n[json]\n\n\"UpstreamAuthority\": [{\n  \"cert-manager\": {\n    \"plugin_data\": {\n      \"namespace\"\
  : \"zero-trust-workload-identity-manager\",\n      \"issuer_name\": \"spire-ca-issuer\",\n      \"issuer_kind\": \"Issuer\"\
  ,\n      \"issuer_group\": \"cert-manager.io\",\n      \"kube_config_file\": \"\"\n    }\n  }\n}]\n\nStatefulSet modifications:\
  \ None.\n\nRBAC created by operator:\n\n[yaml]\n\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name:\
  \ spire-server-cert-manager\n  namespace: zero-trust-workload-identity-manager\nrules:\n- apiGroups: [\"cert-manager.io\"\
  ]\n  resources: [\"certificaterequests\"]\n  verbs: [\"get\", \"list\", \"create\", \"delete\"]\n---\napiVersion: rbac.authorization.k8s.io/v1\n\
  kind: RoleBinding\nmetadata:\n  name: spire-server-cert-manager\n  namespace: zero-trust-workload-identity-manager\nsubjects:\n\
  - kind: ServiceAccount\n  name: spire-server\n  namespace: zero-trust-workload-identity-manager\nroleRef:\n  kind: Role\n\
  \  name: spire-server-cert-manager\n  apiGroup: rbac.authorization.k8s.io\n\nPrerequisites:\n\nRed Hat cert-manager operator\
  \ installed\n\nIssuer created and in Ready state\n\nTest status: PASS on OCP 4.21.6.\n\nEdge cases:\n\nIf Issuer is not\
  \ Ready, the SPIRE plugin polls the CertificateRequest for ~1.25 min (300 iterations x 250ms), then returns codes.Internal\
  \ \"request did not become ready in time\". The SPIRE rotator retries every 10s. After 10 consecutive failures (~100s),\
  \ liveness/readiness health check fails and kubelet restarts the pod.\n\nScenario 2: cert-manager In-Cluster, ClusterIssuer\n\
  \nSame as Scenario 1 except issuerKind: ClusterIssuer.\n\nConfigMap generated: Same structure with \"issuer_kind\": \"ClusterIssuer\"\
  .\n\nPrerequisites:\n\nClusterIssuer created and in Ready state\n\nCA Secret must exist in the cert-manager namespace (not\
  \ the operator namespace). ClusterIssuers always look for their backing Secret in the cert-manager controller's namespace.\n\
  \nTest status: PASS (after copying CA Secret to cert-manager namespace).\n\nEdge case:\n\nIf the CA Secret is missing from\
  \ the cert-manager namespace, the ClusterIssuer stays NotReady. CertificateRequests time out. This is a common misconfiguration\
  \ -- the operator cannot verify it because it does not have access to the cert-manager namespace Secrets. Documentation\
  \ must call this out.\n\nScenario 3: cert-manager with External Kubeconfig (Cross-Cluster)\n\nThe upstream plugin supports\
  \ kube_config_file: \"/path/to/kubeconfig\" to target a different cluster's cert-manager instance.\n\nUse case: cert-manager\
  \ runs on a management cluster; SPIRE server is on a workload cluster.\n\nValidated via E2E test (2026-03-20): SPIRE server\
  \ on Cluster 1 (AWS) successfully obtained a CA certificate from cert-manager running on Cluster 2 (GCP) using a ServiceAccount\
  \ token-based kubeconfig mounted as a Secret volume.\n\n[Mermaid Diagram]\n\ngraph LR\n    subgraph cluster1 [Cluster 1\
  \ - SPIRE]\n        Pod[\"spire-server Pod\"]\n        KCSecret[\"Secret<br/>cross-cluster-kubeconfig\"]\n    end\n\n  \
  \  subgraph cluster2 [Cluster 2 - cert-manager]\n        CertMgr[\"cert-manager Controller\"]\n        Issuer[\"CA Issuer<br/>external-spire-ca\"\
  ]\n        SA[\"ServiceAccount<br/>spire-server-remote\"]\n    end\n\n    KCSecret -->|\"mounted at<br/>/run/spire/kubeconfig\"\
  | Pod\n    Pod -->|\"kube_config_file<br/>K8s API over TLS\"| CertMgr\n    CertMgr --> Issuer\n    Issuer -->|\"signed CA\
  \ cert\"| Pod\n\nConfigMap generated:\n\n[json]\n\n\"UpstreamAuthority\": [{\n  \"cert-manager\": {\n    \"plugin_data\"\
  : {\n      \"namespace\": \"zero-trust-workload-identity-manager\",\n      \"issuer_name\": \"external-spire-ca\",\n   \
  \   \"issuer_kind\": \"Issuer\",\n      \"issuer_group\": \"cert-manager.io\",\n      \"kube_config_file\": \"/run/spire/kubeconfig/kubeconfig\"\
  \n    }\n  }\n}]\n\nStatefulSet modifications:\n\n[yaml]\n\nvolumes:\n- name: cross-cluster-kubeconfig\n  secret:\n    secretName:\
  \ cross-cluster-kubeconfig\ncontainers:\n- name: spire-server\n  volumeMounts:\n  - name: cross-cluster-kubeconfig\n   \
  \ mountPath: /run/spire/kubeconfig\n    readOnly: true\n\nPrerequisites:\n\ncert-manager operator installed on the remote\
  \ cluster\n\nIssuer created and in Ready state on the remote cluster\n\nServiceAccount on remote cluster with RBAC for certificaterequests.cert-manager.io\n\
  \nKubeconfig Secret on local cluster containing the SA token-based kubeconfig\n\nNetwork reachability from SPIRE server\
  \ pod to the remote cluster's K8s API server\n\nTest status: PASS on OCP 4.21 (Cluster 1 AWS -> Cluster 2 GCP). Bundle issuer\
  \ changed to ZTWIM External Cluster Root CA.\n\nEdge cases:\n\nRemote K8s API server must be reachable from the SPIRE server\
  \ pod (firewall, egress policy)\n\nSA token in kubeconfig has an expiry. For long-lived tokens, use kubernetes.io/service-account-token\
  \ Secret type. For short-lived tokens, projected SA tokens expire and require refresh.\n\nThe cert-manager CertificateRequest\
  \ approval flow checks userInfo from the kubeconfig identity. Custom approvers may need to allow the remote SA identity.\n\
  \nDecision updated: Consider for v1 scope. See Section H2 for updated rationale.\n\nScenario 4: Vault In-Cluster, token_auth\
  \ (Env Var Injection)\n\nOverview: Vault deployed in same cluster. Token provided via environment variable.\n\n[Mermaid\
  \ Diagram]\n\nConfigMap generated (no secrets):\n\n[json]\n\n\"UpstreamAuthority\": [{\n  \"vault\": {\n    \"plugin_data\"\
  : {\n      \"pki_mount_point\": \"pki\",\n      \"token_auth\": {}\n    }\n  }\n}]\n\nvault_addr is omitted from ConfigMap.\
  \ Both VAULT_ADDR and VAULT_TOKEN are injected as env vars.\n\nStatefulSet env vars added:\n\n[yaml]\n\nenv:\n- name: VAULT_ADDR\n\
  \  value: \"http://vault.vault.svc.cluster.local:8200\"\n- name: VAULT_TOKEN\n  valueFrom:\n    secretKeyRef:\n      name:\
  \ vault-token\n      key: token\n\nPrerequisites:\n\nVault deployed with PKI engine enabled and configured\n\nK8s Secret\
  \ vault-token with key token containing a valid Vault token\n\nVault token must have update capability on <pki_mount_point>/root/sign-intermediate\n\
  \nTest status: PASS.\n\nEdge cases:\n\ntoken_path inside token_auth is NOT supported by the upstream SPIRE Vault plugin.\
  \ The plugin ignores the unknown field and reports \"token is empty\". The operator must NEVER generate token_path in the\
  \ token_auth block. This was confirmed via E2E testing (see Test Report, Section 7).\n\nThe only valid approaches for token_auth\
  \ are:\n| Approach | Works? | Secret in ConfigMap? |\n|----------|--------|---------------------|\n| token_auth: {} + VAULT_TOKEN\
  \ env var | Yes | No |\n| token_auth: {token: \"actual-value\"} | Yes | Yes (unacceptable) |\n| token_auth: {token_path:\
  \ \"/path\"} | No | N/A |\n\nScenario 5: Vault In-Cluster, approle_auth (Env Var Injection)\n\nConfigMap generated (no secrets):\n\
  \n[json]\n\n\"UpstreamAuthority\": [{\n  \"vault\": {\n    \"plugin_data\": {\n      \"pki_mount_point\": \"pki\",\n   \
  \   \"approle_auth\": {}\n    }\n  }\n}]\n\nIf appRoleMountPoint is set to a non-default value:\n\n[json]\n\n\"approle_auth\"\
  : {\n  \"approle_auth_mount_point\": \"custom-approle\"\n}\n\nStatefulSet env vars added:\n\n[yaml]\n\nenv:\n- name: VAULT_ADDR\n\
  \  value: \"http://vault.vault.svc.cluster.local:8200\"\n- name: VAULT_APPROLE_ID\n  valueFrom:\n    secretKeyRef:\n   \
  \   name: vault-approle\n      key: role_id\n- name: VAULT_APPROLE_SECRET_ID\n  valueFrom:\n    secretKeyRef:\n      name:\
  \ vault-approle\n      key: secret_id\n\nTest status: PASS.\n\nEdge cases:\n\nAppRole secret_id can be configured as single-use\
  \ (wrapping token). If so, a pod restart will fail because the secret_id has already been consumed. Operator documentation\
  \ must note: use non-wrapping secret_id for SPIRE, or configure the AppRole with secret_id_num_uses=0 (unlimited).\n\nThe\
  \ same empty struct + env var pattern as token_auth applies.\n\nScenario 6: Vault In-Cluster, k8s_auth (Projected SA Token)\n\
  \nOverview: Zero static credentials. Uses Kubernetes native service account token for Vault authentication.\n\n[Mermaid\
  \ Diagram]\n\nConfigMap generated:\n\n[json]\n\n\"UpstreamAuthority\": [{\n  \"vault\": {\n    \"plugin_data\": {\n    \
  \  \"vault_addr\": \"http://vault.vault.svc.cluster.local:8200\",\n      \"pki_mount_point\": \"pki\",\n      \"k8s_auth\"\
  : {\n        \"k8s_auth_role_name\": \"spire-server\",\n        \"token_path\": \"/var/run/secrets/tokens/vault\"\n    \
  \  }\n    }\n  }\n}]\n\nNote: vault_addr IS included in ConfigMap for k8s_auth (no sensitive values) and no VAULT env vars\
  \ are needed.\n\nStatefulSet volumes added:\n\n[yaml]\n\nvolumes:\n- name: vault-projected-token\n  projected:\n    sources:\n\
  \    - serviceAccountToken:\n        path: vault\n        expirationSeconds: 7200\n        audience: vault\ncontainers:\n\
  - name: spire-server\n  volumeMounts:\n  - name: vault-projected-token\n    mountPath: /var/run/secrets/tokens\n    readOnly:\
  \ true\n\nTest status: PASS (after fixing Vault prerequisites).\n\nPrerequisites (all three must be met):\n\nVault Kubernetes\
  \ auth enabled and configured:\n\nVault SA granted system:auth-delegator:\n\nVault role with matching audience:\n\nEdge\
  \ cases:\n\nIf any prerequisite is missing, SPIRE gets 403 permission denied from Vault on every rotation attempt. The error\
  \ surfaces only in SPIRE server logs, not in the operator.\n\ntoken_path inside k8s_auth IS valid and required (unlike token_path\
  \ in token_auth which is not supported). This is a subtle but critical distinction in the upstream plugin schemas.\n\nScenario\
  \ 7: Vault In-Cluster, cert_auth (mTLS File Mount)\n\nConfigMap generated:\n\n[json]\n\n\"UpstreamAuthority\": [{\n  \"\
  vault\": {\n    \"plugin_data\": {\n      \"vault_addr\": \"https://vault.vault.svc.cluster.local:8200\",\n      \"pki_mount_point\"\
  : \"pki\",\n      \"cert_auth\": {\n        \"client_cert_path\": \"/run/spire/vault/tls.crt\",\n        \"client_key_path\"\
  : \"/run/spire/vault/tls.key\"\n      }\n    }\n  }\n}]\n\nOptional fields: cert_auth_mount_point, cert_auth_role_name.\n\
  \nStatefulSet volumes/mounts added:\n\n[yaml]\n\nvolumes:\n- name: vault-client-cert\n  secret:\n    secretName: vault-client-cert\n\
  containers:\n- name: spire-server\n  volumeMounts:\n  - name: vault-client-cert\n    mountPath: /run/spire/vault/tls.crt\n\
  \    subPath: tls.crt\n    readOnly: true\n  - name: vault-client-cert\n    mountPath: /run/spire/vault/tls.key\n    subPath:\
  \ tls.key\n    readOnly: true\n\nTest status: NOT tested E2E (design-only, based on upstream plugin schema).\n\nEdge cases:\n\
  \nClient certificate expiry causes auth failure. The operator does not watch the Secret -- certificate renewal requires\
  \ a manual pod restart.\n\nCert and key must be PEM-encoded. DER format is not supported by the upstream plugin.\n\nThe\
  \ Vault cert auth backend must be configured to trust the CA that signed the client certificate.\n\nScenario 8: Vault External\
  \ to Cluster (Remote URL)\n\n[Mermaid Diagram]\n\nCR example:\n\n[yaml]\n\nspec:\n  upstreamAuthority:\n    vault:\n   \
  \   vaultAddr: \"https://vault.corp.example.com:8200\"\n      pkiMountPoint: pki\n      caCertSecretRef:\n        name:\
  \ vault-ca-cert\n        key: ca.crt\n      tokenAuth:\n        tokenSecretRef:\n          name: vault-token\n         \
  \ key: token\n\nRequirements:\n\ncaCertSecretRef must reference a Secret containing the CA certificate that signed the Vault\
  \ server's TLS certificate\n\nNetwork egress from SPIRE server pod to external Vault must be allowed (firewalls, NetworkPolicy,\
  \ proxy)\n\nIf CA cert is not provided and insecureSkipVerify is false (default), TLS verification falls back to the system\
  \ CA pool. If Vault uses a private CA not in the system trust store, the connection fails.\n\nConfigMap generated: Adds\
  \ ca_cert_path: \"/run/spire/vault/ca.crt\" to plugin_data.\n\nStatefulSet volumes added (CA cert):\n\n[yaml]\n\nvolumes:\n\
  - name: vault-ca-cert\n  secret:\n    secretName: vault-ca-cert\ncontainers:\n- name: spire-server\n  volumeMounts:\n  -\
  \ name: vault-ca-cert\n    mountPath: /run/spire/vault/ca.crt\n    subPath: ca.crt\n    readOnly: true\n\nTest status: PASS\
  \ (2026-03-20). Tested with Vault on Cluster 2 (GCP), exposed via edge-terminated OpenShift Route, consumed by SPIRE server\
  \ on Cluster 1 (AWS). Both token_auth and approle_auth validated with both insecure_skip_verify: true and ca_cert_path pointing\
  \ to the OpenShift router CA certificate.\n\nEdge cases:\n\nVault URL changes (DNS/IP migration) require CR update. ConfigMap\
  \ hash changes, triggering rolling update.\n\nVAULT_ADDR env var takes precedence over vault_addr in config (upstream getEnvOrDefault\
  \ behavior). The operator should be consistent: set ONLY the env var for token/approle, include vault_addr in ConfigMap\
  \ for k8s/cert auth.\n\nIf Vault is behind a corporate firewall, EgressNetworkPolicy or NetworkPolicy must allow traffic\
  \ from the SPIRE server namespace to the external Vault endpoint.\n\nEdge-terminated Route TLS trust chain: When Vault runs\
  \ HTTP behind an OpenShift edge-terminated Route, the TLS certificate presented to clients is the OpenShift router's ingress\
  \ certificate (signed by the ingress-operator self-signed CA). The caCertSecretRef must contain this router CA, not Vault's\
  \ own CA. Extract via: oc get secret router-ca -n openshift-ingress-operator -o jsonpath='{.data.tls\\.crt}' | base64 -d.\n\
  \nScenario 9: Vault Behind Proxy / Ingress (OpenShift Route)\n\nValidated via E2E test (2026-03-20) using an edge-terminated\
  \ OpenShift Route:\n\n[Mermaid Diagram]\n\nTLS trust chain for edge-terminated Routes:\n\nIf proxy/Route terminates TLS:\
  \ caCertSecretRef must trust the proxy/router's certificate CA, not Vault's\n\nIf proxy passes through TLS: caCertSecretRef\
  \ must trust Vault's certificate directly\n\ninsecureSkipVerify: true can be used for testing but must NOT be used in production\n\
  \nThe upstream Vault client uses standard Go net/http with TLS configuration set by the plugin. No special proxy support\
  \ is built into the plugin -- standard HTTP_PROXY/HTTPS_PROXY environment variables would apply if set on the container.\n\
  \nTest status: PASS (edge-terminated Route with both insecure and secure TLS modes validated). See Scenario 8 sub-tests.\n\
  \nScenario 10: Vault Enterprise with Namespaces\n\n[yaml]\n\nspec:\n  upstreamAuthority:\n    vault:\n      vaultAddr: \"\
  https://vault.corp.example.com:8200\"\n      vaultNamespace: \"engineering/team-a\"\n      pkiMountPoint: pki\n      k8sAuth:\n\
  \        k8sAuthRoleName: spire-server\n\nvaultNamespace maps to VAULT_NAMESPACE env var or namespace in plugin_data\n\n\
  Upstream behavior: env var VAULT_NAMESPACE takes precedence over config field (via getEnvOrDefault)\n\nAll PKI and auth\
  \ operations are scoped to that Vault namespace\n\nThe Vault role and PKI engine must be configured within the specified\
  \ namespace\n\nTest status: NOT tested. Design based on upstream source (vc.SetNamespace() when non-empty).\n\nH2. The kube_config_file\
  \ Decision\n\nThe upstream cert-manager plugin supports kube_config_file:\n\nEmpty string (\"\") -- uses rest.InClusterConfig()\
  \ (SPIRE server's ServiceAccount token)\n\nNon-empty path -- uses clientcmd.BuildConfigFromFlags() to load an external kubeconfig\
  \ file\n\nOriginal decision: Omit external kubeconfig from v1.\n\nUpdated decision (2026-03-20): Cross-cluster cert-manager\
  \ IS feasible and validated. E2E Test 9 proved that SPIRE on Cluster 1 (AWS) can successfully use kube_config_file to reach\
  \ cert-manager on Cluster 2 (GCP) and obtain CA certificates signed by the remote Issuer. The test used a kubernetes.io/service-account-token\
  \ Secret-based kubeconfig with a dedicated ServiceAccount on the remote cluster.\n\nRecommendation: Include kubeConfigSecretRef\
  \ as an optional field in the UpstreamAuthorityCertManager struct. When set, the operator mounts the kubeconfig Secret as\
  \ a volume and sets kube_config_file in the ConfigMap. When absent, kube_config_file: \"\" uses the in-cluster client.\n\
  \n[go]\n\ntype UpstreamAuthorityCertManager struct {\n    // ... existing fields ...\n\n    // +kubebuilder:validation:Optional\n\
  \    // When set, the operator mounts this Secret as a volume and sets\n    // kube_config_file in the SPIRE server config\
  \ to target an external\n    // cluster's cert-manager instance.\n    KubeConfigSecretRef *SecretKeyReference `json:\"kubeConfigSecretRef,omitempty\"\
  `\n}\n\nH3. SPIRE Server Behavior -- Edge Cases from Upstream Source\n\nThese behaviors are intrinsic to SPIRE and affect\
  \ how the operator should handle UpstreamAuthority:\n\nH4. API Changes\n\nFollowing existing ZTWIM patterns from api/v1alpha1/spire_server_config_types.go:\n\
  \nOptional feature structs are pointer types (e.g., Federation *FederationConfig)\n\nSensitive data uses Secret references,\
  \ never inline values\n\nKubebuilder validation markers enforce constraints at admission\n\nXValidation rules enforce one-of\
  \ semantics\n\nNew Field on SpireServerSpec\n\n[go]\n\n// upstreamAuthority configures the SPIRE server to use an external\
  \ upstream CA.\n// When set, SPIRE delegates CA signing to cert-manager or Vault instead of self-signing.\n// Exactly one\
  \ of certManager or vault must be set.\n// +kubebuilder:validation:Optional\nUpstreamAuthority *UpstreamAuthorityConfig\
  \ `json:\"upstreamAuthority,omitempty\"`\n\nUpstreamAuthorityConfig\n\n[go]\n\n// +kubebuilder:validation:XValidation:rule=\"\
  (has(self.certManager) && !has(self.vault)) || (!has(self.certManager) && has(self.vault))\",message=\"exactly one of certManager\
  \ or vault must be set\"\ntype UpstreamAuthorityConfig struct {\n    CertManager *UpstreamAuthorityCertManager `json:\"\
  certManager,omitempty\"`\n    Vault       *UpstreamAuthorityVault       `json:\"vault,omitempty\"`\n}\n\ncert-manager Struct\n\
  \n[go]\n\ntype UpstreamAuthorityCertManager struct {\n    // +kubebuilder:validation:Required\n    // +kubebuilder:validation:MinLength=1\n\
  \    // +kubebuilder:validation:MaxLength=63\n    Namespace string `json:\"namespace\"`\n\n    // +kubebuilder:validation:Required\n\
  \    // +kubebuilder:validation:MinLength=1\n    // +kubebuilder:validation:MaxLength=253\n    IssuerName string `json:\"\
  issuerName\"`\n\n    // +kubebuilder:validation:Optional\n    // +kubebuilder:validation:Enum=Issuer;ClusterIssuer\n   \
  \ // +kubebuilder:default:=Issuer\n    IssuerKind string `json:\"issuerKind,omitempty\"`\n\n    // +kubebuilder:validation:Optional\n\
  \    // +kubebuilder:validation:MaxLength=253\n    // +kubebuilder:default:=cert-manager.io\n    IssuerGroup string `json:\"\
  issuerGroup,omitempty\"`\n\n    // +kubebuilder:validation:Optional\n    // When set, the operator mounts this Secret as\
  \ a kubeconfig volume\n    // and sets kube_config_file to target an external cluster's cert-manager.\n    // The Secret\
  \ must contain a key with a valid kubeconfig YAML.\n    // When absent, the SPIRE server uses its in-cluster Kubernetes\
  \ client.\n    // Validated via E2E cross-cluster test (AWS -> GCP).\n    KubeConfigSecretRef *SecretKeyReference `json:\"\
  kubeConfigSecretRef,omitempty\"`\n}\n\nVault Struct\n\n[go]\n\n// +kubebuilder:validation:XValidation:rule=\"(has(self.tokenAuth)?1:0)\
  \ + (has(self.certAuth)?1:0) + (has(self.appRoleAuth)?1:0) + (has(self.k8sAuth)?1:0) == 1\",message=\"exactly one auth method\
  \ must be set\"\ntype UpstreamAuthorityVault struct {\n    // +kubebuilder:validation:Required\n    // +kubebuilder:validation:Pattern=`^https?://.+`\n\
  \    VaultAddr string `json:\"vaultAddr\"`\n\n    // +kubebuilder:validation:Optional\n    // +kubebuilder:default:=\"pki\"\
  \n    PKIMountPoint string `json:\"pkiMountPoint,omitempty\"`\n\n    // +kubebuilder:validation:Optional\n    CACertSecretRef\
  \ *SecretKeyReference `json:\"caCertSecretRef,omitempty\"`\n\n    // +kubebuilder:validation:Optional\n    // +kubebuilder:default:=false\n\
  \    InsecureSkipVerify bool `json:\"insecureSkipVerify,omitempty\"`\n\n    // +kubebuilder:validation:Optional\n    VaultNamespace\
  \ string `json:\"vaultNamespace,omitempty\"`\n\n    TokenAuth   *VaultTokenAuthConfig   `json:\"tokenAuth,omitempty\"`\n\
  \    CertAuth    *VaultCertAuthConfig    `json:\"certAuth,omitempty\"`\n    AppRoleAuth *VaultAppRoleAuthConfig `json:\"\
  appRoleAuth,omitempty\"`\n    K8sAuth     *VaultK8sAuthConfig     `json:\"k8sAuth,omitempty\"`\n}\n\nSecret Reference Types\n\
  \n[go]\n\n// SecretKeyReference identifies a specific key within a named Kubernetes Secret.\n// The operator resolves this\
  \ reference during reconciliation:\n//   - For env-var-based credentials (token_auth, approle_auth): injected as container\
  \ env vars via secretKeyRef\n//   - For file-based credentials (k8s_auth, cert_auth, caCert, kubeconfig): mounted as volumes\n\
  // This distinction matters for secret rotation -- see H12 for details.\ntype SecretKeyReference struct {\n    // +kubebuilder:validation:Required\n\
  \    // +kubebuilder:validation:MinLength=1\n    Name string `json:\"name\"`\n    // +kubebuilder:default:=\"ca.crt\"\n\
  \    Key string `json:\"key,omitempty\"`\n}\n\n[go]\n\n// VaultTokenAuthConfig injects the Vault token as the VAULT_TOKEN\
  \ env var.\n//\n// Credential injection strategy: ENV VAR (secretKeyRef)\n//   Upstream doc (token_auth): only field is\
  \ `token` with default `${VAULT_TOKEN}`\n//   Upstream source: genClientParams() calls getEnvOrDefault(envVaultToken, config.TokenAuth.Token)\n\
  //   Upstream struct: TokenAuthConfig { Token string `hcl:\"token\"` } -- NO token_path field\n//   Env vars are frozen\
  \ at pod start -- Secret changes require pod restart.\n//   Operator mitigates this via secret-hash annotation (v1.1).\n\
  //\n// Ref: https://github.com/spiffe/spire/blob/main/doc/plugin_server_upstreamauthority_vault.md#token-authentication\n\
  //\n// Generated SPIRE config:\n//   UpstreamAuthority \"vault\" { plugin_data { vault_addr = \"...\" token_auth = {} }\
  \ }\n//   (empty token_auth{} -- the plugin reads VAULT_TOKEN from env)\ntype VaultTokenAuthConfig struct {\n    // +kubebuilder:validation:Required\n\
  \    // Secret must contain the Vault token value.\n    // Injected as: env VAULT_TOKEN via secretKeyRef\n    TokenSecretRef\
  \ SecretKeyReference `json:\"tokenSecretRef\"`\n}\n\n[go]\n\n// VaultAppRoleAuthConfig injects AppRole credentials as env\
  \ vars.\n//\n// Credential injection strategy: ENV VAR (secretKeyRef)\n//   Upstream doc (approle_auth): fields are approle_auth_mount_point,\
  \ approle_id (default ${VAULT_APPROLE_ID}),\n//     approle_secret_id (default ${VAULT_APPROLE_SECRET_ID})\n//   Upstream\
  \ source: genClientParams() calls getEnvOrDefault(envVaultAppRoleID, config.AppRoleAuth.RoleID)\n//   Upstream struct: AppRoleAuthConfig\
  \ { RoleID, SecretID, AppRoleMountPoint } -- NO *_path fields\n//   Double-caching: AppRole → Vault client token → LifetimeWatcher\
  \ renews.\n//   Silent failure window = client_token_TTL + ca_ttl/2.\n//   Same secret-hash annotation mitigation as token_auth.\n\
  //\n// Ref: https://github.com/spiffe/spire/blob/main/doc/plugin_server_upstreamauthority_vault.md#approle-authentication\n\
  type VaultAppRoleAuthConfig struct {\n    // +kubebuilder:validation:Optional\n    // +kubebuilder:default:=\"approle\"\n\
  \    AppRoleMountPoint string `json:\"appRoleMountPoint,omitempty\"`\n    // +kubebuilder:validation:Required\n    AppRoleSecretRef\
  \ VaultAppRoleSecretRef `json:\"appRoleSecretRef\"`\n}\n\ntype VaultAppRoleSecretRef struct {\n    // +kubebuilder:validation:Required\n\
  \    // +kubebuilder:validation:MinLength=1\n    Name string `json:\"name\"`\n    // +kubebuilder:default:=\"role_id\"\n\
  \    // Injected as: env VAULT_APPROLE_ID via secretKeyRef\n    RoleIDKey string `json:\"roleIDKey,omitempty\"`\n    //\
  \ +kubebuilder:default:=\"secret_id\"\n    // Injected as: env VAULT_APPROLE_SECRET_ID via secretKeyRef\n    SecretIDKey\
  \ string `json:\"secretIDKey,omitempty\"`\n}\n\n[go]\n\n// VaultK8sAuthConfig uses a projected ServiceAccount token for\
  \ auth.\n//\n// Credential injection strategy: FILE (volume mount)\n//   Upstream doc (k8s_auth): fields are k8s_auth_mount_point\
  \ (default kubernetes),\n//     k8s_auth_role_name (required), token_path (required)\n//   Upstream source: os.ReadFile(c.clientParams.K8sAuthTokenPath)\
  \ on every auth attempt\n//   Upstream struct: K8sAuthConfig { K8sAuthMountPoint, K8sAuthRoleName, TokenPath }\n//   Kubelet\
  \ auto-refreshes projected SA token at ~80% of expiry.\n//   This means the SPIRE plugin always gets a fresh token -- zero\
  \ restarts.\n//\n// Ref: https://github.com/spiffe/spire/blob/main/doc/plugin_server_upstreamauthority_vault.md#kubernetes-authentication\n\
  //\n// RECOMMENDED for in-cluster Vault: zero-credential, zero-downtime, auto-refresh.\n//\n// Generated SPIRE config:\n\
  //   UpstreamAuthority \"vault\" {\n//     plugin_data {\n//       vault_addr = \"...\"\n//       k8s_auth {\n//       \
  \  k8s_auth_role_name = \"...\"\n//         token_path = \"/var/run/secrets/tokens/vault\"\n//       }\n//     }\n//   }\n\
  //\n// Operator must also inject a projected SA token volume into the StatefulSet:\n//   volumes:\n//     - name: vault-sa-token\n\
  //       projected:\n//         sources:\n//           - serviceAccountToken:\n//               path: vault\n//        \
  \       expirationSeconds: 600\n//               audience: <audience>\ntype VaultK8sAuthConfig struct {\n    // +kubebuilder:validation:Optional\n\
  \    // +kubebuilder:default:=\"kubernetes\"\n    K8sAuthMountPoint string `json:\"k8sAuthMountPoint,omitempty\"`\n    //\
  \ +kubebuilder:validation:Required\n    K8sAuthRoleName string `json:\"k8sAuthRoleName\"`\n    // +kubebuilder:default:=\"\
  /var/run/secrets/tokens/vault\"\n    // File-based: kubelet refreshes this automatically at ~80% of expirationSeconds\n\
  \    TokenPath string `json:\"tokenPath,omitempty\"`\n    // +kubebuilder:default:=\"vault\"\n    // Must match the bound_audiences\
  \ configured in Vault's k8s auth role\n    Audience string `json:\"audience,omitempty\"`\n}\n\n[go]\n\n// VaultCertAuthConfig\
  \ uses TLS client certificates for Vault auth.\n//\n// Credential injection strategy: FILE (volume mount)\n//   Upstream\
  \ doc (cert_auth): fields are cert_auth_mount_point (default cert),\n//     cert_auth_role_name, client_cert_path (default\
  \ ${VAULT_CLIENT_CERT}),\n//     client_key_path (default ${VAULT_CLIENT_KEY})\n//   Upstream source: getEnvOrDefault(envVaultClientCert,\
  \ config.CertAuth.ClientCertPath)\n//   Upstream struct: CertAuthConfig { CertAuthMountPoint, CertAuthRoleName, ClientCertPath,\
  \ ClientKeyPath }\n//   Volume-mounted Secrets are auto-updated by kubelet (~60s).\n//   CAVEAT: TLS config is loaded once\
  \ at plugin Configure() time.\n//   Even though files update, the running plugin holds stale TLS state.\n//   Pod restart\
  \ is still required for cert rotation to take effect.\n//\n// Ref: https://github.com/spiffe/spire/blob/main/doc/plugin_server_upstreamauthority_vault.md#client-certificate-authentication\n\
  type VaultCertAuthConfig struct {\n    // +kubebuilder:validation:Optional\n    // +kubebuilder:default:=\"cert\"\n    CertAuthMountPoint\
  \ string `json:\"certAuthMountPoint,omitempty\"`\n    CertAuthRoleName   string `json:\"certAuthRoleName,omitempty\"`\n\
  \    // +kubebuilder:validation:Required\n    // Mounted as file: /run/spire/vault/client-cert/<key>\n    ClientCertSecretRef\
  \ SecretKeyReference `json:\"clientCertSecretRef\"`\n    // +kubebuilder:validation:Required\n    // Mounted as file: /run/spire/vault/client-key/<key>\n\
  \    ClientKeySecretRef SecretKeyReference `json:\"clientKeySecretRef\"`\n}\n\nCredential Injection Strategy Summary\n\n\
  Key Design Decisions\n\nExample CR YAMLs\n\ncert-manager with CA Issuer (in-cluster):\n\n[yaml]\n\napiVersion: operator.openshift.io/v1alpha1\n\
  kind: SpireServer\nmetadata:\n  name: cluster\nspec:\n  upstreamAuthority:\n    certManager:\n      namespace: zero-trust-workload-identity-manager\n\
  \      issuerName: spire-ca-issuer\n      issuerKind: Issuer\n      issuerGroup: cert-manager.io\n# Operator generates:\
  \ UpstreamAuthority \"cert-manager\" { plugin_data { issuer_name = \"spire-ca-issuer\" ... } }\n# No secrets needed -- SPIRE\
  \ uses in-cluster ServiceAccount for cert-manager API.\n# RBAC: Operator creates ClusterRole/ClusterRoleBinding for CertificateRequest\
  \ permissions.\n\ncert-manager with cross-cluster kubeconfig (validated):\n\n[yaml]\n\nspec:\n  upstreamAuthority:\n   \
  \ certManager:\n      namespace: zero-trust-workload-identity-manager\n      issuerName: external-spire-ca\n      issuerKind:\
  \ Issuer\n      issuerGroup: cert-manager.io\n      kubeConfigSecretRef:\n        name: cross-cluster-kubeconfig\n     \
  \   key: kubeconfig\n# Injection: FILE -- Secret mounted as volume at /run/spire/kubeconfig/kubeconfig\n# Operator generates:\
  \ kube_config_file = \"/run/spire/kubeconfig/kubeconfig\"\n# Kubelet refreshes volume-mounted Secret (~60s sync). SPIRE\
  \ may cache K8s client.\n\nVault token_auth -- env var injection (upstream limitation):\n\n[yaml]\n\nspec:\n  upstreamAuthority:\n\
  \    vault:\n      vaultAddr: \"https://vault.example.com:8200\"\n      pkiMountPoint: pki\n      tokenAuth:\n        tokenSecretRef:\n\
  \          name: vault-token\n          key: token\n# Injection: ENV VAR -- VAULT_TOKEN injected via secretKeyRef\n# Operator\
  \ generates: token_auth = {} (empty block; plugin reads VAULT_TOKEN env)\n# WARNING: Env vars freeze at pod start. Secret\
  \ rotation requires pod restart.\n#          Operator v1.1 mitigates with secret-hash annotation on StatefulSet PodTemplate.\n\
  # NOTE: token_path is NOT supported in token_auth (upstream does not implement it).\n\nVault approle_auth -- env var injection\
  \ (upstream limitation):\n\n[yaml]\n\nspec:\n  upstreamAuthority:\n    vault:\n      vaultAddr: \"https://vault.example.com:8200\"\
  \n      pkiMountPoint: pki\n      appRoleAuth:\n        appRoleMountPoint: approle\n        appRoleSecretRef:\n        \
  \  name: vault-approle-creds\n          roleIDKey: role_id\n          secretIDKey: secret_id\n# Injection: ENV VAR -- VAULT_APPROLE_ID,\
  \ VAULT_APPROLE_SECRET_ID via secretKeyRef\n# Operator generates: approle_auth { approle_mount_point = \"approle\" } (credentials\
  \ from env)\n# WARNING: Double-caching -- secret_id used once to get Vault client token,\n#          then LifetimeWatcher\
  \ renews client token. Silent failure window =\n#          client_token_TTL + ca_ttl/2.\n\nVault k8s_auth -- file-based,\
  \ auto-refresh (RECOMMENDED for in-cluster):\n\n[yaml]\n\nspec:\n  upstreamAuthority:\n    vault:\n      vaultAddr: \"https://vault.vault.svc.cluster.local:8200\"\
  \n      pkiMountPoint: pki\n      caCertSecretRef:\n        name: vault-ca\n        key: ca.crt\n      k8sAuth:\n      \
  \  k8sAuthRoleName: spire-server\n        k8sAuthMountPoint: kubernetes\n        tokenPath: /var/run/secrets/tokens/vault\n\
  \        audience: vault\n# Injection: FILE -- projected SA token at tokenPath, auto-refreshed by kubelet\n# Operator generates:\
  \ k8s_auth { k8s_auth_role_name = \"spire-server\" token_path = \"/var/run/secrets/tokens/vault\" }\n# Operator also injects\
  \ projected SA token volume into StatefulSet:\n#   volumes:\n#     - name: vault-sa-token\n#       projected:\n#       \
  \  sources:\n#           - serviceAccountToken: { path: vault, expirationSeconds: 600, audience: vault }\n#   volumeMounts:\n\
  #     - name: vault-sa-token\n#       mountPath: /var/run/secrets/tokens\n# ZERO-CREDENTIAL, ZERO-DOWNTIME: kubelet refreshes\
  \ token at ~80% expiry,\n# SPIRE re-reads token_path on re-auth. No secrets to manage. No restarts.\n\nVault cert_auth --\
  \ file-based (restart needed for cert rotation):\n\n[yaml]\n\nspec:\n  upstreamAuthority:\n    vault:\n      vaultAddr:\
  \ \"https://vault.example.com:8200\"\n      pkiMountPoint: pki\n      certAuth:\n        certAuthMountPoint: cert\n    \
  \    certAuthRoleName: spire\n        clientCertSecretRef:\n          name: vault-client-cert\n          key: tls.crt\n\
  \        clientKeySecretRef:\n          name: vault-client-key\n          key: tls.key\n# Injection: FILE -- Secrets mounted\
  \ as volumes\n#   /run/spire/vault/client-cert/tls.crt and /run/spire/vault/client-key/tls.key\n# Operator generates: cert_auth\
  \ { client_cert_path = \"...\" client_key_path = \"...\" }\n# CAVEAT: Kubelet updates files (~60s), but SPIRE loads TLS\
  \ config once at startup.\n# Cert rotation still requires pod restart. Operator v1.1 mitigates with secret-hash annotation.\n\
  \nVault with external instance + CA cert (validated cross-cluster):\n\n[yaml]\n\nspec:\n  upstreamAuthority:\n    vault:\n\
  \      vaultAddr: \"https://vault-vault.apps.remote-cluster.example.com\"\n      pkiMountPoint: pki\n      caCertSecretRef:\n\
  \        name: vault-external-ca\n        key: ca.crt\n      appRoleAuth:\n        appRoleSecretRef:\n          name: vault-external-approle\n\
  \          roleIDKey: role_id\n          secretIDKey: secret_id\n# caCertSecretRef injection: FILE -- mounted at /run/spire/vault/ca/ca.crt\n\
  # appRoleSecretRef injection: ENV VAR -- VAULT_APPROLE_ID, VAULT_APPROLE_SECRET_ID\n# For external Vault behind OpenShift\
  \ Route (edge-terminated TLS):\n#   caCertSecretRef must contain the Route's CA (router-ca from openshift-ingress-operator).\n\
  \nVault with external instance + insecureSkipVerify (testing only, validated):\n\n[yaml]\n\nspec:\n  upstreamAuthority:\n\
  \    vault:\n      vaultAddr: \"https://vault-vault.apps.remote-cluster.example.com\"\n      pkiMountPoint: pki\n      insecureSkipVerify:\
  \ true\n      tokenAuth:\n        tokenSecretRef:\n          name: vault-external-token\n          key: token\n# insecureSkipVerify=true:\
  \ Operator generates insecure_skip_verify = true in SPIRE config.\n# WARNING: Skips TLS verification. For development/testing\
  \ only. Not recommended for production.\n\nH5. Operator Reconciliation Design\n\nFile Change Summary\n\n[Mermaid Diagram]\n\
  \nReconciliation Loop Integration\n\nThe existing loop has 16 steps. Two new steps are inserted:\n\nValidation Logic\n\n\
  validateUpstreamAuthorityConfig() checks:\n\nExactly one of certManager or vault is set (belt-and-suspenders with XValidation)\n\
  \ncert-manager: namespace and issuerName are non-empty\n\nVault: vaultAddr is non-empty; exactly one auth method is set\n\
  \nVault token_auth: tokenSecretRef.name is non-empty; referenced Secret exists in operator namespace\n\nVault approle_auth:\
  \ appRoleSecretRef.name is non-empty; referenced Secret exists\n\nVault cert_auth: clientCertSecretRef and clientKeySecretRef\
  \ names are non-empty; Secrets exist\n\nVault k8s_auth: k8sAuthRoleName is non-empty\n\nIf caCertSecretRef is set: referenced\
  \ Secret exists\n\nOn failure: sets ConfigurationValid status condition to False, does not proceed with ConfigMap/StatefulSet\
  \ generation.\n\nRBAC Lifecycle\n\nWhen upstreamAuthority.certManager is set:\n\nOperator creates Role + RoleBinding for\
  \ certificaterequests.cert-manager.io in the configured namespace\n\nFollows existing RBAC reconciliation pattern: build\
  \ desired, get existing, create-or-update\n\nWhen upstreamAuthority.certManager is removed (or switched to Vault):\n\nOperator\
  \ deletes the cert-manager Role and RoleBinding\n\nThis is different from other RBAC resources which are only created/updated,\
  \ never deleted. The cleanup is necessary because the cert-manager RBAC is in a user-specified namespace, not the operator\
  \ namespace.\n\nConfigMap Generation\n\nThe generateServerConfMap() function is extended:\n\n[go]\n\nif config.UpstreamAuthority\
  \ != nil {\n    ua := config.UpstreamAuthority\n    var uaPlugin map[string]interface{}\n\n    if ua.CertManager != nil\
  \ {\n        uaPlugin = buildCertManagerUA(ua.CertManager)\n    } else if ua.Vault != nil {\n        uaPlugin = buildVaultUA(ua.Vault)\n\
  \    }\n\n    if uaPlugin != nil {\n        plugins := configMap[\"plugins\"].(map[string]interface{})\n        plugins[\"\
  UpstreamAuthority\"] = []map[string]interface{}{uaPlugin}\n    }\n}\n\nWhen upstreamAuthority is removed, the UpstreamAuthority\
  \ key is absent from the plugins map. The ConfigMap hash changes, triggering a rolling update that restarts SPIRE with self-signed\
  \ CA.\n\nStatefulSet Generation\n\nAfter the existing db-certs volume logic:\n\n[go]\n\nif config.UpstreamAuthority != nil\
  \ && config.UpstreamAuthority.Vault != nil {\n    vault := config.UpstreamAuthority.Vault\n    addVaultEnvAndVolumes(vault,\
  \ &spireServerVolumeMounts, &volumes, &spireServerEnvVars)\n}\n\nif config.UpstreamAuthority != nil && config.UpstreamAuthority.CertManager\
  \ != nil {\n    cm := config.UpstreamAuthority.CertManager\n    if cm.KubeConfigSecretRef != nil {\n        addKubeConfigVolume(cm.KubeConfigSecretRef,\
  \ &spireServerVolumeMounts, &volumes)\n    }\n}\n\naddVaultEnvAndVolumes injection logic by auth method:\n\n[go]\n\nfunc\
  \ addVaultEnvAndVolumes(vault *UpstreamAuthorityVault, mounts *[]corev1.VolumeMount,\n    volumes *[]corev1.Volume, envVars\
  \ *[]corev1.EnvVar) {\n\n    // Always add VAULT_ADDR (non-secret, value from CR)\n    *envVars = append(*envVars, corev1.EnvVar{\n\
  \        Name: \"VAULT_ADDR\", Value: vault.VaultAddr,\n    })\n\n    // token_auth: ENV VAR injection (upstream limitation\
  \ -- no token_path support)\n    if vault.TokenAuth != nil {\n        *envVars = append(*envVars, corev1.EnvVar{\n     \
  \       Name: \"VAULT_TOKEN\",\n            ValueFrom: &corev1.EnvVarSource{\n                SecretKeyRef: &corev1.SecretKeySelector{\n\
  \                    LocalObjectReference: corev1.LocalObjectReference{Name: vault.TokenAuth.TokenSecretRef.Name},\n   \
  \                 Key: vault.TokenAuth.TokenSecretRef.Key,\n                },\n            },\n        })\n    }\n\n  \
  \  // approle_auth: ENV VAR injection (upstream limitation -- no *_path support)\n    if vault.AppRoleAuth != nil {\n  \
  \      ref := vault.AppRoleAuth.AppRoleSecretRef\n        *envVars = append(*envVars, corev1.EnvVar{\n            Name:\
  \ \"VAULT_APPROLE_ID\",\n            ValueFrom: &corev1.EnvVarSource{\n                SecretKeyRef: &corev1.SecretKeySelector{\n\
  \                    LocalObjectReference: corev1.LocalObjectReference{Name: ref.Name},\n                    Key: ref.RoleIDKey,\n\
  \                },\n            },\n        }, corev1.EnvVar{\n            Name: \"VAULT_APPROLE_SECRET_ID\",\n       \
  \     ValueFrom: &corev1.EnvVarSource{\n                SecretKeyRef: &corev1.SecretKeySelector{\n                    LocalObjectReference:\
  \ corev1.LocalObjectReference{Name: ref.Name},\n                    Key: ref.SecretIDKey,\n                },\n        \
  \    },\n        })\n    }\n\n    // k8s_auth: FILE injection (projected SA token -- auto-refreshes, zero-downtime)\n  \
  \  if vault.K8sAuth != nil {\n        *volumes = append(*volumes, corev1.Volume{\n            Name: \"vault-sa-token\",\n\
  \            VolumeSource: corev1.VolumeSource{\n                Projected: &corev1.ProjectedVolumeSource{\n           \
  \         Sources: []corev1.VolumeProjection{{\n                        ServiceAccountToken: &corev1.ServiceAccountTokenProjection{\n\
  \                            Path:              \"vault\",\n                            ExpirationSeconds: ptr.To(int64(600)),\n\
  \                            Audience:          vault.K8sAuth.Audience,\n                        },\n                  \
  \  }},\n                },\n            },\n        })\n        *mounts = append(*mounts, corev1.VolumeMount{\n        \
  \    Name: \"vault-sa-token\", MountPath: \"/var/run/secrets/tokens\", ReadOnly: true,\n        })\n    }\n\n    // cert_auth:\
  \ FILE injection (Secret volumes -- files update but TLS loaded once)\n    if vault.CertAuth != nil {\n        *volumes\
  \ = append(*volumes, corev1.Volume{\n            Name: \"vault-client-cert\",\n            VolumeSource: corev1.VolumeSource{\n\
  \                Secret: &corev1.SecretVolumeSource{SecretName: vault.CertAuth.ClientCertSecretRef.Name},\n            },\n\
  \        }, corev1.Volume{\n            Name: \"vault-client-key\",\n            VolumeSource: corev1.VolumeSource{\n  \
  \              Secret: &corev1.SecretVolumeSource{SecretName: vault.CertAuth.ClientKeySecretRef.Name},\n            },\n\
  \        })\n        *mounts = append(*mounts,\n            corev1.VolumeMount{Name: \"vault-client-cert\", MountPath: \"\
  /run/spire/vault/client-cert\", ReadOnly: true},\n            corev1.VolumeMount{Name: \"vault-client-key\", MountPath:\
  \ \"/run/spire/vault/client-key\", ReadOnly: true},\n        )\n    }\n\n    // caCertSecretRef: FILE injection (Secret\
  \ volume -- for TLS verification)\n    if vault.CACertSecretRef != nil {\n        *volumes = append(*volumes, corev1.Volume{\n\
  \            Name: \"vault-ca-cert\",\n            VolumeSource: corev1.VolumeSource{\n                Secret: &corev1.SecretVolumeSource{SecretName:\
  \ vault.CACertSecretRef.Name},\n            },\n        })\n        *mounts = append(*mounts, corev1.VolumeMount{\n    \
  \        Name: \"vault-ca-cert\", MountPath: \"/run/spire/vault/ca\", ReadOnly: true,\n        })\n    }\n\n    // v1.1:\
  \ Secret-hash annotation for automated rotation of env-var-based credentials\n    // if vault.TokenAuth != nil || vault.AppRoleAuth\
  \ != nil || vault.CertAuth != nil {\n    //     hash := computeSecretHash(referencedSecrets...)\n    //     podTemplate.Annotations[\"\
  vault-secret-hash\"] = hash\n    // }\n}\n\nWhy env vars for token_auth/approle_auth and not file mounts:\n\nPer the upstream\
  \ Vault plugin documentation and source code (spire/pkg/server/plugin/upstreamauthority/vault/vault.go):\n\nTokenAuthConfig\
  \ has only Token string (HCL: token). Default ${VAULT_TOKEN}. No token_path field.\n\nAppRoleAuthConfig has RoleID (HCL:\
  \ approle_id, default ${VAULT_APPROLE_ID}) and SecretID (HCL: approle_secret_id, default ${VAULT_APPROLE_SECRET_ID}). No\
  \ *_path fields.\n\nBoth resolve credentials via getEnvOrDefault() once at Configure() time.\n\nIn contrast, K8sAuthConfig\
  \ has TokenPath string (HCL: token_path, required). The plugin calls os.ReadFile(c.clientParams.K8sAuthTokenPath) on every\
  \ re-authentication attempt, which is why file-based auto-refresh works for k8s_auth but not for the other methods.\n\n\
  When upstreamAuthority is removed, all Vault-related env vars and volumes are absent from the desired StatefulSet. The needsUpdate()\
  \ function detects the diff and updates the StatefulSet.\n\nH6. Secret Strategy Per Auth Method\n\nSecurity analysis:\n\n\
  [Mermaid Diagram]\n\nH7. Testing Strategy\n\nUnit Tests (Go)\n\nIntegration Tests\n\nE2E Tests (OCP Cluster)\n\nH8. How\
  \ Will You Test and Verify?\n\nUnit tests: Run go test ./pkg/controller/spire-server/... -count=1 -- validates all ConfigMap/StatefulSet/Validation\
  \ logic\n\nIntegration tests: envtest-based tests that spin up a fake K8s API and reconcile SpireServer CRs\n\nE2E tests\
  \ on OCP: Deploy ZTWIM, create SpireServer CR with each UpstreamAuthority config, verify:\n\nspire-server bundle show shows\
  \ upstream CA\n\nspire-server healthcheck is healthy\n\nConfigMap contains no secrets\n\nAgents remain connected after CA\
  \ rotation\n\nNegative tests: Invalid CRs rejected at admission (Kubebuilder markers), missing Secrets reported via status\
  \ condition\n\nH9. Migration and Compatibility\n\nNo breaking changes. The upstreamAuthority field is optional. Existing\
  \ CRs without it continue to work with self-signed CA.\n\nNo downtime during enable. Adding upstreamAuthority triggers a\
  \ config change, rolling update, and CA rotation. Bundle accumulates both old and new CAs. Agents are not disrupted.\n\n\
  No downtime during disable. Removing upstreamAuthority triggers a config change, rolling update, and revert to self-signed\
  \ CA. Same bundle accumulation behavior.\n\nUpgrade path: Customers currently using CREATE_ONLY_MODE + manual ConfigMap\
  \ patching can migrate by:\n\nAdding upstreamAuthority to their SpireServer CR\n\nRemoving CREATE_ONLY_MODE=true from the\
  \ Subscription\n\nThe operator reconciles the ConfigMap/StatefulSet to match the CR\n\nH10. Who Will Run the Solution?\n\
  \nThe ZTWIM operator reconciliation loop manages the full lifecycle\n\nCustomers provide: cert-manager Issuer/ClusterIssuer\
  \ OR Vault server with PKI engine + auth backend\n\nCustomers create: K8s Secrets for Vault credentials (token, approle,\
  \ certs, CA cert)\n\nThe operator creates: ConfigMap, StatefulSet modifications, cert-manager RBAC\n\nH11. Open Questions\
  \ (Known Unknowns)\n\nH12. Secret Rotation Behavior and Recommendations (E2E Validated 2026-03-23)\n\nThis section documents\
  \ the observed behavior when Vault credentials referenced by K8s Secrets are rotated, validated via E2E testing on OCP 4.21\
  \ with ZTWIM v1.0.0.\n\nThe Core Problem\n\nKubernetes resolves secretKeyRef environment variables once at pod creation\
  \ time. If the underlying K8s Secret is updated, the running pod retains the old value in its process environment. This\
  \ affects token_auth and approle_auth which use env var injection.\n\nWhy Not Use File-Path (Volume Mount) Instead of Env\
  \ Vars?\n\nVolume-mounted Secrets are auto-updated by kubelet (~60s sync), which would eliminate the need for pod restarts.\
  \ However, the upstream SPIRE Vault plugin does not support file-path-based credentials for token_auth or approle_auth.\n\
  \nUpstream documentation reference: plugin_server_upstreamauthority_vault.md\n\nPer the upstream documentation, each auth\
  \ method accepts these fields:\n\nVerification from upstream SPIRE source code (spire/pkg/server/plugin/upstreamauthority/vault/vault.go):\n\
  \nThe TokenAuthConfig struct has only one field -- no token_path:\n\n[go]\n\n// TokenAuthConfig represents parameters for\
  \ token auth method\ntype TokenAuthConfig struct {\n    // Token string to set into \"X-Vault-Token\" header\n    Token\
  \ string `hcl:\"token\" json:\"token\"`\n}\n\nThe AppRoleAuthConfig struct similarly has no *_path fields:\n\n[go]\n\n//\
  \ AppRoleAuthConfig represents parameters for AppRole auth method.\ntype AppRoleAuthConfig struct {\n    AppRoleMountPoint\
  \ string `hcl:\"approle_auth_mount_point\" json:\"approle_auth_mount_point\"`\n    RoleID            string `hcl:\"approle_id\"\
  \ json:\"approle_id\"`\n    SecretID          string `hcl:\"approle_secret_id\" json:\"approle_secret_id\"`\n}\n\nIn contrast,\
  \ K8sAuthConfig has token_path which is read via os.ReadFile() on every auth attempt:\n\n[go]\n\ntype K8sAuthConfig struct\
  \ {\n    K8sAuthMountPoint string `hcl:\"k8s_auth_mount_point\" json:\"k8s_auth_mount_point\"`\n    K8sAuthRoleName   string\
  \ `hcl:\"k8s_auth_role_name\" json:\"k8s_auth_role_name\"`\n    TokenPath         string `hcl:\"token_path\" json:\"token_path\"\
  `\n}\n\nThe credential resolution in genClientParams() shows how each method gets its credentials:\n\n[go]\n\nswitch method\
  \ {\ncase TOKEN:\n    // Reads VAULT_TOKEN env var, falls back to config.TokenAuth.Token\n    cp.Token = p.getEnvOrDefault(envVaultToken,\
  \ config.TokenAuth.Token)\ncase APPROLE:\n    // Reads VAULT_APPROLE_ID / VAULT_APPROLE_SECRET_ID env vars, falls back to\
  \ inline config\n    cp.AppRoleID = p.getEnvOrDefault(envVaultAppRoleID, config.AppRoleAuth.RoleID)\n    cp.AppRoleSecretID\
  \ = p.getEnvOrDefault(envVaultAppRoleSecretID, config.AppRoleAuth.SecretID)\ncase K8S:\n    // Uses file path -- os.ReadFile(tokenPath)\
  \ on every re-auth attempt\n    cp.K8sAuthTokenPath = config.K8sAuth.TokenPath\ncase CERT:\n    // Uses file paths, but\
  \ TLS config is constructed once\n    cp.ClientCertPath = p.getEnvOrDefault(envVaultClientCert, config.CertAuth.ClientCertPath)\n\
  \    cp.ClientKeyPath = p.getEnvOrDefault(envVaultClientKey, config.CertAuth.ClientKeyPath)\n}\n\nKey observation: getEnvOrDefault()\
  \ resolves the env var once during Configure(), not on every request. For token_auth and approle_auth, this means the credential\
  \ value is captured at plugin startup and never re-read. For k8s_auth, os.ReadFile(tokenPath) is called on every authentication\
  \ attempt, so file updates are picked up automatically.\n\nImplication for the operator: Since the upstream plugin does\
  \ not support file-path credentials for token_auth and approle_auth, the operator has two options:\n\nSecret-hash annotation\
  \ (recommended, validated) -- operator watches Secrets, triggers rolling update on change\n\nUpstream contribution (future)\
  \ -- submit PR to upstream SPIRE to add token_path support in token_auth, then mount Secrets as volumes\n\nThis is a key\
  \ reason why k8s_auth is the recommended auth method for in-cluster Vault -- it is the only method that uses file-path credentials\
  \ (token_path) and benefits from kubelet's automatic volume refresh.\n\nTest Results Summary\n\nCritical Finding: Silent\
  \ Failure Window\n\nThe most dangerous scenario is A2 (Secret updated, old token revoked):\n\n[Mermaid Diagram]\n\nKey finding:\
  \ The failure window between token revocation and pod restart can be up to ca_validity / 2 (e.g., 12 hours with 24h CA validity).\
  \ During this window:\n\nSPIRE reports healthy (health check only validates current CA, not upstream connectivity)\n\nAgents\
  \ remain connected (they use the current CA, not the upstream)\n\nNo errors in logs until automatic rotation fires\n\nWhen\
  \ rotation finally fires, it fails 10 times over ~100s, then health check fails, kubelet restarts\n\napprole_auth Double-Caching\
  \ Behavior\n\nAppRole adds an additional caching layer:\n\nCredential Lifecycle:\n  1. Pod start: VAULT_APPROLE_ID + VAULT_APPROLE_SECRET_ID\
  \ from env vars\n  2. SPIRE authenticates to Vault → receives Vault client token (TTL=1h)\n  3. LifetimeWatcher renews client\
  \ token automatically\n  4. secret_id is NOT used again until re-authentication is needed\n  5. Re-auth only happens when\
  \ client token renewal fails\n\nImplication: Even if old secret_id is invalidated in Vault:\n  - SPIRE keeps working for\
  \ the client token's TTL (e.g., 1h)\n  - Failure surfaces only when client token expires AND re-auth with stale secret_id\
  \ fails\n  - Total silent failure window: client_token_TTL + ca_rotation_delay\n\nk8s_auth Auto-Refresh Behavior (CONFIRMED)\n\
  \nProjected SA Token Lifecycle (observed):\n  T+0:    Token issued (iat=09:54:15), expires at T+600s (10:04:15)\n  T+480s:\
  \ Kubelet refreshes token file (~80% lifetime)\n          New token written to /var/run/secrets/tokens/vault\n         \
  \ iat=10:02:15, new exp=10:12:15\n  T+???:  SPIRE Vault plugin's LifetimeWatcher detects client token near expiry\n    \
  \      Sets vaultClient=nil\n          Next MintX509CA → re-reads token_path → gets FRESH projected token\n          Authenticates\
  \ to Vault with new JWT → new client token → signs CA\n          \n  Result: Zero downtime. Zero restarts. Fully automatic.\n\
  \nSecret-Hash Annotation Pattern (VALIDATED)\n\nThe operator can automate pod restarts on Secret changes using a hash annotation:\n\
  \n[go]\n\n// Pseudocode for operator enhancement\nfunc (r *Reconciler) reconcileStatefulSet(ctx context.Context, config\
  \ *SpireServerConfig) error {\n    // ... existing StatefulSet generation ...\n\n    // Compute hash of all referenced Vault\
  \ Secrets\n    if config.UpstreamAuthority != nil && config.UpstreamAuthority.Vault != nil {\n        secretHash, err :=\
  \ computeVaultSecretHash(ctx, r.Client, config)\n        if err != nil {\n            return err\n        }\n        //\
  \ Add annotation to PodTemplate (triggers rolling update on change)\n        statefulSet.Spec.Template.Annotations[\"vault-secret-hash\"\
  ] = secretHash\n    }\n    // ... existing needsUpdate() + apply logic ...\n}\n\nE2E validated behavior:\n\nK8s Secret updated\
  \ with new token\n\nOperator computes new hash, patches StatefulSet PodTemplate annotation\n\nStatefulSet controller triggers\
  \ automatic rolling update (~16s observed)\n\nNew pod resolves secretKeyRef → picks up new token from Secret\n\nSPIRE authenticates\
  \ with new token, CA rotation succeeds\n\nRecommendation Matrix\n\nOperator Enhancement Roadmap\n\nAlternatives\n\nAlternative\
  \ 1: Manual ConfigMap + CREATE_ONLY_MODE (Current Workaround)\n\nPros: Works today, no operator code changes needed\n\n\
  Cons: Not production-viable. Operator cannot reconcile. Manual patching is error-prone. No validation, no RBAC automation.\
  \ Any operator restart or upgrade wipes the manual changes (unless CREATE_ONLY_MODE remains enabled, which prevents all\
  \ reconciliation).\n\nVerdict: Unacceptable for a shipped product.\n\nAlternative 2: Mutating Admission Webhook\n\nPros:\
  \ Decouples UpstreamAuthority injection from reconciliation loop\n\nCons: Adds architectural complexity (webhook deployment,\
  \ HA, failure mode). Does not solve RBAC automation. Does not handle StatefulSet env/volume injection cleanly. Requires\
  \ webhook availability for any ConfigMap update.\n\nVerdict: Over-engineered for this use case. The reconciliation loop\
  \ is the natural place for this logic.\n\nAlternative 3: External Secrets Operator (ESO) for Vault Credentials\n\nPros:\
  \ Handles secret rotation automatically (syncs from Vault to K8s Secret)\n\nCons: Adds ESO as a hard dependency. Not all\
  \ customers use ESO. Operator should be self-contained.\n\nVerdict: Document as an optional complement (customers can use\
  \ ESO to manage the K8s Secrets that the operator references), but do not require it.\n\nAlternative 4: Inline Secrets in\
  \ ConfigMap\n\nPros: Simpler operator code -- just put the token value in the ConfigMap\n\nCons: Secrets visible in ConfigMap\
  \ (etcd, oc get cm -o yaml, GitOps). Violates zero-secret-in-ConfigMap principle. Upstream SPIRE documents env var fallback\
  \ specifically to avoid this.\n\nVerdict: Rejected. Empty struct + env var is the only acceptable pattern for token_auth\
  \ and approle_auth.\n\nAlternative 5: External Kubeconfig for cert-manager from Day 1\n\nPros: Covers cross-cluster cert-manager\
  \ scenario. Validated via E2E Test 10 (Cluster 1 AWS -> Cluster 2 GCP, SA token kubeconfig).\n\nCons: Adds 1 optional field,\
  \ 1 Secret volume, 1 mount path. Cross-cluster network dependency (SPIRE pod must reach remote K8s API). Identity/approval-flow\
  \ may need documentation for custom cert-manager approvers.\n\nUpdated verdict (2026-03-20): Recommended for v1 as optional\
  \ field. Testing proved cross-cluster cert-manager works reliably with minimal operator complexity. The implementation is\
  \ a straightforward extension of the in-cluster path (add volume mount when kubeConfigSecretRef is set).\n\nImpact of Not\
  \ Doing This\n\nSPIRE CA cannot chain to enterprise PKI\n\nCustomers must use CREATE_ONLY_MODE (breaks operator reconciliation)\n\
  \nBlocks production adoption in enterprises with existing PKI infrastructure\n\nManual patching approach has no upgrade\
  \ path and no validation\n\nRisks\n\nExecution Risks\n\nOperational Risks\n\nCustomer Risks\n\nExternal Dependency Risks\n\
  \nRisk Summary\n\nBusiness Impacts\n\nMitigations\n\nAppendix A: E2E Test Results Summary\n\nPhase 1: In-Cluster Tests (OCP\
  \ 4.21, ZTWIM v1.0.0, CREATE_ONLY_MODE=true)\n\nPhase 2: Cross-Cluster Tests (2026-03-20, Cluster 1: AWS OCP 4.21, Cluster\
  \ 2: GCP OCP 4.21)\n\nCross-cluster test topology:\n\nCluster 1 (AWS): ZTWIM v1.0.0 + operands, CREATE_ONLY_MODE enabled,\
  \ SPIRE server consumes external services\n\nCluster 2 (GCP): Vault v1.15 (dev mode) exposed via edge-terminated OpenShift\
  \ Route; cert-manager operator with CA Issuer\n\nVault Route: vault-vault.apps.ci-ln-08sv8bk-72292.gcp-2.ci.openshift.org\
  \ (edge TLS, router CA)\n\nCross-cluster cert-manager: ServiceAccount token kubeconfig from Cluster 2 mounted on Cluster\
  \ 1 SPIRE server\n\nFull details: UPSTREAM-AUTHORITY-SECRET-INJECTION-TEST-REPORT.md\n\nPhase 3: Secret Rotation Tests (2026-03-23,\
  \ GCP OCP 4.21)\n\nAppendix B: Issues Encountered During Testing\n\nPhase 1 Issues\n\nPhase 2 Issues (Cross-Cluster)\n\n\
  Phase 3 Issues (Secret Rotation)\n\nAppendix C: Upstream Plugin Environment Variable Reference\n\nVault Plugin\n\ncert-manager\
  \ Plugin\n\nAppendix D: External Vault Deployment Topology (Validated)\n\nThis appendix documents the cross-cluster Vault\
  \ topology validated during Phase 2 testing (2026-03-20).\n\nTopology Diagram\n\n[Mermaid Diagram]\n\nTLS Trust Chain: Edge-Terminated\
  \ Route\n\nWhen Vault runs HTTP (dev mode or non-TLS) behind an OpenShift edge-terminated Route:\n\nSPIRE Server Pod\n \
