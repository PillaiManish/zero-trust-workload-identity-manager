  \ (self-signed CA)\n  │\n  ├─ ca_cert_path = /run/spire/vault/ca.crt\n  │   └─ Contains: ingress-operator CA certificate\n\
  \  │       └─ Extracted from: oc get secret router-ca -n openshift-ingress-operator\n  │\n  └─ TLS verification: router\
  \ cert chain validates against router CA ✓\n\nHow to extract the router CA:\n\n[bash]\n\noc --kubeconfig=<cluster2-kubeconfig>\
  \ get secret router-ca \\\n  -n openshift-ingress-operator \\\n  -o jsonpath='{.data.tls\\.crt}' | base64 -d > /tmp/cluster2-router-ca.crt\n\
  \nCross-Cluster cert-manager: Kubeconfig Setup\n\nCluster 2 (Remote):\n  1. Create ServiceAccount: spire-server-remote\n\
  \  2. Create Role: certificaterequests CRUD in target namespace\n  3. Create RoleBinding: SA -> Role\n  4. Create long-lived\
  \ SA token Secret (kubernetes.io/service-account-token)\n  5. Build kubeconfig YAML with:\n     - server: Cluster 2 K8s\
  \ API URL\n     - certificate-authority-data: Cluster 2 CA\n     - user token: SA token from step 4\n\nCluster 1 (SPIRE):\n\
  \  1. Create Secret from kubeconfig YAML\n  2. Mount as volume on spire-server StatefulSet\n  3. Set kube_config_file in\
  \ ConfigMap plugin_data\n\n---\n\n# ADR_ Fixing the Stale ResourceVersion Race Condition in StatusUpdateWithRetry\n\nProposal\n\
  \nADR: Fixing the Stale ResourceVersion Race Condition in StatusUpdateWithRetry\n\nA race condition in the operator's status\
  \ update path causes intermittent 409 Conflict errors and flaky e2e tests.\n\nWhat\n\nEvery reconciler in the ZTWIM operator\
  \ performs two rapid status writes to the same CR within a single reconcile cycle. The second write reads the Kubernetes\
  \ ResourceVersion (RV) from the informer cache, which can be stale after the first write. This causes the API server to\
  \ reject the update with a 409 Conflict. The issue was reproduced at a 10% rate on a live GCP cluster. This ADR evaluates\
  \ five fix options and recommends removing the first status write (SetInitialReconciliationStatus) as the chosen approach.\n\
  \nWhy\n\nBackground: How Kubernetes Tracks Object Versions\n\nEvery Kubernetes object has a metadata.resourceVersion (RV).\
  \ When you send an update, you must include the RV you read. If someone else modified the object since then (RV mismatch),\
  \ the API server rejects the update with a 409 Conflict. This is optimistic concurrency control.\n\nThe operator uses a\
  \ controller-runtime manager with an informer cache - a local in-memory copy of watched objects, kept in sync via a watch\
  \ connection. When the controller calls client.Get(), it reads from this cache (fast, no network round-trip). However, after\
  \ a write to the API server, the cache syncs only after the watch event propagates back. This creates a small window where\
  \ the cache holds a stale RV.\n\nThe Bug\n\nSetInitialReconciliationStatus was introduced in PR #59 (merged Nov 17, 2025).\
  \ Before that PR, each reconciler performed only one status write per cycle and the race did not exist. PR #59 added a second\
  \ status write at the start of each reconcile, creating a double-write pattern:\n\nReconcile() {\n\n Get(obj)         \
  \                   // cache read, RV=N\n\n SetInitialReconciliationStatus(obj) // write #1: Status().Update -> RV=N+1\n\
  \n defer ApplyStatus(obj)              // write #2: StatusUpdateWithRetry\n\n                                     //  ->\
  \ Get from cache: RV=N (STALE!)\n\n                                     //  -> Status().Update with RV=N -> 409 CONFLICT\n\
  \n}\n\n\n\nThe retry loop in StatusUpdateWithRetry re-reads from the same stale cache on each retry, so the conflict persists\
  \ until the cache syncs (if it does within the ~40ms retry window).\n\nCurrent retry configuration (passed in retryOnConflict\
  \ function):\n\nvar DefaultRetry = wait.Backoff{\n\n\tSteps:    5,\n\n\tDuration: 10 * time.Millisecond,\n\n\tFactor: \
  \  1.0,\n\n\tJitter:   0.1,\n\n}\n\n\n\nExperimental Proof\n\nA reproducer program (main.go) was run against a live GCP\
  \ cluster:\n\n=== PHASE E: Double-write pattern (the bug) ===\n\n    Stale reads:  2 / 20  (10%)\n\n    409 Conflicts:\
  \ 2 / 20  (10%)\n\n=== PHASE F: Single-write pattern (the fix) ===\n\n    409 Conflicts: 0 / 20   (0%)\n\n\n\nGoals\n\n\
  Eliminate the 409 Conflict race condition that causes flaky e2e test failures (especially CreateOnlyMode tests).\n\nNon-Goals\n\
  \nModifying e2e tests (the fix should make them stable without test changes).\n\nAdding new status conditions or changing\
  \ the operator's final status output.\n\nHow\n\nChosen Approach: Remove SetInitialReconciliationStatus (Option B)\n\nRemove\
  \ the SetInitialReconciliationStatus call from the top of each reconciler. The deferred ApplyStatus already writes the correct\
  \ final status at the end of every reconcile. By eliminating the first write, only one Status().Update() occurs per reconcile,\
  \ so the stale-RV race window never opens.\n\nBefore (each reconciler):\n\nfunc Reconcile(ctx, req) {\n\n    ctrlClient.Get(ctx,\
  \ req.NamespacedName, &obj)\n\n    // Write #1: immediately writes Ready=False/InProgress -> bumps RV\n\n    status.SetInitialReconciliationStatus(ctx,\
  \ ctrlClient, &obj, ...)\n\n    statusMgr := status.NewManager(ctrlClient)\n\n    defer func() {\n\n        // Write #2:\
  \ writes final conditions -> reads STALE RV from cache -> 409!\n\n        statusMgr.ApplyStatus(ctx, &obj, ...)\n\n    }()\n\
  \n    // ... reconciliation logic ...\n\n}\n\n\n\nAfter (each reconciler):\n\nfunc Reconcile(ctx, req) {\n\n    ctrlClient.Get(ctx,\
  \ req.NamespacedName, &obj)\n\n    statusMgr := status.NewManager(ctrlClient)\n\n    defer func() {\n\n        // Only write:\
  \ final conditions -> cache RV is fresh, no race\n\n        statusMgr.ApplyStatus(ctx, &obj, ...)\n\n    }()\n\n    // ...\
  \ reconciliation logic ...\n\n}\n\nBehavior Change\n\nNo e2e test, monitoring alert, or user workflow depends on the transient\
  \ mid-reconcile \"InProgress\" state.\n\nTesting and Verification\n\nUnit tests: All existing tests should pass.\n\nE2E\
  \ tests: All E2E tests should pass across multiple runs.\n\nBuild: go build should pass cleanly.\n\nOperator logs: Deploy\
  \ the fixed operator on a fresh cluster. Zero 409 conflicts should be observed during CR creation and full reconciliation\
  \ of all 5 controllers.\n\nAlternatives\n\nOption A: Use apiReader for Retry-Loop Gets (Direct API Read)\n\nReplace c.Client.Get\
  \ (cache read) with c.apiReader.Get (direct API read) inside StatusUpdateWithRetry.\n\n// Change cache read to direct API\
  \ read:\n\nif err := c.apiReader.Get(ctx, key, current); err != nil {\n\n\n\nWhy not chosen: While this is the simplest\
  \ 1-line fix and completely eliminates the race, it adds ~10 direct GET requests per reconcile burst to the API server.\n\
  \nOption B: Remove SetInitialReconciliationStatus (Chosen)\n\nDescribed above in the \"How\" section.\n\nOption C: Skip\
  \ Re-Read, Fall Back to apiReader on Conflict\n\nAttempt Status().Update() with the RV already on the object (no Get). On\
  \ 409, fall back to apiReader.Get to fetch the real latest RV and retry.\n\nWhy not chosen: Good performance profile (zero\
  \ reads on happy path), but still can make requests to API server if cache is stale.\n\nOption D: Increase the Retry Window\n\
  \nReplace retry.DefaultRetry (5 steps x 10ms flat = ~40ms) with exponential backoff (e.g., Factor=2.0 for ~620ms total window).\n\
  \nWhy not chosen: This is a probabilistic mitigation, not a fix. It may reduce the failure rate, but cannot guarantee the\
  \ cache syncs before any given retry. Under extreme API server load, the race may persist. It also adds latency to every\
  \ conflict resolution.\n\nOption E: Retry/Requeue from the Deferred ApplyStatus on 409 (Not Possible)\n\nA natural thought\
  \ is: if the deferred ApplyStatus gets a 409, catch it and requeue the reconciliation so the next attempt starts with a\
  \ fresh cache. This would look like:\n\ndefer func() {\n\n    if err := statusMgr.ApplyStatus(ctx, &server, ...); err !=\
  \ nil {\n\n        // Requeue to retry with fresh cache?\n\n        return ctrl.Result{Requeue: true}, err  // <- NOT POSSIBLE\n\
  \n    }\n\n}()\n\n\n\nWhy this is not possible: The Reconcile method signature is Reconcile(ctx, req) (Result, error).\
  \ In Go, a defer function cannot modify the return values of the enclosing function.\n\nImpact of Inaction\n\nWithout a\
  \ fix, the CreateOnlyMode e2e tests (and potentially other tests involving rapid reconciliation) will continue to flake\
  \ in CI. The 409 failure rate might increase under load.\n\nRisks\n\nThe primary risk is the loss of a transient mid-reconcile\
  \ status. This is significantly lower than the current risk of 409 Conflict failures in CI under load.\n\nMitigations\n\n\
