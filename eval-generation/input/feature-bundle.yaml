  \ peers)\n\nNet advisory statement\n\n---\n\n# docs/acm-integration-planning-analysis.md\n\n# OCPSTRAT-1766 [ACM Integration\
  \ Planning Analysis]\n\n**Scope:** [Exploration / Pre-ADR]\n\nThis analysis covers the ACM (Advanced Cluster Management)\
  \ integration portion of OCPSTRAT-1766 -- centralized multi-cluster management of the Zero Trust Workload Identity Manager\
  \ (ZTWIM) operator.\n\n---\n\n## Why is this needed?\n\nZTWIM is a single-cluster operator today. Each OpenShift cluster\
  \ runs its own independent SPIRE stack (server, agent, CSI driver, OIDC discovery provider), configured via cluster-scoped\
  \ singleton CRs. At scale -- tens to hundreds of clusters -- this creates several problems:\n\n- **Manual per-cluster configuration**\
  \ is error-prone and does not scale. Every cluster needs its own `ZeroTrustWorkloadIdentityManager`, `SpireServer`, `SpireAgent`,\
  \ etc. CRs created and maintained independently.\n- **No centralized lifecycle management.** Installing, upgrading, or removing\
  \ ZTWIM across a fleet requires per-cluster operations with no single control point.\n- **Cross-cluster trust requires coordination.**\
  \ Nested SPIRE (upstream/downstream CA hierarchy) requires the downstream cluster's `SpireServer` to reference the upstream's\
  \ Route, trust bundle, and cluster name -- all manually configured today.\n- **No fleet-wide visibility.** There is no way\
  \ to see SPIRE health, trust bundle consistency, or configuration drift across clusters from a single pane.\n\nACM is the\
  \ standard OpenShift mechanism for multi-cluster lifecycle management. Integrating ZTWIM with ACM solves all of the above\
  \ by providing a hub-based control plane for SPIRE infrastructure across managed clusters.\n\n---\n\n## Expected outcome\n\
  \n- Centralized deployment and lifecycle management of ZTWIM across managed clusters from the ACM hub\n- Centralized configuration\
  \ distribution (SpireServer, SpireAgent, etc. specs) from hub to managed clusters\n- Automated nested SPIRE topology orchestration\
  \ (hub as upstream, managed clusters as downstream)\n- Aggregated SPIRE health and status visibility on the hub\n- Same\
  \ trust domain enforced across all clusters in a topology\n\n---\n\n## Current state\n\n| Aspect | Status |\n|--------|--------|\n\
  | Operator scope | Single-cluster only |\n| CRDs | 5 custom CRDs (`ZeroTrustWorkloadIdentityManager`, `SpireServer`, `SpireAgent`,\
  \ `SpiffeCSIDriver`, `SpireOIDCDiscoveryProvider`), all cluster-scoped singletons (name must be `\"cluster\"`) |\n| UpstreamAuthority\
  \ | cert-manager and vault plugins supported; nested SPIRE (`spire` plugin) planned separately |\n| Federation | SPIRE-native\
  \ federation via bundle endpoints and Routes (cross-trust-domain, not same-trust-domain) |\n| ACM awareness | None -- no\
  \ `open-cluster-management` dependencies, no addon framework, no hub/spoke patterns |\n| Multi-cluster testing | E2E framework\
  \ supports single kubeconfig only |\n\n---\n\n## Proposed high-level implementation\n\nThe implementation is organized into\
  \ four layers, each independently shippable:\n\n```mermaid\ngraph TD\n    subgraph hub [\"ACM Hub Cluster\"]\n        CMA[\"\
  ClusterManagementAddon<br/>(ztwim)\"]\n        HubCtrl[\"ZTWIM Addon Manager<br/>(controller)\"]\n        HubCRDs[\"Hub-side\
  \ Config CRDs<br/>(ZTWIMConfig per cluster)\"]\n        HubSPIRE[\"SPIRE Server<br/>(upstream, optional -<br/>can also run\
  \ on a<br/>designated managed cluster)\"]\n    end\n\n    subgraph mc1 [\"Managed Cluster 1\"]\n        MCA1[\"ManagedClusterAddon\"\
  ]\n        ZTWIM1[\"ZTWIM Operator\"]\n        SS1[\"SpireServer<br/>(downstream)\"]\n        SA1[\"SpireAgent\"]\n    end\n\
  \n    subgraph mc2 [\"Managed Cluster 2\"]\n        MCA2[\"ManagedClusterAddon\"]\n        ZTWIM2[\"ZTWIM Operator\"]\n\
  \        SS2[\"SpireServer<br/>(downstream)\"]\n        SA2[\"SpireAgent\"]\n    end\n\n    HubCtrl -->|ManifestWork| MCA1\n\
  \    HubCtrl -->|ManifestWork| MCA2\n    HubCRDs --> HubCtrl\n    MCA1 --> ZTWIM1\n    MCA2 --> ZTWIM2\n    ZTWIM1 --> SS1\n\
  \    ZTWIM1 --> SA1\n    ZTWIM2 --> SS2\n    ZTWIM2 --> SA2\n    SS1 -->|\"UpstreamAuthority (spire)\"| HubSPIRE\n    SS2\
  \ -->|\"UpstreamAuthority (spire)\"| HubSPIRE\n```\n\n### Layer 1: Operator Lifecycle (deploy/upgrade/remove ZTWIM on managed\
  \ clusters)\n\nMultiple ACM mechanisms can deploy the ZTWIM operator to managed clusters. The right approach is still to\
  \ be determined.\n\n| Approach | How it works | Pros | Cons |\n|----------|-------------|------|------|\n| **Addon Framework**\
  \ | Custom addon manager on hub watches `ManagedClusterAddon` CRs, pushes operator manifests via `ManifestWork`. Reference:\
  \ Submariner addon (`stolostron/submariner-addon`). | Full lifecycle, rich status, health checks | Requires building/maintaining\
  \ a custom addon manager binary |\n| **ACM Policy (ConfigurationPolicy)** | Policy enforces OLM `Subscription` + `Namespace`\
  \ exist on managed clusters. Bound to clusters via `Placement` + `PlacementBinding`. | No custom code (YAML only), declarative\
  \ | Compliant/non-compliant status only, limited lifecycle control |\n| **ManifestWorkReplicaSet + Placement** | Hub admin\
  \ defines manifests once, MWRS replicates them to placement-selected clusters. | Simple, supports progressive rollout |\
  \ No lifecycle hooks, no health aggregation |\n| **Hybrid (Addon + Policy)** | Addon for operator lifecycle, Policy for\
  \ configuration compliance/drift detection. | Best of both | Higher overall complexity |\n\n### Layer 2: Configuration Distribution\
  \ (push SpireServer/SpireAgent specs from hub)\n\nPush ZTWIM operand configurations (SpireServer, SpireAgent, etc.) from\
  \ the hub to managed clusters.\n\n**Key constraint:** ZTWIM CRDs are cluster-scoped singletons -- the hub cannot host per-managed-cluster\
  \ CRs locally. Configuration must be expressed on the hub and pushed/enforced on each managed cluster.\n\n| Approach | How\
  \ it works | Pros | Cons |\n|----------|-------------|------|------|\n| **Hub-side Config CRD + ManifestWork** | Define\
  \ a `ZTWIMConfig` CRD (namespace-scoped, one per managed cluster namespace on hub). A hub controller renders it into ZTWIM\
  \ operand CRs and pushes via ManifestWork. | Full per-cluster customization, two-way status feedback | Requires custom CRD\
  \ + controller |\n| **ACM ConfigurationPolicy** | Policy templates enforce ZTWIM CRs exist with desired specs on managed\
  \ clusters. Hub template functions can inject per-cluster values. | No custom code, declarative | Limited per-cluster templating,\
  \ compliant/non-compliant status only |\n| **ManifestWorkReplicaSet** | Define ZTWIM CRs as manifests in MWRS, replicated\
  \ to selected clusters. | Simple | No per-cluster customization (same spec pushed everywhere) |\n\nExample hub-side config\
  \ (applicable to CRD or Policy approach):\n\n```\n# Per-cluster configuration on the hub\ntrustDomain: example.com     \
  \   # shared across topology\nclusterName: managed-cluster-1  # unique per cluster\nspireServer:\n  caKeyType: rsa-4096\n\
  \  persistence:\n    size: 1Gi\n  upstreamAuthority:             # optional, for nested SPIRE\n    spire:\n      serverAddress:\
  \ federation.example.com\n      serverPort: 8081\n```\n\n### Layer 3: Nested SPIRE Orchestration (cross-cluster trust hierarchy)\n\
  \n**Prerequisite:** Nested SPIRE UpstreamAuthority feature (separate planning under OCPSTRAT-1766).\n\nAutomate cross-cluster\
  \ nested SPIRE setup: one cluster (the hub itself or a designated managed cluster) acts as the upstream SPIRE server, and\
  \ remaining managed clusters are configured as downstream. Regardless of which Layer 1/2 approach is chosen, the orchestration\
  \ must:\n1. Read the upstream cluster's trust bundle from the bundle ConfigMap\n2. Create ClusterStaticEntry on the upstream\
  \ cluster for each downstream cluster\n3. Push SpireServer CR (with `upstreamAuthority.spire` pointing to the upstream cluster's\
  \ Route) + trust bundle ConfigMap to each downstream managed cluster\n\nWithout ACM, these steps are manual per cluster.\n\
  \n### Layer 4: Observability and Status\n\nFleet-wide SPIRE health visibility from the hub. The depth of observability depends\
  \ on the Layer 1 approach chosen:\n- **Addon Framework:** Rich status via addon conditions (e.g., `SpireServerReady`, `TrustBundleConsistent`)\
  \ + lease-based health\n- **Policy:** Compliant/non-compliant per policy per cluster\n- **Common:** ACM Observability (Thanos\
  \ federation of SPIRE Prometheus metrics on port 9402) for centralized dashboards, trust bundle consistency monitoring across\
  \ clusters\n\n---\n\n## Key architectural decisions the ADR should answer\n\n- **Which ACM integration pattern to use?**\
  \ Addon Framework, ACM Policy, ManifestWorkReplicaSet, or a hybrid? Each has different trade-offs in complexity, status\
  \ feedback, and per-cluster flexibility (see Layer 1 and Layer 2 tables above). Needs PoC and team discussion.\n- **Where\
  \ does the upstream SPIRE server run?** Three options: (a) on the hub cluster itself, (b) on a designated managed cluster,\
  \ or (c) no nested SPIRE (each cluster independent). In options (a) and (b) the hub orchestrates the nested topology; in\
  \ (b) the hub is purely control-plane and designates one managed cluster as upstream for the others.\n- **Hub-side CRD vs\
  \ Policy for configuration?** Custom `ZTWIMConfig` CRD per managed cluster (like Submariner's `SubmarinerConfig`) vs ACM\
  \ ConfigurationPolicy templates. Affects per-cluster customization flexibility and development effort.\n- **OLM interaction:**\
  \ Should the ACM mechanism install ZTWIM via OLM Subscription (depends on CatalogSource availability on managed clusters)\
  \ or deploy the operator directly (more control, but loses OLM lifecycle)?\n- **ManagedClusterSet boundaries:** Should clusters\
  \ sharing a trust domain be grouped into a `ManagedClusterSet`? One trust domain = one ManagedClusterSet?\n\n---\n\n## Known\
  \ pitfalls\n\n**Singleton CRDs on the hub.** All ZTWIM CRDs are cluster-scoped singletons named `\"cluster\"`. The hub cannot\
  \ create per-managed-cluster ZTWIM operand CRs locally. Configuration must be expressed via hub-side mechanisms (CRDs, Policies,\
  \ or ManifestWork) and applied on each managed cluster.\n\n**Trust domain immutability.** Trust domain is immutable once\
  \ set on the `ZeroTrustWorkloadIdentityManager` CR. If a managed cluster already has a different trust domain, it cannot\
  \ be changed. The ACM integration must enforce trust domain consistency at install time.\n\n**SCC requirements.** SPIRE\
  \ agent requires a custom SCC with `AllowHostPID: true` and `AllowHostDirVolumePlugin: true`. Whichever ACM mechanism is\
  \ used must ensure the SCC is created on managed clusters.\n\n**Cross-cluster networking.** Nested SPIRE requires the hub's\
  \ SPIRE server Route to be reachable from managed clusters. DNS resolution and network policies must allow gRPC traffic.\n\
  \n**E2E testing infrastructure.** The current E2E framework supports a single kubeconfig. Multi-cluster ACM testing requires\
  \ at least 3 clusters (1 hub + 2 managed). Multi-kubeconfig support or a dedicated test harness needs to be built.\n\n**OLM\
  \ version skew.** If the operator is installed via OLM Subscription, the version on managed clusters depends on the CatalogSource\
  \ available there. Different clusters may have different versions.\n\n**Status feedback lag.** ManifestWork and Policy status\
  \ from managed clusters has eventual consistency lag. Hub-side status may not reflect real-time managed cluster state.\n\
  \n---\n\n## Epics\n\n### Epic 1: Multi-cluster ZTWIM Deployment\nAs a hub cluster admin, I can install, upgrade, and remove\
  \ ZTWIM on selected managed clusters from the ACM hub, so that I don't need to manage each cluster's operator lifecycle\
  \ independently.\n\n### Epic 2: Centralized ZTWIM Configuration\nAs a hub cluster admin, I can define ZTWIM configuration\
  \ (SpireServer, SpireAgent specs) on the hub and have it applied to managed clusters, so that all clusters are consistently\
  \ configured from a single place.\n\n### Epic 3: Cross-cluster Nested SPIRE Orchestration\nAs a hub cluster admin, I can\
  \ enable nested SPIRE topology where the hub acts as the upstream SPIRE server and managed clusters are automatically configured\
  \ as downstream, sharing a single trust domain and root CA.\n\n### Epic 4: Multi-cluster SPIRE Observability\nAs a hub cluster\
  \ admin, I can see the SPIRE health status and trust bundle consistency of all managed clusters from the hub.\n\n### Epic\
  \ 5: Multi-cluster E2E Testing (QE)\nAs a QE engineer, I can run automated E2E tests that validate ACM-based ZTWIM deployment\
  \ and nested SPIRE topology across a hub + managed cluster setup.\n\n---\n\n## Story point estimation of high-level steps\n\
  \n| Step | Estimate |\n|------|----------|\n| ADR + reference architecture doc + PoC on live cluster + design discussions\
  \ | __ SP |\n| Epic 1: Multi-cluster deployment implementation + unit tests + validation | __ SP |\n| Epic 2: Centralized\
  \ configuration + unit tests + validation | __ SP |\n| Epic 3: Nested SPIRE orchestration + integration with nested SPIRE\
  \ feature + validation | __ SP |\n| Epic 4: Observability + status aggregation | __ SP |\n| Epic 5: Multi-cluster E2E test\
  \ infrastructure + test suite | __ SP (QE to estimate) |\n\n---\n\n## Phasing and dependencies\n\n```mermaid\ngraph TD\n\
  \    NestedSPIRE[\"Nested SPIRE Feature<br/>(separate planning under OCPSTRAT-1766)\"]\n    E1[\"Phase 1: Epic 1<br/>Addon\
  \ Framework<br/>(operator lifecycle)\"]\n    E2[\"Phase 2: Epic 2<br/>Config Distribution<br/>(hub-side CRDs)\"]\n    E3[\"\
  Phase 3: Epic 3<br/>Nested SPIRE Orchestration<br/>(cross-cluster trust)\"]\n    E4[\"Epic 4<br/>Observability\"]\n    E5[\"\
  Epic 5<br/>Multi-cluster E2E\"]\n\n    E1 --> E2\n    E2 --> E3\n    NestedSPIRE --> E3\n    E1 --> E4\n    E1 --> E5\n\
  ```\n\n- **Phase 1:** Epic 1 (Addon Framework) -- can ship independently, no dependency on nested SPIRE\n- **Phase 2:**\
  \ Epic 2 (Config Distribution) -- depends on Phase 1\n- **Phase 3:** Epic 3 (Nested SPIRE Orchestration) -- depends on Phase\
  \ 2 AND the nested SPIRE feature landing\n- **Parallel:** Epics 4 and 5 can start after Phase 1 completes\n\n---\n\n## Open\
  \ questions\n\n1. **Which ACM integration pattern to use (Addon Framework vs ManifestWorkReplicaSet vs hybrid)?** Addon\
  \ Framework is the standard for operators, but ManifestWorkReplicaSet is simpler if full lifecycle management is not needed\
  \ in the first iteration.\n2. **Should the hub cluster run its own SPIRE server (upstream for nested topology), or should\
  \ the hub be a control-plane-only orchestrator?** This determines whether Layer 3 is possible and affects the hub's resource\
  \ requirements.\n3. **How to handle managed clusters already running ZTWIM independently before ACM onboarding?** Should\
  \ the addon adopt existing resources, overwrite them, or refuse to install?\n\n\n---\n\n# docs/agentic-sdlc-review-spire-462.md\n\
