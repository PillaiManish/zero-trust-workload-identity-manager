  \nDefines the lowest TLS protocol version that a client/server is willing to negotiate. It establishes the security baseline\
  \ for all connections. TLS 1.3 is recommended for modern deployments and is a prerequisite for Hybrid ML-KEM key exchange.\n\
  \nCipher Suites\n\nA cipher suite defines the symmetric encryption and integrity algorithms used to protect application\
  \ data after the TLS handshake. In TLS 1.2, cipher suites also determine the key exchange and authentication algorithms.\
  \ In TLS 1.3, they no longer control key exchange and therefore have no impact on PQC adoption.\n\nCurves / Supported Groups\n\
  \nCurves (or supported groups) define the key exchange algorithms used during the TLS handshake. Classical groups use Elliptic\
  \ Curve Cryptography (ECC), while Hybrid ML-KEM groups combine classical ECC with post-quantum ML-KEM. The configured group\
  \ priority determines the preferred key exchange mechanism.\n\nClassical Curves\n\nClassical curves such as P-256, P-384,\
  \ and X25519 provide secure key exchange for today's computing landscape. However, they are expected to become vulnerable\
  \ to sufficiently capable quantum computers.\n\nHybrid ML-KEM Curves\n\nHybrid groups combine a classical elliptic curve\
  \ with an ML-KEM post-quantum algorithm. This provides protection against both classical and future quantum attacks while\
  \ maintaining interoperability during the industry's migration to PQC.\n\nPure ML-KEM\n\nPure ML-KEM performs key exchange\
  \ using only post-quantum cryptography. Although technically feasible, it is not yet widely deployed because current standards\
  \ and implementations recommend hybrid mode to provide a safety net while PQC algorithms gain long-term operational confidence.\n\
  \n2. TLS Configuration Parameters\n\nNotes\n\nCipher Suites\n\nConfigurable only for TLS 1.1 and TLS 1.2.\n\nOnce TLS 1.3\
  \ is negotiated, the configured TLS 1.1/1.2 cipher suites are ignored.\n\nCurves / Supported Groups\n\nAlways configurable.\n\
  \nFor TLS 1.1 and TLS 1.2, only classical curves (for example, P-256, P-384, X25519) are used.\n\nFor TLS 1.3, the same\
  \ configuration may additionally include Hybrid ML-KEM groups, enabling post-quantum key exchange.\n\n3. ApiServer CR related\
