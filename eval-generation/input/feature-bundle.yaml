  \ Trust Workload Identity Manager\n\nImplement default-deny and fine-grained NetworkPolicy resources for the ZTWIM operator\
  \ and all its operands to enforce least-privilege network access.\n\nWhat\n\nThis ADR covers the introduction of Kubernetes\
  \ NetworkPolicy resources for every ZTWIM component within the zero-trust-workload-identity-manager namespace, targeting\
  \ OCP 5.0:\n\nOperator controller -- static NetworkPolicy shipped via OLM bundle\n\nSPIRE Server (including controller manager)\
  \ -- operator-managed policies\n\nSPIRE Agent -- operator-managed policies\n\nOIDC Discovery Provider -- operator-managed\
  \ policies\n\nSPIFFE CSI Driver -- no NetworkPolicy needed (Unix socket communication only)\n\nWhy\n\nThe ZTWIM operator\
  \ manages SPIFFE/SPIRE infrastructure. Today, none of the pods have network restrictions:\n\nA compromised pod can reach\
  \ any other pod in the cluster or any external endpoint.\n\nThere is no network-level enforcement of the zero-trust principles\
  \ this operator exists to provide.\n\nNetworkPolicies are a baseline security expectation for platform workloads on OpenShift.\n\
  \nGoals\n\nDeploy a default-deny NetworkPolicy for all pods in the ZTWIM namespace.\n\nDefine fine-grained ingress/egress\
  \ rules for each component based on actual traffic analysis.\n\nOperator automatically creates and reconciles operand NetworkPolicies\
  \ during operand installation.\n\nNo API changes required -- policies are predefined, no user configuration needed.\n\n\
  No functional regression -- all existing traffic flows (metrics, webhooks, federation, agent attestation) continue to work.\n\
  \nMetrics collection by Prometheus remains functional for all components.\n\nNon-Goals\n\nUser-configurable network policies.\
  \ All policies are predefined based on traffic analysis.\n\nAdminNetworkPolicy or cluster-wide policy management. Standard\
  \ NetworkPolicy objects are sufficient.\n\nNetwork policies for workloads consuming SPIFFE identities -- only for ZTWIM\
  \ infrastructure components.\n\nChanging or extending the ZTWIM CRD API.\n\nHow\n\nArchitecture\n\nTraffic Matrix\n\nImplementation\
  \ Approach\n\nOperator policy: Enable and update the existing static NetworkPolicy YAML at config/network-policy/allow-metrics-traffic.yaml.\
  \ Add an API server egress policy. Include both in the OLM bundle.\n\nOperand policies: Add NetworkPolicy YAML templates\
  \ to bindata/ (alongside existing Service/RBAC templates). Each operand controller reconciles its NetworkPolicies using\
  \ the existing get-or-create-then-update pattern.\n\nNo config hash inclusion: NetworkPolicy changes must NOT be included\
  \ in the config hash annotations that drive StatefulSet/DaemonSet rolling updates, since they don't affect pod configuration.\n\
  \nTesting and Verification\n\nAll existing E2E tests run with NetworkPolicies enabled -- validates no functional regression.\n\
  \nDedicated negative tests: verify blocked traffic on non-allowed ports using a curl pod.\n\nValidate Prometheus metrics\
  \ scraping continues to work.\n\nValidate federation traffic works when federation is enabled.\n\nValidate webhook traffic\
  \ from API server to spire-controller-manager.\n\nMigration / Upgrade\n\nNo user migration required. Policies are deployed\
  \ automatically.\n\nRisk: during upgrade from a version without policies to one with them, deny-all could be applied before\
  \ allow policies are reconciled, causing a brief disruption. Mitigation: reconcile allow policies before deny-all in the\
  \ controller, or reconcile all policies in a single reconciliation pass.\n\nAlternatives\n\nAlternative 1: Single Combined\
  \ Policy per Component\n\nCreate one large NetworkPolicy per component containing all ingress and egress rules in a single\
  \ object.\n\nRejected because: Multiple smaller, focused policies (one for API server egress, one for metrics ingress, etc.)\
  \ are easier to understand, debug, and manage independently.\t\n\nAlternative 2: Namespace-level Deny-All Only (No Per-component\
  \ Targeting)\n\nApply a single podSelector: {} deny-all and allow rules without targeting specific pods.\n\nRejected because:\
  \ Per-component targeting with specific pod selectors is more explicit and ensures policies are clearly associated with\
  \ the component they protect.\n\nAlternative 3: AdminNetworkPolicy\n\nUse cluster-scoped AdminNetworkPolicy resources for\
  \ stronger enforcement.\n\nRejected because: Standard NetworkPolicy objects are sufficient for this scope and do not require\
  \ cluster-admin privileges to manage.\n\nRisks\n\nReviews\n\n---\n\n# ADR_ Resource Ownership Validation and Conflict Detection\n\
  \nADR: Resource Ownership Validation and Conflict Detection\n\nThe operator must validate resource ownership before overwriting\
  \ to prevent breaking other workloads.\n\nDate:                                                  Apr 27, 2026\n\nScope:\
  \                                                Zero Trust Workload Identity Manager (ZTWIM) Operator\n\nStatus:      \
  \                                         , status changed date: Apr 27, 2026\n\nAuthors:                              \
  \              Raushan Kumar Singh\n\nOther docs:                                       SPIRE-344, SPIRE-344\n\nWhat\n\n\
  This decision doc proposes a mandatory resource ownership verification step for the ZTWIM Operator. It touches all controllers\
  \ and their respective reconciliation logic for resources including ConfigMaps, StatefulSets, Services, RBAC, and Routes.\
  \ The operator will verify the presence of the app.kubernetes.io/managed-by: zero-trust-workload-identity-manager label\
  \ before proceeding with any update.\n\nWhy\n\nCurrently, the operator employs a \"Get then Update\" strategy regardless\
  \ of resource origin. Because the operator uses common resource names (e.g., spire-server), there is a high risk of name\
  \ collisions with existing workloads in a shared namespace.\n\nOverwriting these resources without verification causes silent\
  \ failures and breaks workloads the operator is not responsible for. By enforcing a management label check, we ensure the\
  \ operator only interacts with its own child resources, providing a \"fail-safe\" mechanism that protects the broader cluster\
  \ environment.\n\nGoals\n\nPrevent Data Loss: Stop the operator from overwriting resources it did not create.\n\nVisibility:\
  \ Use status conditions on the operand CR to explicitly report naming conflicts to administrators.\n\nSelf-Healing: Allow\
  \ the operator to automatically resume reconciliation once the conflicting resource is renamed or removed.\n\nNon-Goals\n\
  \nEnforcing strict RBAC to prevent users from manually editing operator-managed labels.\n\nImplementing Kubernetes Events\
  \ for conflict reporting in this initial phase.\n\nHow\n\nThe solution introduces a CheckResourceConflict function called\
  \ immediately after a resource is successfully retrieved from the cluster.\n\nThe Logic Flow:\n\nGet Resource: If the resource\
  \ exists, retrieve its metadata.\n\nValidate Label: Check if labels[\"app.kubernetes.io/managed-by\"] == \"zero-trust-workload-identity-manager\"\
  .\n\nConflict Handling: If the label is missing or incorrect, return a ResourceConflict error and update the CR status.\
  \ Do not proceed with the update.\n\nCreation: If the resource does not exist, create it with the required management label\
  \ and owner references.\n\nTesting and Verification\n\nUnit Tests: Validate the check function against labeled, unlabeled,\
  \ and incorrectly labeled objects.\n\nController Tests: Mock the Get call to return a conflicting resource and verify the\
  \ reconciliation loop halts and reports the error.\n\nE2E Tests: Manually create a spire-server ConfigMap without the label\
  \ and verify the operator refuses to overwrite it upon installation.\n\nOperations\n\nThe solution is operational by default\
  \ as all resources created by the operator already include the standardized labels. No migration of existing operator-managed\
  \ resources is required.\n\nOpen Questions\n\nShould we emit Kubernetes Events in addition to status conditions?\n\nCurrent\
  \ proposal: No\n\nShould the reconciliation continue to check other resources after the first conflict is found, or stop\
  \ immediately?\n\nCurrent proposal: Stop immediately\n\nAlternatives\n\nOption B: UID (Owner Reference) Check: Use the controller\
  \ owner reference UID.\n\nWhy not: Removing owner references is a standard recovery procedure for \"stuck\" resources and\
  \ it’s mainly used for cleanups. Using UID would penalize admins for standard cluster maintenance. Owner ref does not exist\
  \ on routes created by operator.\n\nOption C: UID and Label Hybrid: Check UID first, fall back to labels.\n\nWhy not: Increased\
  \ code complexity with marginal benefit; label-based checking is sufficient for the identified risks.\n\nOption D: No Ownership\
  \ Check: \n\nWhy not: Violates the core requirements of SPIRE-344 and risks breaking customer workloads.\n\nRisks\n\nRisk\
  \ Summary\n\nThe primary risk is the \"Spoofing\" scenario where a user accidentally or intentionally adopts the operator's\
  \ label. However, this is significantly lower than the current risk of silent resource overwrites.\n\nMitigations: Clear\
  \ documentation on reserved labels and explicit error messaging in the ResourceConflict status condition to guide user remediation.\n\
  \nReviews\n\n---\n\n# ADR_ SCC Hardening for SPIRE Agent and SPIFFE CSI Driver\n\nADR\n\nSCC Hardening for SPIRE Agent and\
  \ SPIFFE CSI Driver\n\nProposed SCC hardening strategy for ZTWIM operands to enforce least privilege while maintaining strict\
  \ control over granted permissions.\n\nDate: \t\tApr 9, 2026\n\nScope:\t\tZero Trust Workload Identity Manager (ZTWIM) Operator\n\
  \nStatus: \t\t  Status Changed Date: Apr 9, 2026\n\nAuthors: \t\tNandan Hegde\n\nOther docs:\n\nSCC Hardening Review + Spike\
  \ Guide\n\nWhat\n\nSPIRE Agent and SPIFFE CSI Driver currently run in privileged mode using custom SCCs. This introduces\
  \ unnecessary security exposure, particularly for the SPIRE Agent where privileged mode is not functionally required.\n\n\
  This ADR proposes:\n\nRemoving privileged mode from SPIRE Agent and running it as root with all capabilities dropped\n\n\
  Retaining privileged mode for SPIFFE CSI Driver due to bidirectional mount propagation requirements\n\nStandardizing on\
  \ hardening SCCs for SPIRE Agent. SPIFFE CSI Driver to use system:privileged SCC\n\nWhy\n\nProblem\n\nBoth SPIRE Agent and\
  \ SPIFFE CSI Driver currently run as privileged containers. While required for SPIFFE CSI Driver, this is unnecessary and\
  \ overly permissive for SPIRE Agent, increasing the attack surface.\n\nRoot Cause\n\nSPIRE Agent privileged requirement\
  \ was historically used to bypass filesystem permission constraints for socket creation\n\nSPIFFE CSI Driver requires bidirectional\
  \ mount propagation, which Kubernetes allows only for privileged containers\n\nNo existing OpenShift SCC provides a minimal,\
  \ least-privileged configuration matching these requirements\n\nKey Findings\n\nSPIRE Agent requires:\n\nRoot equivalent\
  \ user (UID 0) to create UDS socket file\n\nPOSIX permissions are sufficient for Unix Domain Socket creation\n\nNo additional\
  \ Linux capabilities\n\nPrivileged mode grants all capabilities (not limited by drop rules) and thus breaking container\
  \ isolation\n\nSPIRE-CSI-DRIVER requires:\n\nPrivileged mode to allow bidirectional hostpath mount. This is the only way\
  \ possible for kubelet to inform CSI driver through NodePublishVolume calls\n\nConclusion\n\nSpire agent works with required\
  \ capabilities by inheriting the user defined in dockerfile, that means, there will be no explicit privilege mode enabled\n\
  \nPrivileged mode is required for CSI driver to perform bidirectional mounting\n\nCustom SCCs are required for SPIRE Agent\n\
  \nGoals\n\nEliminate unnecessary privileged access for SPIRE Agent\n\nEnforce least privilege principle across operands\n\
  \nMaintain full functional correctness\n\nAvoid introducing breaking changes to workloads\n\nNon-Goals\n\nRedesign of SPIFFE\
  \ CSI driver architecture to avoid privilege permission\n\nRemoval of hostPath or PID-based attestation mechanisms in SPIRE\
  \ Agent\n\nAdding required capability permissions to non-root user\n\nHow\n\nSPIRE Agent SCC Hardening\n\nDaemonset (podSpec)\
  \ changes\n\npodspec.securityContext.capabilities: drop all\n\npodspec.securityContext.Privileged: false\n\npodspec.networkPolicy\
  \ : clusterFirst \n\nWe do not need hostNetwork since MY_NODE_NAME is set in podspec\n\npodspec.hostNetwork: false\n\nProposed\
  \ Daemonset for SPIRE-Agent\n\napiVersion: apps/v1\n\nkind: DaemonSet\n\nmetadata:\n\n  name: spire-agent\n\n  # ...\n\n\
  spec:\n\n  # ...\n\n    spec:\n\n      hostPID: true          # workload attestation; SCC must allow host PID\n\n      hostNetwork:\
  \ false\n\n      dnsPolicy: ClusterFirst\n\n      serviceAccountName: spire-agent\n\n      containers:\n\n        - name:\
  \ spire-agent\n\n          image: <spire-agent-image>\n\n          # probes, ports, volumeMounts, resources...\n\n     \
  \     securityContext:\n\n            allowPrivilegeEscalation: false\n\n            privileged: false\n\n            capabilities:\n\
  \n              drop: [\"ALL\"]\n\n            readOnlyRootFilesystem: true\n\n\n\nSCC changes\n\nhostNetwork and hostPort\
  \ permission are denied\n\nrunAsUser is set to runAsAny to facilitate SPIRE Agent to run as root user (default user is UID\
  \ 0 in the SPIRE Agent docker file)\n\nCustom SPIRE Agent SCC without any RBAC to the operator.\n\nProposed SCC for SPIRE\
  \ Agent\n\napiVersion: security.openshift.io/v1\n\nkind: SecurityContextConstraints\n\nmetadata:\n\n  name: spire-agent\n\
  \n  # ...\n\nreadOnlyRootFilesystem: true\n\nrunAsUser:\n\n  type: RunAsAny\n\nseLinuxContext:\n\n  type: MustRunAs\n\n\
  supplementalGroups:\n\n  type: MustRunAs\n\nfsGroup:\n\n  type: MustRunAs\n\nusers:\n\n  - system:serviceaccount:<operator-namespace>:spire-agent\n\
  \ngroups: []\n\nallowHostDirVolumePlugin: true\n\nallowHostIPC: false\n\nallowHostNetwork: false\n\nallowHostPID: true\n\
  \nallowHostPorts: false\n\nallowPrivilegeEscalation: false\n\nallowPrivilegedContainer: false\n\nallowedCapabilities: []\n\
  \ndefaultAddCapabilities: []\n\nrequiredDropCapabilities:\n\n  - ALL\n\nvolumes:\n\n  - configMap\n\n  - hostPath\n\n  -\
  \ projected\n\n  - secret\n\n  - emptyDir\n\n\n\nRationale\n\nRoot is required for creating and binding to socket file\
  \ in hostPath-mounted directory\n\nBacking node volume is created by kubelet and it’s root owned. Note that only POSIX file\
  \ permissions are sufficient to create and bind UDS socket file\n\nAdditional Capabilities or Privilege mode are not required\
  \ for socket creation.\n\nA privileged container can do almost anything the host can do (like accessing hardware or reconfiguring\
  \ the kernel), making it a massive security risk, hence by not allowing the container to run in privileged mode and dropping\
  \ all capabilities.\n\nDisable hostNetwork and hostPort (hostNetwork is not necessary when MY_NODE_NAME is set) and set\
  \ podspec.DNSpolicy to ClusterFirst\n\nWhen the above mentioned env is unset, only then the agent needs hostNetwork permission\
  \ to talk to kubelet. Unnecessary permission may lead to increasing attack surface\n\nFor proposing custom SPIRE Agent SCC\n\
  \nCurrently there doesn’t exist a minimum permission SCC which matches spire agent requirement. Alternate will be to use\
  \ a higher privileged system SCC which makes the agent security susceptible to a broader set of permissions than necessary.\n\
  \nSPIRE CSI Driver SCC Hardening\n\nDaemonset (podSpec)\n\nRemains privileged (no change)\n\nSCC changes\n\nNo changes.\
  \ We continue to use custom SCC for SPIRE-CSI-Driver . We ended up using system:privileged SCC by creating a namespace scoped\
  \ rolebinding.\n\nRationale\n\nPrivilege permission is necessary for CSI Driver to allow Bidirectional mount propagation\n\
  \nCsi-node-registrar uses hostPath mounting to register the SPIRE-CSI-Driver. Kubelet invokes NodePublishVolume grpc invocation\
  \ of SPIRE-CSI-Driver when any workload uses csi driver. This is only available via bidirectional mounting and hence privileged.\n\
  \nCustom SCC for SPIRE-CSI-Driver\n\nCustom SCC fits here because it will allow restricting ztwim operator service account\
  \ on role binding permissions. Alternate would be to use system:privileged SCC which would mean to give broader permission\
  \ to ztwim operator to enable rolebinding to system:privileged SCC.\n\nCorrection: We decided to use system:privileged SCC\
  \ with a namespace scoped rolebinding.T\n\nhere is no validation or policy in the system where the system is able to reject\
  \ the pods using this custom scc. So there exists a path of unknowingly using this privileged scc. That’s why the call is\
  \ to end up using privileged scc. If an incident happens, then it will be at the known standard place. And we do not need\
  \ to maintain custom policy.\n\nAlternatives\n\nKeep SPIRE Agent privileged\n\nRejected: violates least privilege and introduces\
  \ security risk\n\nRun SPIRE Agent as non-root without privileged\n\nRejected: fails due to inability to create socket in\
  \ root-owned directory since crio doesn’t allow to grant ambient capabilities to the non root user. Ambient capabilities\
  \ are necessary for a non root user to grant capabilities. This is a shortcoming in both k8s.\n\nUse non-root + privileged\
  \ + drop capabilities\n\nRejected: ineffective as privileged mode restores all capabilities and these capabilities give\
  \ near system admin control to the host node\n\nUse default hostmount-anyuid SCC for SPIRE Agent\n\nRejected: This SCC doesn't\
  \ grant HostPID permission which is necessary for agent.\n\nUse default hostaccess SCC for SPIRE Agent\n\nRejected: This\
  \ SCC doesn't let agent to run as root user.\n\nUse non root user without privilege for SPIRE-CSI-DRIVER\n\nRejected: kubernetes\
  \ doesn't allow the pod to be non privileged and be bidirectional mounting at the same time.\n\nRisks\n\nReviews\n\nAnybody\
  \ may review the document and provide feedback.  Acceptance and rejection is reserved for those people noted in the appropriate\
  \ \"Accept / Reject\" section of each ADR.\n\n---\n\n# ADR_ VSOCK Bridge Management and VM SPIRE Agent Attestation\n\nADR:\
  \ VSOCK Bridge Management and VM SPIRE Agent Attestation\n\nDate:                                                  Aug 6,\
  \ 2026\n\nStatus:                                               \n\nAuthors:                                           \
  \ Raushan Kumar Singh\n\nOther docs:                                       SPIRE on OpenShift Virtualization - PoC\n\nWhat\n\
  \nThis decision doc proposes extending the ZTWIM Operator to:\n\nManage the VSOCK bridge lifecycle: Automatically deploy,\
  \ configure, and maintain the socat-based proxy that enables communication between a KubeVirt VM's SPIRE Agent and the cluster's\
  \ SPIRE Server over the hypervisor-level VSOCK channel.\n\nConfigure SPIRE Server for x509pop attestation: The operator\
  \ configures the SPIRE Server's built-in x509pop node attestor and mounts a user-provided CA certificate (referenced by\
  \ Secret name in the CR), enabling VM SPIRE Agents to attest and re-attest.\n\nWhy\n\nToday, ZTWIM provides workload identity\
  \ exclusively to container workloads. Applications inside VMs on OpenShift Virtualization cannot obtain SVIDs because:\n\
  \nKernel isolation prevents socket sharing: A Unix domain socket created by the host-side SPIRE Agent cannot be accessed\
  \ by the VM's guest kernel. The SPIFFE-CSI-Driver mounts the agent socket into the virt-launcher pod, but the VM's filesystem\
  \ is completely separate.\n\nNo communication channel exists by default: There is no built-in path for a SPIRE Agent inside\
  \ a VM to reach the SPIRE Server. A bridge component and a re-attestable attestation mechanism is required.\n\nGoals\n\n\
  Automated VSOCK Bridge: The operator deploys and maintains the host-side VSOCK bridge component without administrator intervention.\n\
  \nx509pop Server Configuration: The operator configures the SPIRE Server to accept x509pop attestation by mounting a user-provided\
  \ CA certificate Secret.\n\nSecurity Isolation: Communication between VM agents and the SPIRE Server remains confined to\
  \ the VSOCK channel (hypervisor-level, never touches the network stack).\n\nNon-Goals\n\nInstalling the SPIRE Agent binary\
  \ inside VMs\n\nManaging the socat bridge inside the VM guest\n\nSupporting non-OCP Virtualization VM platforms\n\nCA creation\
  \ and management: The user is responsible for creating the x509pop CA and storing it in a Kubernetes Secret.\n\nPer-VM certificate\
  \ generation: The user is responsible for creating per-VM certificates signed by the CA and making them available to VMs.\n\
  \nCertificate injection into VMs: Getting the certificate and private key into the VM's filesystem is outside the operator's\
  \ scope.\n\nHow\n\nThe solution introduces two operator-managed components: the VSOCK bridge for connectivity, and SPIRE\
  \ Server x509pop configuration for attestation.\n\nComponent 1: VSOCK Bridge (Host-Side) - Daemonset\n\nMechanism: The SPIRE\
  \ Agent inside the VM connects via TCP to localhost:8081, where a socat instance (running as a systemd service inside the\
  \ VM) accepts the connection and forwards it over VSOCK to the host (CID 2, port 8081). On the host node, the VSOCK Bridge\
  \ Pod listens on VSOCK port 8081, accepts the incoming connection from the VM, and forwards it over TCP to the SPIRE Server's\
  \ ClusterIP Service. From the perspective of both the SPIRE Agent and Server, this is a standard gRPC connection over TCP\
  \ and neither is aware that VSOCK sits in the middle as a transport layer. The connection is TLS-encrypted; after initial\
  \ attestation, subsequent connections use full mTLS (both sides present certificates).\n\nAgent bootstrap: Because VSOCK\
  \ is hypervisor-internal, VM agents can safely use insecure_bootstrap = true, eliminating the need to provision the SPIRE\
  \ Server trust bundle into VMs.\n\nSecurity context: The VSOCK bridge DaemonSet requires the privileged SCC because the\
  \ default container runtime seccomp profile blocks socket(AF_VSOCK) to prevent unprivileged containers from accessing host-guest\
  \ VSOCK channels (a security measure introduced at KubeVirt's request).\n\nComponent 2: SPIRE Server x509pop Configuration\n\
  \nThe x509pop (X.509 Proof-of-Possession) plugin is a built-in SPIRE node attestor that attests agents using pre-provisioned\
  \ X.509 certificates.\n\nWhat the operator does:\n\nThe operator exposes a CR field that allows the user to specify the\
  \ name of a Kubernetes Secret containing their x509pop CA certificate. When this field is set, the operator:\n\nMounts the\
  \ referenced Secret into the SPIRE Server pod at a known path (e.g., /run/spire/x509pop-ca/).\n\nAdds the x509pop NodeAttestor\
  \ plugin block to the SPIRE Server configuration.\n\nRestarts/rolls the SPIRE Server StatefulSet to pick up the new configuration.\n\
  \nCR API (proposed field):\n\napiVersion: operator.openshift.io/v1alpha1\n\nkind: SpireServer\n\nmetadata:\n\n  name: cluster\n\
  \nspec:\n\n  # ... existing fields ...\n\n  nodeAttestors:\n\n    x509pop:\n\n      caBundleSecretName: \"my-x509pop-ca\"\
  \   # User-created Secret containing ca.crt\n\n  vsockBridge:\n\n    enabled: true   # Deploys the VSOCK bridge DaemonSet\
  \ for VM-to-server communication\n\n\n\nSPIRE Server configuration (generated by operator when x509pop is enabled):\n\n\
  NodeAttestor \"x509pop\" {\n\n    plugin_data {\n\n        ca_bundle_path = \"/run/spire/x509pop-ca/ca.crt\"\n\n    }\n\
  \n}\n\n\n\nWhat the user is responsible for (prerequisites):\n\nCreate a CA.\n\nStore CA cert in a Secret - This is the\
  \ same Secret name referenced in spec.nodeAttestors.x509pop.caBundleSecretName.\n\nGenerate per-VM certificates\n\nInject\
  \ cert + key into VMs\n\nHandle certificate renewal\n\nThe attestation flow:\n\nVM's SPIRE Agent connects to SPIRE Server\
  \ via TLS (over VSOCK bridge).\n\nAgent presents its agent-cert.pem (signed by the user's CA) to the server.\n\nServer verifies\
  \ the certificate chain against the CA certificate mounted from the user-provided Secret.\n\nServer issues a proof-of-possession\
  \ challenge - a random nonce the agent must sign with its private key.\n\nAgent signs the nonce and returns it. Only the\
  \ holder of the private key can produce a valid signature.\n\nServer assigns a SPIFFE ID: spiffe://<trust_domain>/spire/agent/x509pop/<certificate-fingerprint>\n\
  \nOperator Reconciliation Logic\n\nWhen spec.vsockBridge.enabled is set to true on the SpireServer CR:\n\nDeploy VSOCK bridge\
  \ DaemonSet on all worker nodes.\n\nWhen spec.nodeAttestors.x509pop.caBundleSecretName is set on the SpireServer CR:\n\n\
  Add a volume to the SPIRE Server StatefulSet sourcing from the referenced Secret.\n\nAdd a volumeMount to the SPIRE Server\
  \ container at /run/spire/x509pop-ca/.\n\nPatch the SPIRE Server ConfigMap to include the x509pop NodeAttestor plugin block.\n\
  \nRoll the StatefulSet to apply the new config.\n\nUpdate CR status to reflect x509pop attestation readiness.\n\nIf the\
  \ caBundleSecretName field is removed, the operator reverses steps 1–5 (removes the plugin, volume, and mount).\n\nTesting\
  \ and Verification\n\nUnit Tests: Validate helper functions - config generation logic, DaemonSet spec construction.\n\n\
  E2E Tests\n\nOpen Questions\n\nShould the CR expose an agentPathTemplate field to customize the SPIFFE ID format for VM\
  \ agents?\n\nBenefit: The x509pop plugin supports an agent_path_template that controls how the agent's SPIFFE ID is derived\
  \ from the certificate. The default is {{ .PluginName }}/{{ .Fingerprint }} which produces opaque IDs like spiffe://<td>/spire/agent/x509pop/a1b2c3d4e5f....\
  \ If the user sets it to /cn/{{ .Subject.CommonName }}, the SPIFFE ID becomes human-readable and predictable (e.g., spiffe://<td>/spire/agent/cn/database-vm-01),\
  \ which makes registration entry creation much easier - you know the parentID ahead of time based on the certificate CN.\
  \ The template has access to the full Go x509.Certificate struct plus SPRIG functions.\n\nTrade-off: Adding this field increases\
  \ the CR API surface. Without it, the user gets the default fingerprint-based ID which is unique but opaque. With it, the\
  \ user gains predictability but must ensure CN uniqueness across VMs.\n\nCurrent proposal: TBD.\n\nAlternatives\n\nCustom\
  \ KubeVirt node attestor plugin\n\nDevelop a server-side and agent-side SPIRE plugin pair. The agent sends VM metadata (namespace,\
  \ name, UID, VSOCK CID) to the server, which validates the VM's existence via the KubeVirt API. No per-VM certificate required.\n\
  \nWhy not: Significantly higher engineering effort compared to using SPIRE's built-in x509pop, and will need upstream contribution.\n\
  \njoin_token attestation (single-use token)\n\nThe simplest approach - generate a one-time token per VM on the SPIRE Server\
  \ and pass it to the agent.\n\nWhy not: Tokens are consumed on first use and cannot support re-attestation. If the agent\
  \ restarts or the SVID expires, attestation fails permanently until a new token is manually generated. Not viable for production.\n\
  \nNo bridge - use TCP over pod network\n\nThe VM's SPIRE Agent connects to the SPIRE Server directly over the cluster network\
  \ via a Route (passthrough TLS), NodePort, or LoadBalancer.\n\nWhy not: Passthrough TLS provides end-to-end encryption,\
  \ but requires provisioning bundle.pem into every VM (cannot use insecure_bootstrap safely over the network - MITM risk\
  \ on first connection). Also exposes the SPIRE Server's agent-facing gRPC API externally (Route/NodePort), adding attack\
  \ surface. VSOCK enables safe insecure_bootstrap (hypervisor-internal, unreachable from network), requires zero network\
  \ configuration, and provides defense in depth.\n\nRisks\n\nSecurity Risk: A compromised pod on the same node could attempt\
  \ to connect to the VSOCK bridge and impersonate a VM.\n\nMitigation: VSOCK is address-family isolated. Only the hypervisor\
  \ can route VSOCK traffic. Pods using standard networking (AF_INET) cannot reach the VSOCK listener. x509pop's proof-of-possession\
  \ challenge ensures that even possessing the certificate is insufficient without the private key.\n\nOperational Risk: VM\
  \ live migration moves the VM to a new node. If the bridge is not present on the target node, the agent loses connectivity.\n\
  \nMitigation: DaemonSet approach ensures every worker node has a bridge.\n\nCustomer Risk: Users must manage certificate\
  \ lifecycle themselves (CA creation, per-VM certs, renewal, injection). Misconfiguration leads to attestation failures.\n\
  \nMitigation: Comprehensive documentation with cert-manager examples. If the Secret is missing or has wrong keys, the SPIRE\
  \ Server pod will fail to start.\n\nCustomer Risk: VMs without VSOCK enabled will silently fail to connect to the SPIRE\
  \ Server.\n\nMitigation: Documentation lists VSOCK enablement as a prerequisite.\n\nReviews\n\n---\n\n# ADR_ ZTWIM SpireAgent\
  \ SDS Configuration for OSSM_Istio Integration\n\nZTWIM SpireAgent SDS Configuration for OSSM/Istio Integration\n\nHow we\
  \ propose adding SDS configuration support to the SpireAgent CRD to enable native multi-cluster mTLS with OpenShift Service\
  \ Mesh.\n\nDate: \t\tApr 1, 2026\n\nScope:\t\tZero Trust Workload Identity Manager (ZTWIM) Operator\n\nStatus: \t\t  Status\
  \ Changed Date: Apr 1, 2026\n\nAuthors: \t\tManish Pillai\n\nOther docs:\n\nOSSM + SPIRE Single-Cluster Guide\n\nOSSM +\
  \ SPIRE Multi-Cluster Guide\n\nOSSM Official SPIRE Integration Docs\n\nIstio SPIRE Trust Domain Federation Sample\n\nExecutive\
  \ Summary\n\nWhen SPIRE is used with OSSM for cross-cluster mTLS, Envoy cannot see the remote cluster's CA certificate —\
  \ even when SPIRE federation is fully set up. The federated CA bundle exists in the SPIRE Agent's cache but never gets delivered\
  \ to Envoy because of a naming mismatch in SPIRE's SDS configuration. Today, users fix this by manually patching the spire-agent\
  \ ConfigMap after enabling CREATE_ONLY_MODE. This change hardcodes the correct two SDS settings directly in the operator\
  \ so the workaround is never needed.\n\nWhat\n\nA two-line addition to pkg/controller/spire-agent/configmap.go. The generated\
  \ agent.conf will always include:\n\n\"sds\": {\n\n  \"default_bundle_name\": \"null\",\n\n  \"default_all_bundles_name\"\
  : \"ROOTCA\"\n\n}\n\n\n\nNo new API fields. No user action required. The operator generates this for every deployment.\n\
  \nFiles changed:\n\nWhy\n\nThe Problem: Envoy Asks for \"ROOTCA\", Gets the Wrong Thing\n\nWhen Envoy starts as an Istio\
  \ sidecar, it connects to the SPIRE Agent socket and asks for two things\n\n\"default\"  → my workload certificate (SVID)\n\
  \n\"ROOTCA\"   → the CA certs I should use to verify other pods\n\nThese names (\"default\" and \"ROOTCA\") are hardcoded\
  \ Go constants in Istio source. They cannot be changed from the Istio or Envoy side.\n\nSPIRE Agent's default behavior when\
  \ it gets the \"ROOTCA\" request:\n\n\"ROOTCA\" → serves LOCAL trust domain CA only\n\n\"ALL\"    → serves ALL CAs including\
  \ federated ones\n\nIn single-cluster, this is fine. All workloads share one CA, so \"ROOTCA\" returning the local CA is\
  \ correct.\n\nIn multi-cluster with SPIRE federation, it breaks:\n\nCluster-A Envoy asks \"ROOTCA\" → gets CA-A only\n\n\
  Peer from Cluster-B presents cert signed by CA-B\n\nCluster-A Envoy validates → CA-B not in ROOTCA → TLS fails\n\nThe root\
  \ cause: Istio always asks for \"ROOTCA\", but SPIRE's default routes that to the local-CA-only handler. The all-bundles\
  \ handler (which includes federated CAs) responds to \"ALL\" — a name Istio never requests.\n\nWhy SPIRE Federation Doesn't\
  \ Fix This by Itself\n\nThis comes up often, so it is worth being explicit.\n\nFederation does one thing: SPIRE Servers\
  \ exchange CA bundles with each other. After federation is set up, the SPIRE Agent's cache contains CA-A + CA-B. That part\
  \ works.\n\nBut the federation has no mechanism to change how the SDS handler names its responses. The SDS naming config\
  \ (default_bundle_name, default_all_bundles_name) is set exclusively through agent.conf. It has no relationship to the federation\
  \ state. Confirmed by looking at the code:\n\nspire-controller-manager: zero SDS configuration code\n\nClusterFederatedTrustDomain:\
  \ no SDS fields\n\nSPIRE Server federation: no connection to SDS naming\n\nFederation gets CA-B into the cache. The SDS\
  \ config change is what gets CA-B out of the cache and into Envoy. Both are required.\n\nThe Fix\n\nSet default_all_bundles_name\
  \ = \"ROOTCA\" so that when Envoy asks for \"ROOTCA\", SPIRE serves all bundles (CA-A + CA-B) instead of just the local\
  \ one. Set default_bundle_name = \"null\" so the local-only handler does not intercept the \"ROOTCA\" request first (the\
  \ switch statement checks default_bundle_name before default_all_bundles_name).\n\nAfter the fix, SPIRE returns a SPIFFE\
  \ Certificate Validator with a per-trust-domain CA map:\n\n{\n\n  \"name\": \"ROOTCA\",\n\n  \"validation_context\": {\n\
  \n    \"custom_validator_config\": {\n\n      \"name\": \"envoy.tls.cert_validator.spiffe\",\n\n      \"typed_config\":\
  \ {\n\n        \"trust_domains\": [\n\n          { \"name\": \"cluster-a\", \"trust_bundle\": \"<CA-A>\" },\n\n        \
  \  { \"name\": \"cluster-b\", \"trust_bundle\": \"<CA-B>\" }\n\n        ]\n\n      }\n\n    }\n\n  }\n\n}\n\n\n\nEnvoy\
  \ extracts the trust domain from the peer's SPIFFE ID, looks up the matching CA, validates the cert. Cross-cluster mTLS\
  \ works.\n\nWhy Hardcoding Is Safe\n\nThese values are correct for every Istio/Envoy deployment:\n\nSingle-cluster (no federation):\
  \ buildAll() returns only CA-A because no federated bundles exist yet. Identical result to the current default. No regression.\n\
  \nMulti-cluster with federation: buildAll() returns CA-A + CA-B. Cross-cluster mTLS now works.\n\nIstio always requests\
  \ \"ROOTCA\". This will not change — it is a stable constant in Istio source used across hundreds of locations. There is\
  \ no deployment where the old defaults are preferable over the hardcoded values when using Istio.\n\nThe official Istio\
  \ SPIRE federation sample (spire-base.yaml) confirms this is the right approach — it sets the same values via Helm:\n\n\
  spire-agent:\n\n  sds:\n\n    defaultBundleName: \"null\"\n\n    defaultAllBundlesName: ROOTCA\n\n\n\nGoals\n\nSPIRE Agent\
  \ ConfigMap always contains the correct SDS settings for Istio/OSSM integration\n\nNo manual patching, no CREATE_ONLY_MODE\
  \ needed for multi-cluster\n\nSingle-cluster deployments work identically to today\n\nNo new API fields\n\nNon-Goals\n\n\
  Changes to SPIFFE CSI Driver, SPIRE Server, or spire-controller-manager\n\nAutomating the Istio CR configuration on the\
  \ OSSM side\n\nMaking the socket filename configurable (tracked separately)\n\nExposing default_svid_name or disable_spiffe_cert_validation\
  \ (both already match Istio expectations, no need)\n\nHow\n\nOne change in generateAgentConfig():\n\nagentConf := map[string]interface{}{\n\
  \n    \"agent\": map[string]interface{}{\n\n        // ... existing fields ...\n\n        \"sds\": map[string]interface{}{\n\
  \n            \"default_bundle_name\":      \"null\",\n\n            \"default_all_bundles_name\": \"ROOTCA\",\n\n     \
  \   },\n\n    },\n\n    // ... rest unchanged\n\n}\n\n\n\nGenerated agent.conf:\n\n{\n\n  \"agent\": {\n\n    \"socket_path\"\
  : \"/tmp/spire-agent/public/spire-agent.sock\",\n\n    \"trust_domain\": \"cluster-a\",\n\n    \"sds\": {\n\n      \"default_bundle_name\"\
  : \"null\",\n\n      \"default_all_bundles_name\": \"ROOTCA\"\n\n    }\n\n  }\n\n}\n\n\n\nTesting\n\nUnit tests in configmap_test.go:\n\
  \nagent.conf always contains the sds block\n\ndefault_bundle_name is \"null\"\n\ndefault_all_bundles_name is \"ROOTCA\"\n\
  \nExisting tests for other fields still pass\n\nE2E:\n\nMulti-cluster OSSM + ZTWIM with federation — cross-cluster mTLS\
  \ works without manual ConfigMap patching\n\nCREATE_ONLY_MODE not required\n\nAlternatives\n\nAlternative 1: Expose as User-Configurable\
  \ API Fields\n\nThe correct values are the same for every Istio deployment. Adding API fields just to let users set things\
  \ they should never change adds complexity without value.\n\nAlternative 2: Keep the Manual Workaround - CREATE_ONLY_MODE\n\
  \nThe OSSM team's documentation requires it today. It breaks on every ZTWIM operator upgrade because the operator reverts\
  \ the ConfigMap. Not acceptable for a supported product.\n\nAlternative 3: Trigger Only When Federation Is Configured\n\n\
  The SDS settings are correct for all Istio deployments regardless of whether federation is set up today. A single-cluster\
  \ deployment with these settings behaves identically to one without them. Tying this to federation detection would also\
  \ create a coupling between SpireAgent's SDS configuration and SpireServer's federation state — they are independent concerns.\
  \ When a user later adds federation, the SDS config should already be in place.\n\nAlternative 4: Rely on SPIRE Federation\
  \ to Auto-Configure SDS\n\nNot possible. Federation and SDS naming are architecturally independent in SPIRE. There is no\
  \ existing hook, trigger, or config path that connects them. Federation puts bundles into the agent's cache. The SDS config\
  \ change is what routes those bundles to Envoy. No amount of ClusterFederatedTrustDomain or ClusterSPIFFEID configuration\
  \ can substitute for the SDS naming change — verified by code search across spire-controller-manager, SPIRE Server, and\
  \ SPIRE Agent.\n\nRisks\n\nBackward compatibility: The only behavioral change is that single-cluster deployments now use\
  \ buildAll() instead of buildOne() for \"ROOTCA\". When there are no federated bundles, buildAll() returns the same result\
  \ as buildOne(). No regression.\n\nRolling restart: The ConfigMap hash changes, triggering a SPIRE Agent DaemonSet rolling\
  \ restart. Envoy caches certs (valid ~1 hour), and the agent restarts in seconds. Recovery is automatic. No workload pod\
  \ restarts needed.\n\nReviews\n\nAnybody may review the document and provide feedback.  Acceptance and rejection is reserved\
  \ for those people noted in the appropriate \"Accept / Reject\" section of each ADR.\n\nAccept / Reject\n\nMembers of the\
  \ SD Architecture group are the only people that may accept or reject an ADR.\n\n---\n\n# Analysis_ Central TLS Compliance\
  \ and Hybrid ML-KEM in SPIRE\n\nAnalysis - Hybrid ML-KEM in SPIRE\n\nHybrid ML-KEM Support for SPIFFE/SPIRE in ZTWIM - OCPSTRAT\
  \ 3123\n\nWhy is it needed ?\n\nWith the emergence of Post-Quantum Computers, they have the ability to decrypt the traditional\
  \ aka classical TLS traffic which are based on RSA or ECDH curves. In order to be Post-Quantum Cryptography (PQC) ready,\
  \ the components should be aware of ML-KEM encapsulation algorithm.\n\nWith Go 1.24+ components using TLS have the ability\
  \ to negotiate Hybrid ML-KEM as a preferred curve for key encapsulation during TLS negotiation. Although pure ML-KEM is\
  \ not yet supported by Golang because of safety net consideration, Go 1.26 is FIPS 140-3 compliant and there are two hybrid\
  \ ml-kem curves available in crypto/tls which are FIPS compliant (SecP256r1MLKEM768, SecP384r1MLKEM1024). Note that the\
  \ popular hybrid ML-KEM X25519MLKEM768 is FIPS non compliant since X25519 is FIPS non compliant.\n\nConcern: Overlap with\
  \ OCPSTRAT-3145\n\nThere is an overlap with OCPSTRAT-3145, which introduces feature-gated support for the groups field in\
  \ TLSSecurityProfile. This initiative is currently targeted for OpenShift Container Platform (OCP) 5.1.\n\nAvailable Options\n\
  \nOption 1: Wait for groups support in OCP 5.1\n\nDefer integration with TLSSecurityProfile.groups until OCP 5.1. Until\
  \ then, users can enable require_pq_kem while operating in CREATE_ONLY_MODE to enforce Hybrid ML-KEM on SPIRE operand TLS\
  \ endpoints. Once we have support for TLSSecurityProfile.groups, we can parse and inject the security posture TLS settings\
  \ like: minTLSVersion, CipherSuites and Curves directly from the centrally configured knob (completely aligned with Openshift)\n\
  \nPros\n\nAvoids introducing interim configuration mechanisms.\n\nAligns directly with the long-term OpenShift TLS configuration\
  \ model.\n\nCons\n\nHybrid ML-KEM enforcement is only available in CREATE_ONLY_MODE until OCP 5.1.\n\nOption 2: Introduce\
  \ require_pq_kem at the operand level\n\nExpose a require_pq_kem field in the Operand CR to allow applications to explicitly\
  \ strengthen their TLS posture independent of the cluster-wide TLSSecurityProfile.\n\nOnce support for TLSSecurityProfile.groups\
  \ becomes available, the operand can implement the following precedence:\n\nIf an application-specific require_pq_kem is\
  \ configured, honor that setting.\n\nOtherwise, fall back to the centrally managed TLSSecurityProfile.\n\nThis allows application-specific\
  \ TLS policy while remaining compatible with future centralized configuration.\n\nOption 3: Conditionally honor require_pq_kem\
  \ based on the groups feature gate\n\nMonitor the availability of the groups feature gate.\n\nUntil the feature gate is\
  \ enabled, honor the Operand CR's require_pq_kem setting.\n\nOnce the feature gate is enabled, stop honoring the operand-level\
  \ setting and instead rely exclusively on the centralized TLSSecurityProfile.\n\nChallenges\n\nOperational complexity: The\
  \ behavior changes depending on feature gate state, resulting in multiple execution paths that increase implementation and\
  \ maintenance complexity.\n\nConfiguration precedence: Users must understand changing precedence rules between operand-level\
  \ configuration and the centralized TLS profile, which can be confusing.\n\nFeature gate does not imply configuration: Enabling\
  \ the groups feature gate does not guarantee that the groups field has actually been configured in the TLSSecurityProfile.\
  \ The system cannot infer that Hybrid ML-KEM is being enforced simply because the feature is available.\n\nLimited flexibility:\
  \ This effectively becomes an all-or-nothing model. Once centralized groups support is used, there is no mechanism for application-specific\
  \ TLS posture, except when operating in CREATE_ONLY_MODE.\n\nThe outcome expected as per OCPSTRAT-3123\n\nuser workload\
  \ identity interactions leveraging SPIRE-issued credentials (SVIDs) use quantum-resistant key exchange. This applies specifically\
  \ to:\n\nSPIRE Server ↔ SPIRE Agent communication for identity issuance\n\nWorkload ↔ Workload mTLS using SPIFFE SVIDs\n\
  \nUser workload communication that relies on SPIRE-provided identities\n\nWith this change, users can configure and enforce\
  \ ML-KEM-only or hybrid PQC modes for workload identity workflows, ensuring no downgrade to classical cryptography during\
  \ TLS handshakes. i.e. User workloads using SPIFFE/SPIRE identities support:\n\nML-KEM\n\nHybrid X25519MLKEM768\n\nAll SPIRE-based\
  \ identity issuance and mTLS communication are quantum-safe. Users can:\n\nVerify negotiated key exchange in workload-to-workload\
  \ communication\n\nEnforce no downgrade to classical cryptography\n\nConsistent quantum-safe posture across:\n\nIdentity\
  \ issuance (SPIRE)\n\nWorkload mTLS using SVIDs\n\nOther Information from OCPSTART-3123\n\nPQC Support in Workload Identity\
  \ Workflows. The following must support ML-KEM / hybrid:\n\nSPIRE Server ↔ SPIRE Agent com\tmunication\n\nWorkload ↔ Workload\
  \ mTLS using SPIFFE SVIDs\n\nAny user workload communication relying on SPIRE-issued identities\n\nDefault Behavior\n\n\
  Hybrid X25519MLKEM768 is preferred and default where supported\n\nConfigurability\n\nProvide configuration options:\n\n\
  hybrid (default)\n\nMlkem-only\n\nclassical (explicit fallback only)\n\nConfiguration exposed via:\n\nOperator CRD (primary)\n\
  \nEnvironment variables / flags (secondary)\n\nDowngrade Protection\n\nOptional strict mode:\n\nReject connections not using\
  \ ML-KEM or hybrid\n\nFail handshake if PQC is not negotiated\n\nObservability\n\nExpose TLS negotiation details:\n\nCurveID\
  \ (e.g., X25519MLKEM768)\n\nHandshake characteristics\n\nMetrics/logs:\n\nPQC vs classical handshake ratio\n\ndowngrade\
  \ attempts\n\nEnable validation via tooling (e.g., ML-KEM checker extended to SPIRE endpoints) \n\n❓ Open questions on OCPSTRAT-3123\n\
  \nNeed clarification on the difference between following\n\nWorkload ↔ Workload mTLS using SPIFFE SVIDs\n\nUser workload\
  \ communication that relies on SPIRE-provided identities\n\nThe operator exposes the prometheus metric endpoint. Do we need\
  \ ML-KEM applicable there as well or is this Operand specific?\n\nOCPSTRAT explicitly mentions for the support of Pure ML-KEM\
  \ something not supported by Go crypto/tls package at this point of time because of safety net reason\n\nNegotiation of\
  \ ML-KEM curve as part of workload<->workload communication is completely dependant on the client & server TLS configuration\
  \ of the workload under question\n\nHowever, as part of testing we can use a workload capable of Hybrid ML-KEM and then\
  \ test if this algorithm is chosen for TLS whenever they are using SPIRE generated SVID\n\nConfiguration \n\nCurrently the\
  \ upstream supports a flag called as experimental.require_pq_kem which controls the enforcement behaviour. If set to true,\
  \ then applicable TLS endpoints will reject the client if hybrid ML-KEM is not supported. Can we stick with same flag or\
  \ something different?\n\nThere is a TLS endpoint each in OIDC Discovery provider (for exposing public keys used for JWT\
  \ verification by workloads) and Spire Controller manager (webhook for validating clusterSpiffeID CRDs). The problem is\
  \ that if hybrid ML-KEM is enforced on these two endpoints then it might break since the clients might be PQC unaware (workload\
  \ and k8s api server being the client in each case respectively). Options are to expose the flag at Operands level instead\
  \ of Operator or exclude the above mentioned endpoints from hybrid ML-KEM. (Note that all openshift k8s version are not\
  \ using Go 1.24+)\n\nWhen requirePQKEM is opted for, then all the connections which can’t comply with this will be rejected.\
  \ This behaviour is guaranteed by Golang. We can confirm the same during our testing\n\nRegarding the observability requirements\
  \ for hybrid ML-KEM support, I evaluated exposing TLS negotiation details such as selected CurveID (for example X25519MLKEM768),\
  \ handshake characteristics, PQC/classical handshake ratio, and downgrade detection.\n\nFor Go components, these details\
  \ are primarily negotiated and handled within the TLS library layer. Application code typically gets control only after\
  \ a successful TLS handshake is completed, so failed negotiation attempts or downgrade scenarios are not reliably visible\
  \ at the application layer without deeper TLS instrumentation/customization.\n\nAdding application-level metrics/logging\
  \ for every TLS negotiation may also introduce additional complexity because this information is connection-level rather\
  \ than request-level, and high connection volume could generate significant telemetry noise. It is also not a common pattern\
  \ for services to emit low-level TLS handshake telemetry from business/application code.\n\nFor validation, I suggest we\
  \ cover this through dedicated TLS verification tooling as part of our PQC enablement/testing strategy. Tools such as OpenSSL,\
  \ Openshift TLS scanner, or an extended ML-KEM checker for SPIRE endpoints can directly validate:\n\nnegotiated key exchange\
  \ group / CurveID\n\nML-KEM vs classical negotiation behavior\n\ncompatibility scenarios\n\ndowngrade behavior\n\nWe can\
  \ capture these validation results as part of the test evidence and documentation for the Epic.\n\nIf runtime visibility\
  \ becomes a strict requirement later, we may need to evaluate lower-level options such as TLS library instrumentation, proxy/sidecar-level\
  \ telemetry, or custom handshake hooks rather than implementing it directly inside each application component.\n\nSignificance\
  \ of Hybrid ML-KEM in ZTWIM Operator and Operands\n\nFollowing are the list of TLS-exposing surface that must align with\
  \ Hybrid ML-KE in Operands:\n\nSPIRE Server — gRPC TCP API (:8081)- one used by SPIRE Agent, federation bundle endpoint\
  \ (:8443), prometheus server (:8082)\n\nExperimental require_pq_kem config variable Above mentioned endpoints already honor\
  \ the require_pq_kem setting!\n\nOIDC Discovery Provider — HTTPS served for getting public keys (:8443)\n\nSPIRE Controller\
  \ Manager — webhook server for CRD admission. Invoked by k8s apiserver for CR validation (:9443)\n\nWe will need to ensure\
  \ the following integrations are working as expected\n\nUpstream Authority\n\nOSSM\n\nProposed High Level Implementation\n\
  \nrequirePQKEM will be the boolean flag which enforces hybrid ml-kem in the Operands. Each Operand CR will have its own\
  \ feature toggle flag.\n\nBy default, Operand TLS endpoints will be working in classical mode by offering ml-kem as the\
  \ preferred curve but falling back to classical curve if the client doesn't support.  \n\nZTWIM Operator will evaluate the\
  \ CR and then injects them to Operan configmap.\n\nChange in the config hash will cause rolling updates in the Operands\n\
  \nSPIRE Operands parse the config and applies the TLS Configuration into TLS Surfaces exposed by them\n\nDownstream Changes\
  \ (ZTWIM Operator)\n\nUpstream Changes (SPIRE, SPIRE Controller Manager)\n\nWe need to make the following changes as part\
  \ of upstream PR.\n\nAll upstream changes follow the same pattern: read from config, parse, apply.\n\nChange Propagation\
  \ Flow\n\nUser updates the requirePQKEM flag in the respective Operand CR\n\nReconcilers resolve profile → update configMap\
  \ and the config hash change restarts operand workloads\n\nNew operand pods start with updated TLS settings from config\n\
  \nVerification\n\ntls-scanner against all applicable TLS endpoints to detect ML-KEM is being offered and used\n\nWe need\
  \ to figure out what can be covered in tls-scanner and what not: github.com/openshift/tls-scanner . We may need to use lower\
  \ level tools like openssl if required.\n\nOperator reconciliation on CR change\n\nKnown Pitfalls\n\nGo 1.26 is FIPS 140-3\
  \ compliant and there are two hybrid ml-kem curves available in crypto/tls which are FIPS compliant (SecP256r1MLKEM768,\
  \ SecP384r1MLKEM1024). Note that the popular hybrid ML-KEM X25519MLKEM768 is FIPS non compliant since X25519 is FIPS non\
  \ compliant.\n\nCurrently the SPIRE Operands are using Go 1.26. But the operator is using 1.25.7. We may need to upgrade\
  \ Go version in our operator to 1.26\n\nIt’s suggested to keep the requirePQKEM at Operand level instead of Operator Level.\
  \ Reason being that there are two such TLS endpoints which can inherently support PQKEM but the client must be able to support\
  \ it:\n\nOIDC Discovery Config which exposes an endpoint for the client to verify the token. If client don’t support, then\
  \ the downgrade is not allowed & hence rejection of TLS handshake\n\nSpire Controller Manager which exposes an webhook endpoint\
  \ for k8s API Server to validate CRD. There are k8s api servers which are not Go 1.24+ where hybrid ML-KEM is unaware. This\
  \ affects CRD validation \n\nJira Epic and Story Point Estimation Placeholder\n\nJIRA Status: OCPSTRAT: https://redhat.atlassian.net/browse/OCPSTRAT-3123\
  \ Epic is not yet created\n\nStory pointing\n\nAnalysis - Central TLS Profile Consistency\n\nCentralized TLS Profile Compliance\
  \ for ZTWIM and SPIRE Operands - OCPSTRAT 2611\n\nJIRA Status: Epic https://redhat.atlassian.net/browse/SPIRE-359 created\
  \ by Ramona Sidharta and assigned to Nandan Hegde\n\nTLS Profile Definition: A TLS profile specifies the complete TLS configuration\
  \ for a component, including:\n\nTLS protocol versions (TLS 1.1 aka Old,  TLS 1.2 aka Intermediate, TLS 1.3 aka Modern)\n\
  \nCipher suites (e.g., ECDHE-RSA-AES128-GCM-SHA256)-not applicable for TLS 1.3\n\nCurve preferences, now renamed as “groups”\
  \ (openshift/api#2583)\n\nWhy is it needed ?\n\nHardcoding TLS configuration creates a security vulnerability because it\
  \ does not align with our evolving, centrally managed security policy for Post-Quantum Cryptography (PQC) readiness. Components\
  \ must dynamically inherit TLS settings from the designated global configuration source rather than managing them locally.\
  \ Worth noting that we can have application specific TLS configuration as well by overriding (example: requirePQKEM for\
  \ enabling hybrid ML-KEM in spire components)\n\nThe outcome expected as per OCPSTRAT-2611\n\nAll local or hardcoded TLS\
  \ configurations (protocols, ciphers, curves) have been removed from the solution codebase and deployment scripts\n\nThe\
  \ component has been updated to successfully fetch and apply the TLS policy from the central configuration source (API Server\
  \ is the default, Kubelet, or Ingress configuration)\n\nDesignated knob for the ztwim case is API Server\n\nA security re-scan\
  \ using tls-scanner confirms the service endpoint is now fully compliant with the current global TLS policy\n\nThe service\
  \ remains stable, functional, and accessible to legitimate clients after the changes are deployed\n\nThe component explicitly\
  \ respects all TLS profile settings (does not rely on Go defaults)\n\nIf using Semgrep to help detect code snippets, consider\
  \ reviewing the results to identify any remaining hardcoded TLS configurations (note: false positives are common)\n\nWe\
  \ currently are not using Semgrep\n\nFunctional testing confirms the component accepts only permitted TLS profile settings\
  \ (including when using a custom TLS profile)\n\nThe component is set up for PQC readiness in one pass by properly adhering\
  \ to all aspects of the configured TLS profile\n\nAs part of this, we need to also test the hybrid ML-KEM support when the\
  \ server and client supports it. This has been added in FAQ\n\nOther Information from OCPSTART-2611\n\nDefault profile used\
  \ is Intermediate profile\n\nTLS 1.3 supports Hybrid ML-KEM key encapsulation when both endpoints have it enabled. Using\
  \ an intermediate compatibility profile doesn't prevent this; clients capable of TLS 1.3 will still negotiate it, if the\
  \ server offers it.\n\nTLS settings should apply to all CRs that an operator manages and not just the operator itself.\n\
  \nThis work does not affect TLS client settings (no changes required), only TLS server settings.\n\nWe can have application\
  \ specific TLS configuration as well by overriding (example: requirePQKEM for enabling hybrid ML-KEM in spire components)\n\
  \nKnown Things So Far...\n\nWhenever the user changes or updates the config.openshift.io/apiserver resource in terms of\
  \ minTLSVersion/cipherSuite/tlsAdherence value, then the watch enabled in the operator code fires and this causes a rollout\
  \ update for both operator and operands. This is as per the directive & guidelines established which all operators are following.\n\
  \nGroups addition to the config.openshift.io/apiserver resource is part of a recent PR: openshift/api PR #2583 — TLS groups\
  \ field. Conversation is going on in the channel about the helper functions being made available to parse the groups and\
  \ make it available to application code (for the sake of similar handling, a common parsing logic is expected to be provided\
  \ by platform as per guidelines)\n\nPR has been opened to address the parsing of Groups\n\nhttps://github.com/openshift/library-go/pull/2347\n\
  \nhttps://github.com/openshift/controller-runtime-common/pull/22 \n\nNote that the helper parser made available by the platform\
  \ team already handles vague values and values being absent (feature gated). But, whenever there is a temporary failure\
  \ (i.e. apiserver down or timeout) to fetch the tlsAdherence/tlsProfile from config.openshift.io/apiserver object, we have\
  \ two options:\n\nFallback to default intermediate profile (examplePR:https://github.com/openshift/cluster-control-plane-machine-set-operator/blob/85f92f79174d6df783f631eb3187f0e11e89cc96/pkg/tls/tls.go\
  \  )\n\nLog the fatal error and operator restarts (examplePR: https://github.com/openshift/cluster-machine-approver/pull/286/changes#diff-2873f79a86c0d8b3335cd7731b0ecf7dd4301eb19a82ef7a1cba7589b5252261\
  \ )\n\nThis will cause restart loop until the server is up\n\nPermanent crashloop in case of non openshift\n\nI am following\
  \ up on this in channel to get guidance on what is the recommended approach here\n\nRecommended approach is to use the default\
  \ fallback (given by SME ddonati) since the watch+reconcile is always going to be there to monitor for any changes in the\
  \  config.openshift.io/apiserver resource\n\nGo 1.26 is FIPS 140-3 compliant and there are two hybrid ml-kem curves available\
  \ in crypto/tls which are FIPS compliant (SecP256r1MLKEM768, SecP384r1MLKEM1024). Note that the popular hybrid ML-KEM X25519MLKEM768\
  \ is FIPS non compliant since X25519 is FIPS non compliant.\n\nCurrently the SPIRE Operands are using Go 1.26. But the operator\
  \ is using 1.25.7. We may need to upgrade Go version in our operator to 1.26\n\nSignificance of centralized TLS on ZTWIM\
  \ Operator and Operands\n\nFollowing are the list of TLS-exposing surface that must align with central policy:\n\nOperator\n\
  \nPrometheus Endpoint - which is served on 8443 port and is served on HTTPS on demand.\n\nWebhook Endpoint - This endpoint\
  \ is created in the code base as part of operator SDK scaffolding and not initialized as per my understanding. Need to double\
  \ check if the port is exposed in the operator pod during runtime.\n\nOperands\n\nSPIRE Server — gRPC TCP API (:8081)- one\
  \ used by SPIRE Agent, federation bundle endpoint (:8443), prometheus server (:8082)\n\nOIDC Discovery Provider — HTTPS\
  \ served for getting public keys (:8443)\n\nSPIRE Controller Manager — webhook server for CRD admission. Invoked by k8s\
  \ apiserver for CR validation (:9443)\n\nSPIRE \tAgent Socket (UDS only, no TLS)\n\nAlso, we do not explicitly call out\
  \ the non compliance today by setting features.operators.openshift.io/tls-profiles: \"false\". Once we start supporting\
  \ the central TLS config we need to mark this as true.\n\nHigh Level Changes Needed\n\nTwo-Layer Implementation\n\nLayer\
  \ 1 (Direct): ZTWIM operator uses controller-runtime-common/pkg/tls to fetch and watch the cluster TLS profile and tlsAdherence\
  \ for its own metrics and webhook servers. On profile change or on tlsAdherence change the SecurityProfileWatcher cancels\
  \ the context, causing a graceful restart.\n\nLayer 2 (Injected): ZTWIM operator reconcilers resolve the cluster TLS profile\
  \ into concrete MinTLSVersion and CipherSuites values, then inject them as config variables into SPIRE operand containers.\
  \ ConfigMap hash changes trigger rolling restarts.\n\nDownstream Changes (ZTWIM Operator)\n\nUpstream Changes (SPIRE, SPIRE\
  \ Controller Manager)\n\nWe need to make the following changes as part of upstream PR.\n\nAll upstream changes follow the\
  \ same pattern: read from config, parse, apply. Fall back to current behavior (TLS 1.2, Go default ciphers) when config\
  \ is unset. Experimental require_pq_kem config variable in Spire-server takes precedence if set.\n\nChange Propagation Flow\n\
  \nCluster admin changes either \n\nTLS profile on apiserver.config.openshift.io/cluster OR\n\ntlsAdherencePolicy on apiserver.config.openshift.io/cluster\n\
  \nZTWIM operator SecurityProfileWatcher fires → operator restarts with new profile on its own TLS servers\n\nReconcilers\
