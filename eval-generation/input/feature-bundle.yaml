enhancement_proposal: "# EP: network-policy-for-zero-trust-workload-identity-management.md\n\n---\ntitle: network-policy-for-zero-trust-workload-identity-management\n\
  authors:\n  - TBD\nreviewers:\n  - TBD\napprovers:\n  - TBD\napi-approvers:\n  - None\ncreation-date: 2026-04-08\nlast-updated:\
