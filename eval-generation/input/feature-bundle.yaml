  \ / Reject (Scope: HCM-Org)\n\n### Product Management\n\n| Product Management Member | Date | Accept or Reject with Reason\
  \ |\n|--------------------------|------|------------------------------|\n| | | |\n\n### HCM Architecture\n\n| HCM Arch Member\
