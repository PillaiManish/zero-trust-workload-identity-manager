  \ literal addition), 24 lines of mechanical test updates (same SDS block × 6 test cases). |\n| Rollback safety | Yes | git\
  \ revert of the single commit cleanly reverts all changes. Verified: make verify + make test both pass after revert. No\
  \ database migrations, no CRD changes, no irreversible state. |\n\n\n---\n\n# docs/network-policy-adr.md\n\n# HCM ADR: Network\
  \ Policies for Zero Trust Workload Identity Manager\n\nImplement default-deny and fine-grained NetworkPolicy resources for\
  \ the ZTWIM operator and all its operands to enforce least-privilege network access.\n\n| Field | Value |\n|-------|-------|\n\
  | **Date** | 2026-07-27 |\n| **Scope** | HCM-Org |\n| **Status** | Draft, status changed date: 2026-07-27 |\n| **Abandoned\
  \ Reason** | N/A |\n| **Authors** | `<@authors>` |\n| **Sponsor** | `<@HCM Arch sponsor>` |\n| **Product Manager** | `<@PM>`\
  \ |\n| **Supersedes** | N/A |\n| **Superseded By** | N/A |\n| **Tickets** | [SPIRE-212](https://issues.redhat.com/browse/SPIRE-212)\
  \ |\n| **Other docs** | [Enhancement PR #1856](https://github.com/openshift/enhancements/pull/1856), [Planning Analysis](network-policy-planning-analysis.md)\
  \ |\n\n---\n\n## Executive Summary\n\nAll ZTWIM components (operator, SPIRE server, SPIRE agent, OIDC discovery provider,\
  \ SPIFFE CSI driver) run in the `zero-trust-workload-identity-manager` namespace without network restrictions. This ADR\
  \ proposes deploying a default-deny NetworkPolicy plus fine-grained per-component ingress/egress policies to enforce least-privilege\
  \ network access. The operator's policy is static (shipped in the OLM bundle); operand policies are operator-managed (reconciled\
  \ by each controller). No API changes are required.\n\n---\n\n## What\n\nThis ADR covers the introduction of Kubernetes\
  \ `NetworkPolicy` resources for every ZTWIM component within the `zero-trust-workload-identity-manager` namespace, targeting\
  \ OCP 5.0:\n\n- **Operator controller** -- static NetworkPolicy shipped via OLM bundle\n- **SPIRE Server** (including controller\
  \ manager) -- operator-managed policies\n- **SPIRE Agent** -- operator-managed policies\n- **OIDC Discovery Provider** --\
  \ operator-managed policies\n- **SPIFFE CSI Driver** -- no NetworkPolicy needed (Unix socket communication only)\n\n---\n\
  \n## Why\n\nThe ZTWIM operator manages security-critical SPIFFE/SPIRE infrastructure. Today, none of the pods have network\
  \ restrictions:\n\n- A compromised pod can reach any other pod in the cluster or any external endpoint.\n- There is no network-level\
  \ enforcement of the zero-trust principles this operator exists to provide.\n- NetworkPolicies are a baseline security expectation\
  \ for platform workloads on OpenShift.\n- The [cert-manager operator](https://github.com/openshift/enhancements/blob/master/enhancements/cert-manager/cert-manager-network-policies.md)\
  \ already ships with equivalent policies -- ZTWIM should follow the same pattern.\n\n---\n\n## Goals\n\n- Deploy a default-deny\
  \ NetworkPolicy for all pods in the ZTWIM namespace.\n- Define fine-grained ingress/egress rules for each component based\
  \ on actual traffic analysis.\n- Operator automatically creates and reconciles operand NetworkPolicies during operand installation.\n\
  - No API changes required -- policies are predefined, no user configuration needed.\n- No functional regression -- all existing\
  \ traffic flows (metrics, webhooks, federation, agent attestation) continue to work.\n- Metrics collection by Prometheus\
  \ remains functional for all components.\n\n---\n\n## Non-Goals\n\n- User-configurable network policies. All policies are\
  \ predefined based on traffic analysis.\n- AdminNetworkPolicy or cluster-wide policy management. Standard `NetworkPolicy`\
  \ objects are sufficient.\n- Network policies for workloads consuming SPIFFE identities -- only for ZTWIM infrastructure\
  \ components.\n- Changing or extending the ZTWIM CRD API.\n\n---\n\n## How\n\n### Architecture\n\n![ZTWIM Network Policy\
  \ Architecture](../assets/ztwim-network-policy-architecture.png)\n\n### Traffic Matrix\n\n| Component | Direction | Port\
  \ | Protocol | Peer | Condition |\n|-----------|-----------|------|----------|------|-----------|\n| Operator | Egress |\
  \ 6443 | TCP | API Server | Always |\n| Operator | Ingress | 8443 | TCP | openshift-monitoring (Prometheus) | Always |\n\
  | SPIRE Server | Ingress | 8081 | TCP | SPIRE Agent (same namespace) | Always |\n| SPIRE Server | Ingress | 9443 | TCP |\
  \ Any (API Server webhook callbacks) | Always |\n| SPIRE Server | Ingress | 9402 | TCP | openshift-monitoring (Prometheus)\
  \ | Always |\n| SPIRE Server | Ingress | 8082 | TCP | openshift-monitoring (Prometheus, controller-manager metrics) | Always\
  \ |\n| SPIRE Server | Ingress | 8443 | TCP | openshift-ingress (OpenShift Router) | When federation enabled |\n| SPIRE Server\
  \ | Egress | 6443 | TCP | API Server | Always |\n| SPIRE Server | Egress | 5353 | TCP+UDP | openshift-dns (CoreDNS) | Always\
  \ |\n| SPIRE Server | Egress | 443 | TCP | Remote federation endpoints (via Route) | When federation enabled |\n| SPIRE\
  \ Server | Egress | user-specified | TCP | Vault server (typically 8200 or 443) | When upstreamAuthority.vault configured\
  \ |\n| SPIRE Server | Egress | user-specified | TCP | External DB (typically 5432/postgres or 3306/mysql) | When databaseType\
  \ is not sqlite3 |\n| SPIRE Server | Egress | user-specified | TCP | HTTP/HTTPS proxy endpoint | When cluster proxy configured\
  \ |\n| SPIRE Agent | Egress | 8081 | TCP | SPIRE Server (same namespace) | Always |\n| SPIRE Agent | Egress | 6443 | TCP\
  \ | API Server | Always |\n| SPIRE Agent | Ingress | 9402 | TCP | openshift-monitoring (Prometheus) | Always |\n| SPIRE\
  \ Agent | Egress | 5353 | TCP+UDP | openshift-dns (CoreDNS) | Always |\n| SPIRE Agent | Egress | user-specified | TCP |\
  \ HTTP/HTTPS proxy endpoint | When cluster proxy configured |\n| OIDC Provider | Ingress | 8443 | TCP | openshift-ingress\
  \ (OpenShift Router) | Always |\n| OIDC Provider | Egress | user-specified | TCP | HTTP/HTTPS proxy endpoint | When cluster\
  \ proxy configured |\n| SPIFFE CSI Driver | -- | -- | -- | Unix socket only | No NetworkPolicy needed |\n\n**Notes on the\
  \ traffic matrix:**\n\n- **Webhook ingress (9443):** The API server calls the spire-controller-manager webhook during admission\
  \ control. The API server's source IP is not predictable across cluster topologies (standalone, HyperShift, etc.), so the\
  \ ingress rule on port 9443 must be open without a `from` restriction.\n- **Federation ingress (8443):** Traffic arrives\
  \ via the OpenShift Router in the `openshift-ingress` namespace. The ingress rule should use a namespace selector for `openshift-ingress`.\n\
  - **Federation egress (443, not 8443):** The local SPIRE server listens on 8443, but remote federation endpoints are accessed\
  \ via OpenShift Routes at port 443. The `bundleEndpointUrl` in the CR determines the actual port.\n- **Controller manager\
  \ metrics (8082):** Distinct from the health port (8083). Port 8082 is the Prometheus metrics bind address; 8083 is the\
  \ health probe bind address. Both are on the spire-controller-manager sidecar within the SPIRE Server pod.\n- **Health probes:**\
  \ All components use kubelet HTTP probes (ports 8080, 8083, 9982, 8008, 9809). Kubelet probes originate from the host network\
  \ and bypass NetworkPolicy -- no ingress rules are needed for health probes.\n- **Vault / External DB / Proxy egress:**\
  \ These are user-specified endpoints with variable ports. Since NetworkPolicy requires concrete port numbers, these conditional\
  \ egress rules cannot be fully predefined. See \"Conditional Policies\" below for the approach.\n- **OIDC Provider:** Does\
  \ NOT need API server egress. It has no RBAC, no kubeconfig, and no in-cluster config. Its only data source is the SPIRE\
  \ Agent Workload API via a Unix domain socket (CSI volume).\n\n### Policy Ownership\n\n| Component | Policies | Managed\
  \ by |\n|-----------|----------|------------|\n| Operator | operator egress (API server), operator ingress (metrics) | OLM\
  \ bundle (static YAML in `config/network-policy/`) |\n| Deny-all (namespace-wide) | deny-all ingress + egress for all pods\
  \ | SpireServer controller |\n| SPIRE Server | ingress (agent, webhook, metrics, federation), egress (API server, DNS, federation,\
  \ Vault, external DB, proxy) | SpireServer controller |\n| SPIRE Agent | egress (server, API server, DNS, proxy), ingress\
  \ (metrics) | SpireAgent controller |\n| OIDC Provider | ingress (HTTPS from router), egress (proxy only, if configured)\
  \ | OIDC controller |\n| SPIFFE CSI Driver | None | -- |\n\n### Baseline: Deny-All\n\nA single namespace-wide NetworkPolicy\
  \ applied to all pods (`podSelector: {}`), blocking all ingress and egress unless explicitly allowed by component-specific\
  \ policies. Reconciled by the SpireServer controller.\n\n### Conditional Policies\n\nThe following policies are only created\
  \ when the corresponding feature is configured:\n\n| Condition | Policies created |\n|-----------|-----------------|\n|\
  \ `spireServer.spec.federation` is set | Federation ingress (8443 from openshift-ingress), federation egress (443 to remote\
  \ endpoints) |\n| `spireServer.spec.upstreamAuthority.vault` is set | Vault egress (port from `vaultAddr` URL, typically\
  \ 8200 or 443) |\n| `spireServer.spec.datastore.databaseType` is not `sqlite3` | External DB egress (port from connection\
  \ string, typically 5432 or 3306) |\n| Cluster proxy is configured (`HTTP_PROXY`/`HTTPS_PROXY` env vars present) | Proxy\
  \ egress for SPIRE server, SPIRE agent, and OIDC provider |\n\nCleanup must occur when the condition is removed (e.g., federation\
  \ disabled, vault switched to cert-manager, DB switched back to sqlite3).\n\n**Note on user-specified ports (Vault, DB,\
  \ proxy):** Since these ports are not fixed, the operator must parse the user-provided URL or connection string to extract\
  \ the port for the NetworkPolicy egress rule. If parsing is not feasible, an alternative is to allow all egress on TCP for\
  \ the SPIRE server pod when these features are configured (broader but simpler).\n\n### Pod Selectors\n\n| Component | Pod\
  \ selector |\n|-----------|-------------|\n| Operator | `name: zero-trust-workload-identity-manager` |\n| SPIRE Server |\
  \ `app.kubernetes.io/name: spire-server` |\n| SPIRE Agent | `app.kubernetes.io/name: spire-agent` |\n| OIDC Provider | `app.kubernetes.io/name:\
  \ spiffe-oidc-discovery-provider` |\n\n### Namespace Selectors\n\nMonitoring (Prometheus scraping):\n\n```yaml\nnamespaceSelector:\n\
  \  matchLabels:\n    kubernetes.io/metadata.name: openshift-monitoring\n```\n\nDNS (CoreDNS resolution):\n\n```yaml\nnamespaceSelector:\n\
  \  matchLabels:\n    kubernetes.io/metadata.name: openshift-dns\npodSelector:\n  matchLabels:\n    dns.operator.openshift.io/daemonset-dns:\
  \ default\n```\n\nOpenShift Router (federation ingress, OIDC ingress):\n\n```yaml\nnamespaceSelector:\n  matchLabels:\n\
  \    kubernetes.io/metadata.name: openshift-ingress\n```\n\n### Implementation Approach\n\n- **Operator policy**: Enable\
  \ and update the existing static NetworkPolicy YAML at `config/network-policy/allow-metrics-traffic.yaml`. Add an API server\
  \ egress policy. Include both in the OLM bundle.\n- **Operand policies**: Add NetworkPolicy YAML templates to `bindata/`\
  \ (alongside existing Service/RBAC templates). Each operand controller reconciles its NetworkPolicies using the existing\
  \ get-or-create-then-update pattern.\n- **No config hash inclusion**: NetworkPolicy changes must NOT be included in the\
  \ config hash annotations that drive StatefulSet/DaemonSet rolling updates, since they don't affect pod configuration.\n\
  \n### Testing and Verification\n\n- All existing E2E tests run with NetworkPolicies enabled -- validates no functional regression.\n\
  - Dedicated negative tests: verify blocked traffic on non-allowed ports using a curl pod.\n- Validate Prometheus metrics\
  \ scraping continues to work.\n- Validate federation traffic works when federation is enabled.\n- Validate webhook traffic\
  \ from API server to spire-controller-manager.\n\n### Migration / Upgrade\n\n- No user migration required. Policies are\
  \ deployed automatically.\n- Risk: during upgrade from a version without policies to one with them, deny-all could be applied\
  \ before allow policies are reconciled, causing a brief disruption. Mitigation: reconcile allow policies before deny-all\
  \ in the controller, or reconcile all policies in a single reconciliation pass.\n\n### Open Questions (Known Unknowns)\n\
  \n1. Is OpenShift DNS still on port 5353 in OCP 5.0?\n2. Determine deny-all ownership behavior if SpireServer CR is deleted\
  \ while other operands are running.\n3. Validate that deny-all + allow policies are applied atomically during upgrade.\n\
  4. For Vault/external DB/proxy egress: should the operator parse user-provided URLs to extract ports for fine-grained egress\
  \ rules, or allow broad TCP egress for the SPIRE server when these features are configured?\n5. Should the webhook ingress\
  \ (9443) be restricted to the `openshift-kube-apiserver` namespace, or left open (no `from` restriction) to handle all cluster\
  \ topologies (standalone, HyperShift, etc.)?\n\n**Resolved from review:**\n\n- **Controller manager metrics port:** Confirmed\
  \ as **8082** (distinct from health port 8083). Added to traffic matrix.\n- **OIDC provider API server egress:** Confirmed\
  \ **NOT needed**. OIDC provider has no RBAC, no kubeconfig, and no Kubernetes client. Removed from traffic matrix.\n- **Health\
  \ probes:** All kubelet HTTP probes bypass NetworkPolicy (originate from host network). No ingress rules needed.\n- **Federation\
  \ egress port:** Corrected to **443** (via OpenShift Route), not 8443.\n\n---\n\n## Cost Estimates\n\nNo infrastructure\
  \ cost changes. This is a software-only enhancement using standard Kubernetes NetworkPolicy resources. No additional network\
  \ transit costs.\n\n---\n\n## Alternatives\n\n### Alternative 1: Single Combined Policy per Component\n\nCreate one large\
  \ NetworkPolicy per component containing all ingress and egress rules in a single object.\n\n**Rejected because:** Multiple\
  \ smaller, focused policies (one for API server egress, one for metrics ingress, etc.) are easier to understand, debug,\
  \ and manage independently.\n\n### Alternative 2: Namespace-level Deny-All Only (No Per-component Targeting)\n\nApply a\
  \ single `podSelector: {}` deny-all and allow rules without targeting specific pods.\n\n**Rejected because:** Per-component\
  \ targeting with specific pod selectors is more explicit and ensures policies are clearly associated with the component\
  \ they protect.\n\n### Alternative 3: AdminNetworkPolicy\n\nUse cluster-scoped AdminNetworkPolicy resources for stronger\
  \ enforcement.\n\n**Rejected because:** Standard NetworkPolicy objects are sufficient for this scope and do not require\
  \ cluster-admin privileges to manage.\n\n### Impact of Not Doing This\n\nZTWIM components remain without network restrictions,\
  \ which is inconsistent with the zero-trust principles the operator provides and falls below the security baseline set by\
  \ other platform operators (e.g., cert-manager).\n\n---\n\n## Security and Privacy Considerations\n\n- **This IS the security\
  \ enhancement.** It reduces the attack surface by restricting network access to only required traffic flows.\n- ZTWIM components\
  \ handle sensitive SPIFFE/SPIRE operations including CA key material, SVID issuance, and workload attestation. Network isolation\
  \ limits the blast radius of a compromised pod.\n- No personally identifiable information is handled by these components.\n\
  - The Workload API socket (SPIFFE CSI driver) uses Unix domain sockets which are not affected by NetworkPolicy -- workload\
  \ identity issuance remains functional.\n\n---\n\n## Support Considerations\n\n**Will the customer have to do anything differently\
  \ going forward?**\n\nNo. NetworkPolicies are deployed automatically with no user configuration. Customers do not interact\
  \ with these policies.\n\n**As an engineer working a support case, will anything change?**\n\nConnection timeouts in component\
  \ logs may now indicate a NetworkPolicy issue. TSEs should check that the expected NetworkPolicy objects exist in the `zero-trust-workload-identity-manager`\
  \ namespace. The OpenShift Network Observability Operator can be used to visualize traffic flows and identify blocked connections.\n\
  \n**If we do expect an impact on support engineers, what do we need to provide enablement for?**\n\nBrief documentation\
  \ on which NetworkPolicies exist, what traffic they allow, and how to diagnose NetworkPolicy-related issues (e.g., `oc get\
  \ networkpolicy -n zero-trust-workload-identity-manager`).\n\n---\n\n## Risks\n\n| Risk | Category | Likelihood | Impact\
  \ | Mitigation |\n|------|----------|------------|--------|------------|\n| Policies too restrictive, blocking legitimate\
  \ traffic | Execution | Low | High | All traffic flows identified via analysis; E2E tests validate no regression |\n| Upgrade\
  \ ordering: deny-all applied before allow policies | Operational | Medium | Medium | Reconcile allow policies before deny-all,\
  \ or reconcile all in single pass |\n| OCP 5.0 DNS port change breaks DNS egress policy | Execution | Low | High | Verify\
  \ DNS port on OCP 5.0 during implementation |\n| Monitoring namespace label change between OCP versions | Operational |\
  \ Low | Medium | Use `kubernetes.io/metadata.name` (immutable standard label) |\n| Config hash accidentally includes NetworkPolicy\
  \ changes | Operational | Low | Medium | Explicitly exclude NetworkPolicy from config hash computation |\n| Proxy-aware\
  \ environments: external egress (Vault, federation, ACME, remote DB) tunneled through proxy | Execution | Medium | High\
  \ | Add conditional proxy egress rules; respect `NO_PROXY` for internal services (already handled in operator code via `GetInternalNoProxyEntries()`)\
  \ |\n| User-specified ports for Vault/DB/proxy cannot be predefined in static policies | Execution | High | Medium | Parse\
  \ port from user-provided URLs/connection strings, or fall back to broad TCP egress for the SPIRE server pod when these\
  \ features are configured |\n\n### Risk Summary\n\n| Business Impacts | Mitigations |\n|-----------------|-------------|\n\
  | No business impact -- this is a security hardening enhancement | All risks are technical and mitigated through testing\
  \ and verification |\n\n---\n\n## Stakeholder Impacts\n\n| Group Name | Key Contacts | Date | Impacted? |\n|------------|-------------|------|-----------|\n\
  | OCP | | | |\n| CEE | | | |\n| QE | | | |\n| Security | | | |\n| Perf/Scale | | | |\n\n---\n\n## References\n\n- [Enhancement\
  \ PR #1856: Network Policy for ZTWIM](https://github.com/openshift/enhancements/pull/1856)\n- [SPIRE-212 JIRA](https://issues.redhat.com/browse/SPIRE-212)\n\
  - [Planning Analysis](network-policy-planning-analysis.md)\n- [cert-manager Network Policies Enhancement](https://github.com/openshift/enhancements/blob/master/enhancements/cert-manager/cert-manager-network-policies.md)\n\
