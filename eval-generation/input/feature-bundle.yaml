  \ change\n\nUnit tests for profile resolution and ConfigMap/StatefulSet generation\n\nIntegration test: change profile from\
  \ Intermediate to Modern, verify all endpoints comply\n\nCustom profile test: disable specific ciphers, verify not offered\
